# Existing App Service web app (Linux, .NET). Resource ids are supplied verbatim by the platform team.
apiVersion: observability/v2
kind: ServiceOnboarding
metadata:
  service: orders-web
  display_name: Orders web
  team: orders
  owner: orders-team@contoso.example
  application: orders
  domain: commerce
  tier: high
  env: prod
  repository: https://dev.azure.com/contoso/orders/_git/orders-web
  languages:
  - dotnet
  depends_on:
  - service:orders-api
  contacts:
  - type: email
    contact: orders-team@contoso.example
  region: westeurope
spec:
  architecture: appservice
  runtime: dotnet
  telemetry:
    logs:
      route: eventhub
  resources:
  - id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-orders-prod/providers/Microsoft.Web/sites/app-orders-web-prod
    type: Microsoft.Web/sites
    role: app
