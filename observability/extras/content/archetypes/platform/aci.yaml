apiVersion: observability/v1
kind: Archetype
metadata:
  name: aci
  layer: platform
  description: Azure Container Instances container groups.
match:
  architectures: [aci]
defaults:
  spec:
    telemetry:
      logs: {route: sidecar}
monitors:
  aci.not_reporting:
    scope: resource
    applies_to: {resource_types: [Microsoft.ContainerInstance/containerGroups]}
    when: ["!spec.idle_behavior.scale_to_zero"]
    name: "[[[env]]] [[service]] container group [[resource.name]] not reporting"
    type: query alert
    # Platform metric always emitted while the group runs; no data = group stopped/deleted
    # (or the Azure integration is broken - check the integration status first).
    query: "avg(last_15m):avg:azure.containerinstance_containergroups.cpu_usage{[[resource.scope]]} < [[critical]]"
    thresholds: {critical: 0}
    notify_no_data: true
    no_data_timeframe: 30
    severity: warning
    priority: 3
    summary: The container group stopped emitting platform metrics.
    troubleshooting: |-
      1. az container show -n <group> -g <rg> --query instanceView.state
      2. az container logs -n <group> -g <rg> --container-name <name>
    runbook_section: aci-not-reporting
