# Existing AKS workload + existing PostgreSQL flexible server.
apiVersion: observability/v1
kind: ServiceOnboarding
metadata:
  service: orders-api
  team: orders
  owner: orders-team@contoso.example
  application: orders
  domain: commerce
  tier: critical
  env: prod
  runbook_url: https://wiki.contoso.example/runbooks/orders-api
  languages: [java]
  depends_on: ["datastore:orders-postgresql"]
spec:
  architecture: aks
  runtime: java
  telemetry:
    profile: http-api
    dbm: {enabled: true, engine: postgres}
  resources:
    - id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-aks-prod/providers/Microsoft.ContainerService/managedClusters/aks-prod-weu
      type: Microsoft.ContainerService/managedClusters
      role: cluster
    - id: /subscriptions/00000000-0000-0000-0000-000000000000/resourceGroups/rg-data-prod/providers/Microsoft.DBforPostgreSQL/flexibleServers/psql-orders-prod
      type: Microsoft.DBforPostgreSQL/flexibleServers
      role: db
  endpoints:
    - name: internal
      url: https://orders-api.internal.contoso.example
      visibility: private
      health_path: /readyz
  slos:
    - {name: availability, type: availability, target: 99.9, timeframe: 30d}
    - {name: latency, type: latency, target: 99.0, timeframe: 30d, threshold_ms: 300}
  monitors:
    params: {pg_cpu_pct: 85}
  notifications:
    default: [orders]
    critical: [orders-pager]
