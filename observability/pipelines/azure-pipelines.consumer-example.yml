# Example consumer pipeline for an existing environment (copy into the consumer repository).
# Templates come from the package repository pinned to a release tag; the Terraform root vendors the
# matching release tarball (examples/existing-environment/vendor.sh). Keep both on the same version.
trigger:
  branches:
    include: [main]
  paths:
    include: [monitoring/**]

resources:
  repositories:
    - repository: obs
      type: git
      name: Platform/observability-package          # <project>/<repo> hosting the package
      ref: refs/tags/observability-v3.0.0

variables:
  environment: prod
  rootDir: $(Build.SourcesDirectory)/monitoring
  packageDir: $(Build.SourcesDirectory)/monitoring/.vendor/observability-3.0.0

stages:
  - stage: validate
    jobs:
      - job: onboarding
        pool:
          vmImage: ubuntu-latest
        steps:
          - checkout: self
          - bash: ./vendor.sh
            workingDirectory: $(rootDir)
            displayName: Vendor package release (sha256 verified)
          - template: pipelines/templates/validate-onboarding.yml@obs
            parameters:
              packageDir: $(packageDir)
              manifestsDir: $(rootDir)/manifests/prod
              environment: prod
              renderedDir: $(rootDir)/rendered/prod

  - stage: deploy                          # plan + apply in ONE stage: apply reads the plan job's output
    dependsOn: validate
    jobs:
      - template: pipelines/templates/terraform-plan.yml@obs
        parameters:
          rootDir: $(rootDir)
          environment: prod
          azureServiceConnection: sc-monitoring-prod
          dsv: {tenant: contoso, tld: com, identity_client_id: 00000000-0000-0000-0000-000000000000}   # self-hosted agent identity (DSV user)
          datadogApiKeyRef: dsv://monitoring/prod/datadog-api-key#value
          datadogAppKeyRef: dsv://monitoring/prod/datadog-app-key#value
          dsvFetchPath: $(packageDir)/images/dsv-fetch/dsv_fetch.py
          pool: {name: self-hosted-monitoring}                    # managed identity required for DSV
          backendConfig:
            resource_group_name: rg-tfstate
            storage_account_name: sttfstateprod
            container_name: tfstate
            key: prod/monitoring.tfstate
            use_azuread_auth: 'true'
          preSteps:
            - bash: ./vendor.sh
              workingDirectory: $(rootDir)
              displayName: Vendor package release

      - template: pipelines/templates/terraform-apply.yml@obs
        parameters:
          environment: prod
          adoEnvironment: monitoring-prod
          rootDir: $(rootDir)
          azureServiceConnection: sc-monitoring-prod
          dsv: {tenant: contoso, tld: com, identity_client_id: 00000000-0000-0000-0000-000000000000}   # self-hosted agent identity (DSV user)
          datadogApiKeyRef: dsv://monitoring/prod/datadog-api-key#value
          datadogAppKeyRef: dsv://monitoring/prod/datadog-app-key#value
          # the plan artifact contains the root incl. its vendored package
          dsvFetchPath: $(Pipeline.Workspace)/tfplan-prod/.vendor/observability-3.0.0/images/dsv-fetch/dsv_fetch.py
          pool: {name: self-hosted-monitoring}

  - stage: verify
    dependsOn: deploy
    jobs:
      - job: telemetry
        pool:
          name: self-hosted-monitoring           # managed identity mapped to a DSV user (reads the Datadog keys)
        steps:
          - checkout: self
          - bash: ./vendor.sh
            workingDirectory: $(rootDir)
          - template: pipelines/templates/deployment-marker.yml@obs
            parameters:
              packageDir: $(packageDir)
              environment: prod
              startedAt: $(System.PipelineStartTime)
              azureServiceConnection: sc-monitoring-prod
              dsv: {tenant: contoso, tld: com, identity_client_id: 00000000-0000-0000-0000-000000000000}
              datadogApiKeyRef: dsv://monitoring/prod/datadog-api-key#value
              services:
                - {name: monitoring-config, version: $(Build.BuildNumber), team: platform}
          - template: pipelines/templates/telemetry-verify.yml@obs
            parameters:
              packageDir: $(packageDir)
              environment: prod
              journeyServices: [orders-web, orders-api]
              expectedTagsDir: $(rootDir)/rendered/prod
              infraMetrics: ['avg:azure.app_services.requests{*}']
              azureServiceConnection: sc-monitoring-prod
              dsv: {tenant: contoso, tld: com, identity_client_id: 00000000-0000-0000-0000-000000000000}
              datadogApiKeyRef: dsv://monitoring/prod/datadog-api-key#value
              datadogAppKeyRef: dsv://monitoring/prod/datadog-app-key#value
