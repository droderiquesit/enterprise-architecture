# Steps template: read secrets from Delinea DSV (ADR-0001 section 14) into MASKED pipeline variables of this job.
# Uses the package's stdlib dsv-fetch (images/dsv-fetch/dsv_fetch.py): the agent's managed identity (IMDS; self-hosted
# agent with a user-assigned identity mapped to a DSV user) - or DSV_AUTH=client_credentials for a test tenant -
# authenticates to DSV. Values exist only in process memory and in a 0700 temp dir deleted in the same step; they
# are exported with issecret=true and must be mapped explicitly into the env of the steps that need them.
# Microsoft-hosted agents have no managed identity: run jobs that need secrets on the self-hosted pool.
parameters:
  - name: secrets                # map VARIABLE_NAME -> dsv://<path>#<element>
    type: object
  - name: dsv                    # {tenant, tld?, base_url?, identity_client_id?, auth? (azure)}
    type: object
  - name: dsvFetchPath           # dsv_fetch.py of the vendored package release
    type: string
  - name: displayName
    type: string
    default: Read secrets from Delinea DSV

steps:
  - bash: |
      set -euo pipefail
      out="$(mktemp -d)"; chmod 0700 "$out"; trap 'rm -rf "$out"' EXIT
      mapfile -t MAPS < <(python3 -c 'import json,os; [print(f"--map={k}={v}") for k,v in json.loads(os.environ["SECRETS_JSON"]).items()]')
      python3 -I "${{ parameters.dsvFetchPath }}" init --out "$out" --format files "${MAPS[@]}"
      for f in "$out"/*; do
        n="$(basename "$f")"
        echo "##vso[task.setvariable variable=$n;issecret=true]$(cat "$f")"
      done
      echo "read $(ls "$out" | wc -l) secret(s) from DSV (values masked)"
    displayName: ${{ parameters.displayName }}
    env:
      SECRETS_JSON: ${{ convertToJson(parameters.secrets) }}
      DSV_TENANT: ${{ parameters.dsv.tenant }}
      DSV_TLD: ${{ coalesce(parameters.dsv.tld, 'com') }}
      DSV_BASE_URL: ${{ parameters.dsv.base_url }}
      DSV_AUTH: ${{ coalesce(parameters.dsv.auth, 'azure') }}
      AZURE_CLIENT_ID: ${{ parameters.dsv.identity_client_id }}
