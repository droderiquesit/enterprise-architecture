# Steps template: read secrets from Delinea DSV (ADR-0001 section 14) into MASKED pipeline variables of this job.
# Uses the static dsv-fetch binary (package 4.0.0; dsv-fetch 2.x, no Python) from the img-dsv-fetch release zip
# (`dsv-fetch-linux-amd64`, `dsv-fetch-linux-arm64`, `dsv-fetch-windows-amd64.exe`, `SHA256SUMS`): the zip is
# downloaded once per job, checked against the pinned package_sha256 AND the SHA256SUMS inside it, and installed 0500
# into the agent temp directory. The agent's managed identity (IMDS; self-hosted agent with a user-assigned identity
# mapped to a DSV user) - or DSV_AUTH=client_credentials for a test tenant - authenticates to DSV. Values exist only
# in process memory and in a 0700 temp dir deleted in the same step; they are exported with issecret=true and must be
# mapped explicitly into the env of the steps that need them.
# Microsoft-hosted agents have no managed identity: run jobs that need secrets on the self-hosted pool.
parameters:
  - name: secrets                # map VARIABLE_NAME -> dsv://<path>#<element>
    type: object
  - name: dsv                    # {tenant, tld?, base_url?, identity_client_id?, auth? (azure)}
    type: object
  # dsv-fetch release zip: {package_url, package_sha256, auth?}. package_url/package_sha256 are the img-dsv-fetch
  # artifact record (artifacts["img-dsv-fetch"].package_url/.package_sha256, or a release you mirrored); auth:
  # managed-identity (default; Azure Storage bearer token of dsv.identity_client_id from IMDS) | none (URL with SAS /
  # internal mirror). The binary of a previous dsv-secrets step in the same job is reused when its sha256 matches.
  - name: dsvFetch
    type: object
  - name: displayName
    type: string
    default: Read secrets from Delinea DSV

steps:
  - bash: |
      set -euo pipefail
      dir="$(Agent.TempDirectory)/dsv-fetch-${PACKAGE_SHA256:0:12}"
      bin="$dir/dsv-fetch"
      if [ ! -x "$bin" ]; then
        [[ -n "$PACKAGE_URL" && "$PACKAGE_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "##vso[task.logissue type=error]dsvFetch.package_url / package_sha256 (64 hex) required"; exit 2; }
        stage="$(mktemp -d)"; trap 'rm -rf "$stage"' EXIT
        hdr=()
        if [ "${PACKAGE_AUTH:-managed-identity}" = "managed-identity" ]; then
          q="api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F${AZURE_CLIENT_ID:+&client_id=$AZURE_CLIENT_ID}"
          token="$(curl -fsS --noproxy '*' -H 'Metadata: true' "http://169.254.169.254/metadata/identity/oauth2/token?$q" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')"
          hdr=(-H "Authorization: Bearer $token" -H "x-ms-version: 2021-08-06")
        fi
        curl -fsSL --retry 5 "${hdr[@]}" -o "$stage/dsv-fetch.zip" "$PACKAGE_URL"
        unset token hdr
        echo "$PACKAGE_SHA256  $stage/dsv-fetch.zip" | sha256sum -c --status || { echo "##vso[task.logissue type=error]dsv-fetch package sha256 mismatch"; exit 1; }
        case "$(uname -m)" in x86_64|amd64) f=dsv-fetch-linux-amd64 ;; aarch64|arm64) f=dsv-fetch-linux-arm64 ;; *) echo "unsupported agent architecture $(uname -m)"; exit 2 ;; esac
        unzip -q -o "$stage/dsv-fetch.zip" "$f" SHA256SUMS -d "$stage"
        (cd "$stage" && grep -q " $f\$" SHA256SUMS && sha256sum -c --status --ignore-missing SHA256SUMS) || { echo "##vso[task.logissue type=error]SHA256SUMS check of $f failed"; exit 1; }
        chmod 0500 "$stage/$f"
        mkdir -p "$dir"; chmod 0700 "$dir"
        "$stage/$f" install --dest "$bin"
        echo "dsv-fetch $("$bin" version) installed from the verified release zip"
      fi
      out="$(mktemp -d)"; chmod 0700 "$out"; trap 'rm -rf "$out" "${stage:-/nonexistent}"' EXIT
      mapfile -t MAPS < <(python3 -c 'import json,os; [print(f"--map={k}={v}") for k,v in json.loads(os.environ["SECRETS_JSON"]).items()]')
      "$bin" init --out "$out" --format files "${MAPS[@]}"
      for f in "$out"/*; do
        n="$(basename "$f")"
        echo "##vso[task.setvariable variable=$n;issecret=true]$(cat "$f")"
      done
      echo "read $(ls "$out" | wc -l) secret(s) from DSV (values masked)"
    displayName: ${{ parameters.displayName }}
    env:
      SECRETS_JSON: ${{ convertToJson(parameters.secrets) }}
      PACKAGE_URL: ${{ parameters.dsvFetch.package_url }}
      PACKAGE_SHA256: ${{ parameters.dsvFetch.package_sha256 }}
      PACKAGE_AUTH: ${{ coalesce(parameters.dsvFetch.auth, 'managed-identity') }}
      DSV_TENANT: ${{ parameters.dsv.tenant }}
      DSV_TLD: ${{ coalesce(parameters.dsv.tld, 'com') }}
      DSV_BASE_URL: ${{ parameters.dsv.base_url }}
      DSV_AUTH: ${{ coalesce(parameters.dsv.auth, 'azure') }}
      AZURE_CLIENT_ID: ${{ parameters.dsv.identity_client_id }}
