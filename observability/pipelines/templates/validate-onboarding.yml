# Steps template: validate onboarding manifests (v2) against the tag policy and verify the committed rendered output
# is current. Consumers: include from the package repository (see ../README.md in the package root, "Pipelines").
parameters:
  - name: packageDir          # directory that contains the package (modules/, tools/, config/, schemas/)
    type: string
  - name: manifestsDir        # consumer manifests for this environment
    type: string
  - name: environment
    type: string
  - name: renderedDir         # committed render.py output consumed by Terraform
    type: string
  - name: tagPolicy           # consumer tag policy (empty = package config/tag-policy.yaml)
    type: string
    default: ''
  - name: routingFile         # DEPRECATED (package 2.x notification routing): accepted and ignored
    type: string
    default: ''
  - name: archetypesDir       # DEPRECATED (package 2.x archetypes): accepted and ignored
    type: string
    default: ''
  - name: strict
    type: boolean
    default: true
  - name: pythonVersion
    type: string
    default: '3.13'

steps:
  - task: UsePythonVersion@0
    displayName: Use Python ${{ parameters.pythonVersion }}
    inputs:
      versionSpec: ${{ parameters.pythonVersion }}

  - bash: python -m pip install --disable-pip-version-check --quiet "pyyaml>=6,<7" "jsonschema>=4.20,<5"
    displayName: Install validator dependencies

  - bash: |
      set -euo pipefail
      POLICY_ARGS=()
      if [ -n "${{ parameters.tagPolicy }}" ]; then POLICY_ARGS=(--tag-policy "${{ parameters.tagPolicy }}"); fi
      if [ -n "${{ parameters.routingFile }}${{ parameters.archetypesDir }}" ]; then
        echo "##[warning]routingFile / archetypesDir are ignored since package 3.0.0 (monitoring content is not part of the package)"
      fi
      python "${{ parameters.packageDir }}/tools/onboarding/validate.py" \
        --manifests "${{ parameters.manifestsDir }}" \
        --env "${{ parameters.environment }}" \
        "${POLICY_ARGS[@]}" ${{ iif(parameters.strict, '--strict', '') }}
    displayName: Validate onboarding manifests (${{ parameters.environment }})

  - bash: |
      set -euo pipefail
      POLICY_ARGS=()
      if [ -n "${{ parameters.tagPolicy }}" ]; then POLICY_ARGS=(--tag-policy "${{ parameters.tagPolicy }}"); fi
      python "${{ parameters.packageDir }}/tools/onboarding/render.py" render \
        --manifests "${{ parameters.manifestsDir }}" --env "${{ parameters.environment }}" \
        --out "${{ parameters.renderedDir }}" "${POLICY_ARGS[@]}" --check
    displayName: Verify rendered output is up to date
