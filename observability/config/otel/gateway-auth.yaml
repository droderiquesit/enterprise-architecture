# Overlay: require a bearer token on OTLP (defence in depth on top of VNet-only internal ingress).
# Clients send "Authorization: Bearer <token>" (OTEL_EXPORTER_OTLP_HEADERS), token read from the
# file /dsv-secrets/otlp-bearer-token written by the dsv-fetch init container (Delinea DSV).
extensions:
  bearertokenauth/otlp:
    scheme: Bearer
    token: ${file:/dsv-secrets/otlp-bearer-token}
receivers:
  otlp:
    protocols:
      grpc:
        auth:
          authenticator: bearertokenauth/otlp
      http:
        auth:
          authenticator: bearertokenauth/otlp
service:
  extensions: [health_check, bearertokenauth/otlp]
