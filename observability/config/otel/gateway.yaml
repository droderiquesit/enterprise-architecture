# OTel gateway for managed runtimes (ACA, App Service, Functions, ACI, Logic Apps) - ADR-0001 §10.
# Same file runs on otel/opentelemetry-collector-contrib:0.162.0 (`gateway_distribution = upstream`,
# default) and datadog/ddot-collector:7.84.2 standalone (`ddot`); only components present in both are used.
# Receivers listen on the container network only; on Azure Container Apps the ingress is INTERNAL
# (VNet-only) - never publish 4317/4318 publicly. Optional overlays (merged with a second --config):
#   gateway-auth.yaml               bearertokenauth on both OTLP protocols
#   gateway-tail-sampling.yaml      tail sampling instead of probabilistic (single replica only)
#   gateway-scrape-fluentbit.yaml   scrape the Fluent Bit aggregator self-metrics
#
# Secrets: the Datadog API key is read from the FILE /dsv-secrets/dd-api-key (confmap file provider), written by the
#          dsv-fetch init container from Delinea DSV into an ephemeral volume (never an env var / ACA secret).
# Environment: DD_SITE, DD_ENV (default env when a client sends none),
#              TRACE_SAMPLING_PERCENTAGE (0-100, default 100), GATEWAY_MEMORY_LIMIT_MIB
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318
  # collector self-telemetry (service.telemetry below) re-ingested so it reaches Datadog
  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-gateway
          scrape_interval: ${env:SELF_SCRAPE_INTERVAL:-60s}
          static_configs:
            - targets: ["127.0.0.1:8888"]
              labels:
                env: ${env:DD_ENV:-unknown}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:GATEWAY_MEMORY_LIMIT_MIB:-800}
    spike_limit_mib: ${env:GATEWAY_MEMORY_SPIKE_MIB:-200}
  # env detector only: OTEL_RESOURCE_ATTRIBUTES of the gateway itself. Host/system detectors are
  # deliberately NOT used - gateway replicas must not become the "host" of client telemetry.
  resourcedetection:
    detectors: [env]
    override: false
  resource/unified_tags:
    attributes:
      # Datadog unified service tagging: env <- deployment.environment.name, service <- service.name,
      # version <- service.version. Accept the legacy key and fill a default env when a client sends none.
      - key: deployment.environment.name
        from_attribute: deployment.environment
        action: insert
      - key: deployment.environment.name
        value: ${env:DD_ENV:-unknown}
        action: insert
      - key: deployment.environment
        from_attribute: deployment.environment.name
        action: insert
      - key: service.version
        value: unknown
        action: insert
      # command lines can carry secrets
      - key: process.command_line
        action: delete
      - key: process.command_args
        action: delete
  # Tag policy (package tagging): fills policy tags a client did not send - environment-wide defaults and, per
  # service.name, the service's identity (team, owner, domain, ...) - and copies them onto metric data points so
  # Datadog metrics carry them too (the exporter keeps resource_attributes_as_tags off: no high-cardinality host
  # attributes). Never overwrites a client value. The statements come from modules/otel-collector
  # (overlay OTELCOL_CONFIG_TAGS); this placeholder is a no-op.
  transform/eh_tag_policy:
    error_mode: ignore
    trace_statements:
      - context: resource
        statements:
          - delete_key(attributes, "eh.tag_policy.placeholder")
    metric_statements:
      - context: resource
        statements:
          - delete_key(attributes, "eh.tag_policy.placeholder")
    log_statements:
      - context: resource
        statements:
          - delete_key(attributes, "eh.tag_policy.placeholder")
  probabilistic_sampler:
    sampling_percentage: ${env:TRACE_SAMPLING_PERCENTAGE:-100}
  batch:
    send_batch_size: 4096
    send_batch_max_size: 8192
    timeout: 5s

connectors:
  # APM trace metrics are computed from 100% of spans BEFORE sampling (Datadog guidance)
  datadog/connector:
    traces:
      compute_stats_by_span_kind: true
      compute_top_level_by_span_kind: true
      peer_tags_aggregation: true

exporters:
  # OTLP logs are ACCEPTED and DROPPED by default: the Functions host (and other SDKs) export host/worker
  # logs over OTLP whenever OTEL_EXPORTER_OTLP_ENDPOINT is set, but application logs must reach Datadog
  # only through Fluent Bit (FunctionAppLogs -> Event Hubs -> aggregator). Accepting (instead of having
  # no logs receiver) avoids client-side export errors/retries. Opt-in forwarding: gateway-logs-forward.yaml.
  nop: {}
  datadog:
    api:
      key: ${file:/dsv-secrets/dd-api-key}
      site: ${env:DD_SITE:-datadoghq.com}
      fail_on_invalid_key: false
    host_metadata:
      enabled: false
    metrics:
      resource_attributes_as_tags: false
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2000

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                # names like otelcol_exporter_send_failed_spans (no _total), as the monitors expect
                without_type_suffix: true
  pipelines:
    # the OTLP receiver fans out to both trace pipelines: stats see 100% of spans, export is sampled
    traces/stats:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource/unified_tags, transform/eh_tag_policy]
      exporters: [datadog/connector]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection, resource/unified_tags, transform/eh_tag_policy, probabilistic_sampler, batch]
      exporters: [datadog]
    metrics:
      receivers: [otlp, datadog/connector, prometheus/self]
      processors: [memory_limiter, resourcedetection, resource/unified_tags, transform/eh_tag_policy, batch]
      exporters: [datadog]
    # Logs: accept-and-drop (see exporters.nop). Application logs reach Datadog only through Fluent Bit
    # (ADR-0001 §10); clients also set OTEL_LOGS_EXPORTER=none (instrumentation module).
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [nop]
