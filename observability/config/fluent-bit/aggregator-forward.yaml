# Fluent Bit aggregator, forward-only variant (no Event Hubs / Kafka input). Used when the
# telemetry-transport module runs without an Event Hub (event_hub.mode = none). Otherwise identical to
# aggregator.yaml (observability subnet; Container App with internal ingress, or any VM/pod).
#   - forward input: remote Fluent Bit senders (sidecar-forward.yaml, hosts that may not reach Datadog)
#   - datadog output with gzip + TLS, filesystem buffering bounded by storage.total_limit_size.
#
# Environment contract:
#   FLB_STATE_DIR               writable dir (buffer); ephemeral storage on ACA
#   FLB_FORWARD_SHARED_KEY      DSV (env file); FLB_FORWARD_TLS on|off; FLB_FORWARD_TLS_CRT / FLB_FORWARD_TLS_KEY file paths
#   FLB_DD_HOST/FLB_DD_PORT/FLB_DD_TLS/DD_API_KEY/FLB_DD_TAGS as in sidecar.yaml
service:
  flush: 1
  grace: 15
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020
  health_check: on
  hc_errors_count: 5
  hc_retry_failure_count: 5
  hc_period: 60
  storage.path: ${FLB_STATE_DIR}/buffer
  storage.sync: normal
  storage.backlog.mem_limit: 32M
  storage.max_chunks_up: 128

# Secret values (DD_API_KEY, FLB_FORWARD_SHARED_KEY, EVENTHUB_CONNECTION_STRING) are NOT in this file or in the
# container env: dsv-fetch (observability/images/dsv-fetch) writes them from Delinea DSV into an `env:` YAML
# file at /dsv-secrets/fluentbit-env.yaml (ephemeral pod/replica volume: k8s emptyDir medium Memory, ACA/ACI EmptyDir; mode 0400) before Fluent Bit starts; the include below
# makes them available to ${VAR} substitution. A missing file fails the start (fail fast, no silent key-less run).
includes:
  - parsers.yaml
  - /dsv-secrets/fluentbit-env.yaml

pipeline:
  inputs:
    - name: forward
      tag_prefix: fwd.
      listen: 0.0.0.0
      port: 24224
      shared_key: ${FLB_FORWARD_SHARED_KEY}
      self_hostname: fluent-bit-aggregator
      tls: ${FLB_FORWARD_TLS}
      tls.crt_file: ${FLB_FORWARD_TLS_CRT}
      tls.key_file: ${FLB_FORWARD_TLS_KEY}
      buffer_chunk_size: 1M
      buffer_max_size: 6M
      mem_buf_limit: 64MB
      storage.type: filesystem

    # canary: 1 synthetic record per minute proving the pipeline end to end (monitors alert on its absence)
    - name: dummy
      tag: canary.fluentbit
      dummy: '{"message":"fluent-bit pipeline canary","service":"telemetry-canary","canary":true,"ddsource":"fluent-bit"}'
      interval_sec: ${FLB_CANARY_INTERVAL_SEC}
      interval_nsec: 0
      samples: 0

  filters:
    - name: lua
      match: '*'
      script: lua/enterprise_hello.lua
      call: eh_normalize
    - name: lua
      match: '*'
      script: lua/enterprise_hello.lua
      call: eh_redact
    - name: throttle
      match: '*'
      rate: 5000
      window: 5
      interval: 1s
      print_status: false

    - name: lua
      match: canary.*
      script: lua/enterprise_hello.lua
      call: eh_static_tags

    - name: lua
      match: '*'
      script: lua/enterprise_hello.lua
      call: eh_finalize

  outputs:
    - name: datadog
      match: '*'
      host: ${FLB_DD_HOST}
      port: ${FLB_DD_PORT}
      tls: ${FLB_DD_TLS}
      tls.verify: on
      compress: gzip
      apikey: ${DD_API_KEY}
      dd_message_key: message
      json_date_key: timestamp
      retry_limit: 10
      storage.total_limit_size: 1G
      net.keepalive: on
      workers: 2
