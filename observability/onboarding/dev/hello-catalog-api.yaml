# Lab onboarding manifest v2 (Enterprise Hello, env dev): identity + tags + resources + telemetry routing.
# ${contract:...} references are resolved at plan
# time from contracts (render.py references -> contract_references). See observability/README.md.
apiVersion: observability/v2
kind: ServiceOnboarding
metadata:
  service: hello-catalog-api
  display_name: hello-catalog-api
  team: catalog
  owner: catalog@example.com
  application: enterprise-hello
  domain: catalog
  tier: high
  env: dev
  repository: https://dev.azure.com/example-org/enterprise-hello/_git/enterprise-architecture
  description: Catalog API; PostgreSQL + Managed Redis cache-aside.
  languages:
  - python
  depends_on:
  - datastore:catalog-postgresql
  - datastore:catalog-redis
  contacts:
  - name: catalog mailbox
    type: email
    contact: catalog@example.com
  region: swedencentral
spec:
  architecture: aca
  runtime: python
  telemetry:
    dbm:
      enabled: true
      engine: postgres
      endpoint_ref: platform-db-postgresql.server.fqdn
  resources:
  - id: ${contract:deploy-core-aca.apps.hello-catalog-api.id}
    type: Microsoft.App/containerApps
    role: app
    required: false
  - id: ${contract:platform-db-postgresql.server.id}
    type: Microsoft.DBforPostgreSQL/flexibleServers
    role: catalog-db
  - id: ${contract:platform-db-redis.cache.id}
    type: Microsoft.Cache/redisEnterprise
    role: cache
    required: false
  presence_ref: deploy-core-aca.apps.hello-catalog-api.url
