# Lab onboarding manifest v2 (Enterprise Hello, env dev): identity + tags + resources + telemetry routing.
# ${contract:...} references are resolved at plan
# time from contracts (render.py references -> contract_references). See observability/README.md.
apiVersion: observability/v2
kind: ServiceOnboarding
metadata:
  service: hello-dbadapter-redis
  display_name: hello-dbadapter-redis
  team: data-platform
  owner: data-platform@example.com
  application: enterprise-hello
  domain: data
  tier: low
  env: dev
  repository: https://dev.azure.com/example-org/enterprise-hello/_git/enterprise-architecture
  description: Database adapter for family redis.
  languages:
  - python
  depends_on: []
  contacts:
  - name: data-platform mailbox
    type: email
    contact: data-platform@example.com
  region: swedencentral
spec:
  architecture: aca
  runtime: python
  resources:
  - id: ${contract:deploy-dbadapters.adapters.redis.id}
    type: Microsoft.App/containerApps
    role: app
    required: false
  - id: ${contract:platform-db-redis.cache.id}
    type: Microsoft.Cache/redisEnterprise
    role: store
    required: false
  presence_ref: deploy-dbadapters.adapters.redis.url
