# Lab onboarding manifest (Enterprise Hello, env dev). ${contract:...} references are resolved at plan
# time from contracts (render.py references -> contract_references). See observability/README.md.
apiVersion: observability/v1
kind: ServiceOnboarding
metadata:
  service: hello-dbadapter-sql
  display_name: hello-dbadapter-sql
  team: data-platform
  owner: data-platform@example.com
  application: enterprise-hello
  domain: data
  tier: low
  env: dev
  repository: https://dev.azure.com/example-org/enterprise-hello/_git/enterprise-architecture
  description: Database adapter for family sql.
  languages:
  - python
  depends_on: []
  contacts:
  - name: data-platform mailbox
    type: email
    contact: data-platform@example.com
spec:
  architecture: aca
  runtime: python
  telemetry:
    profile: db-adapter
  resources:
  - id: ${contract:deploy-dbadapters.adapters.sql.id}
    type: Microsoft.App/containerApps
    role: app
    required: false
  - id: ${contract:platform-db-sql.databases.adapter.id}
    type: Microsoft.Sql/servers/databases
    role: store
    required: false
  endpoints:
  - name: internal
    url: ${contract:deploy-dbadapters.adapters.sql.url}
    visibility: private
    health_path: /readyz
    required: false
  presence_ref: deploy-dbadapters.adapters.sql.url
  notifications:
    default:
    - team-data-platform
    critical:
    - team-data-platform
    - oncall
    warning:
    - team-data-platform
  catalog:
    component_of:
    - system:enterprise-hello
