# Lab onboarding manifest v2 (Enterprise Hello, env dev): identity + tags + resources + telemetry routing.
# ${contract:...} references are resolved at plan
# time from contracts (render.py references -> contract_references). See observability/README.md.
apiVersion: observability/v2
kind: ServiceOnboarding
metadata:
  service: hello-functions
  display_name: hello-functions
  team: platform-engineering
  owner: platform-engineering@example.com
  application: enterprise-hello
  domain: audit
  tier: medium
  env: dev
  repository: https://dev.azure.com/example-org/enterprise-hello/_git/enterprise-architecture
  description: Audit (Service Bus trigger), cache-warmer (timer), quote (HTTP).
  languages:
  - python
  depends_on:
  - queue:order-events
  contacts:
  - name: platform-engineering mailbox
    type: email
    contact: platform-engineering@example.com
  region: swedencentral
spec:
  architecture: functions
  runtime: python
  resources:
  - id: ${contract:deploy-functions.function_apps.premium.id}
    type: Microsoft.Web/sites
    role: app
    required: false
  presence_ref: deploy-functions.function_apps.premium.id
