# Lab onboarding manifest v2 (Enterprise Hello, env dev): identity + tags + resources + telemetry routing.
# ${contract:...} references are resolved at plan
# time from contracts (render.py references -> contract_references). See observability/README.md.
apiVersion: observability/v2
kind: ServiceOnboarding
metadata:
  service: telemetry-pipeline
  display_name: telemetry-pipeline
  team: observability
  owner: observability@example.com
  application: enterprise-hello
  domain: observability
  tier: critical
  env: dev
  repository: https://dev.azure.com/example-org/enterprise-hello/_git/enterprise-architecture
  description: Fluent Bit aggregator + OTel gateway (transport) health and the pipeline canary.
  languages: []
  depends_on: []
  contacts:
  - name: observability mailbox
    type: email
    contact: observability@example.com
  region: swedencentral
spec:
  architecture: aca
  runtime: other
  resources:
  - id: ${contract:obs-telemetry-transport.event_hub.namespace_id}
    type: Microsoft.EventHub/namespaces
    role: log-export
    required: false
  presence_ref: obs-telemetry-transport.otlp.grpc_endpoint
