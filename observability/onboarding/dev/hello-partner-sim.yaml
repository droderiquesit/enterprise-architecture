# Lab onboarding manifest v2 (Enterprise Hello, env dev): identity + tags + resources + telemetry routing.
# ${contract:...} references are resolved at plan
# time from contracts (render.py references -> contract_references). See observability/README.md.
apiVersion: observability/v2
kind: ServiceOnboarding
metadata:
  service: hello-partner-sim
  display_name: hello-partner-sim
  team: fulfillment
  owner: fulfillment@example.com
  application: enterprise-hello
  domain: payments
  tier: low
  env: dev
  repository: https://dev.azure.com/example-org/enterprise-hello/_git/enterprise-architecture
  description: Simulated external payment API.
  languages:
  - python
  depends_on: []
  contacts:
  - name: fulfillment mailbox
    type: email
    contact: fulfillment@example.com
  region: swedencentral
spec:
  architecture: aci
  runtime: python
  resources:
  - id: ${contract:deploy-partner-sim.container_group.id}
    type: Microsoft.ContainerInstance/containerGroups
    role: group
    required: false
  presence_ref: deploy-partner-sim.url
