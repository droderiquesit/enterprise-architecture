schema_version: 1
verified_on: '2026-10-09'
description: Messaging and platform-support services.
services:
- id: service-bus
  family: service-bus
  hosting_variant: Service Bus namespace (Standard default; Premium for private endpoint)
  category: messaging
  display_name: Azure Service Bus
  lifecycle:
    status: ga
    notes: Generally available.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas: []
    registrations:
    - Microsoft.ServiceBus
    licensing: []
  networking:
    private_support: partial
    notes: private endpoints and public_network_access=false require Premium; Standard (minimal profile) stays public with RBAC-only auth - recorded exception
  iac:
    terraform_resources:
    - azurerm_servicebus_namespace
    - azurerm_servicebus_topic
    - azurerm_servicebus_subscription
    - azurerm_servicebus_queue
    azapi: []
    component: platform-messaging
    implemented: true
  workload:
    exercised_by:
    - hello-orders-api
    - hello-durable
    - hello-worker
    - hello-functions
    - hello-jobs
    operations:
    - topic order-events (3 subscriptions)
    - queue batch-items
  telemetry:
    azure_metric_namespace: azure.servicebus_namespaces
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.servicebus_namespaces)
      logs:
        supported: 'yes'
        method: diagnostic settings (OperationalLogs, RuntimeAuditLogs (Premium)) owned by obs-diagnostics -> Event Hubs -> Fluent Bit aggregator / Datadog log forwarding
      traces:
        supported: 'yes'
        method: producer/consumer spans from OTel SDK with W3C traceparent in message application properties
      dbm: &id001
        supported: n/a
        method: not applicable
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - Trace context propagation across Service Bus depends on SDK instrumentation; Functions trigger spans need manual link
  cost:
    profile: low
    approx_monthly_usd_default: 10
    assumptions: Standard tier (Premium 1 MU ~USD 680 in specialized profile)
    teardown: terraform destroy of the owning root
    data_retention: messages deleted with namespace
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
  references:
  - https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-messaging-overview
  - https://docs.datadoghq.com/integrations/azure_service_bus/
