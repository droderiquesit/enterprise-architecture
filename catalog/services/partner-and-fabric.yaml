schema_version: 1
verified_on: '2026-10-09'
description: Partner (Azure Native Integrations / Oracle Database@Azure) and Microsoft Fabric items - distinct from ordinary ARM deployments.
services:
- id: oracle-database-azure
  family: oracle
  hosting_variant: Oracle AI Database@Azure (Exadata Dedicated/Exascale, Autonomous AI Database, Base Database)
  category: partner
  display_name: Oracle Database@Azure
  lifecycle:
    status: ga
    notes: Generally available (renamed 'Oracle AI Database@Azure' in Microsoft docs).
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    region_notes: Sweden Central (Stockholm, Dual), East US 2 (Ashburn, Dual), West Europe (Amsterdam, Dual) listed
    quotas: []
    registrations:
    - Oracle.Database
    licensing:
    - Azure Marketplace purchase (public or private offer) of Oracle Database@Azure
    - linked Oracle Cloud Infrastructure (OCI) account/tenancy subscribed to the region
    - My Oracle Support registration
    - BYOL or license-included per service
  networking:
    private_support: vnet-injection
    notes: subnet delegated to Oracle.Database/networkAttachments; policies must allow untagged auto-created OracleSubscription resource
  iac:
    terraform_resources:
    - azurerm_oracle_autonomous_database
    - azurerm_oracle_exadata_infrastructure
    - azurerm_oracle_cloud_vm_cluster
    - azurerm_oracle_exascale_database_storage_vault
    - azurerm_oracle_resource_anchor
    azapi: []
    component: null
    implemented: false
  workload:
    exercised_by: []
    operations: []
  telemetry:
    azure_metric_namespace: azure.oracle
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.oracle)
      logs:
        supported: partial
        method: OCI logging / Azure Monitor (limited)
      traces: &id001
        supported: 'yes'
        method: client spans from the calling service's OpenTelemetry SDK/instrumentation -> OTLP -> Datadog Agent or OTel gateway
        notes: database itself emits no traces; spans come from hello-* callers
      dbm:
        supported: partial
        method: Datadog Oracle DBM requires an Agent with network reach to the database
        notes: support for Database@Azure specifically not verified
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - Database@Azure DBM support not documented by Datadog
  cost:
    profile: very-high
    approx_monthly_usd_default: null
    assumptions: Autonomous AI Database smallest ECPU config or Exadata infrastructure - priced via OCI/marketplace offer
    teardown: terraform destroy; Exadata infrastructure deletion takes hours
    data_retention: per OCI backup policy
  status:
    implementation: blocked
    live_validation: not-run
    blocked_reason: Requires Marketplace offer purchase (private/public) and a linked OCI tenancy + My Oracle Support registration; tag/naming policies must exempt the auto-created OracleSubscription
    default_profiles: []
  references:
  - https://learn.microsoft.com/en-us/azure/oracle/oracle-db/onboard-oracle-database
  - https://learn.microsoft.com/en-us/azure/oracle/oracle-db/oracle-database-regions
  - https://docs.datadoghq.com/database_monitoring/setup_oracle/
