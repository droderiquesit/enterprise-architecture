- id: confidential-containers
  family: confidential-computing
  parent: container-instances
  hosting_variant: Confidential containers (ACI Confidential SKU; AKS confidential node pools)
  category: specialized
  display_name: Confidential containers
  lifecycle:
    status: ga
    notes: ACI Confidential SKU is GA (Linux only, no GPU, CCE policy via az confcom). AKS 'Confidential Containers' (Kata) offering is preview - not re-verified.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: unknown
      eastus2: true
      westeurope: true
    region_notes: see ACI region availability page for Confidential SKU
    quotas: []
    registrations:
    - Microsoft.ContainerInstance
    licensing: []
  networking:
    private_support: vnet-injection
  iac:
    terraform_resources:
    - azurerm_container_group
    azapi: []
    component: null
    implemented: false
    notes: sku = Confidential + confidential_compute_cce_policy
  workload:
    exercised_by: []
    operations: []
  telemetry:
    azure_metric_namespace: azure.containerinstance_containergroups
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.containerinstance_containergroups)
      logs:
        supported: 'yes'
        method: Fluent Bit sidecar (must be included in the CCE policy)
      traces:
        supported: 'yes'
        method: OpenTelemetry SDK -> OTLP (gRPC/HTTP) -> observability OTel gateway (DDOT/upstream collector on ACA, internal ingress) -> Datadog
        notes: owned by obs-telemetry-transport; app roots consume the instrumentation contract
      dbm: *id001
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - Every sidecar (Fluent Bit) must be part of the attested confidential computing enforcement policy
  cost:
    profile: low
    approx_monthly_usd_default: 45
    assumptions: 1 vCPU/1.5 GB confidential group
    teardown: terraform destroy of the owning root
    data_retention: none
  status:
    implementation: cataloged
    live_validation: not-run
    default_profiles: []
  references:
  - https://learn.microsoft.com/en-us/azure/container-instances/container-instances-confidential-overview
  - https://learn.microsoft.com/en-us/azure/confidential-computing/confidential-containers
