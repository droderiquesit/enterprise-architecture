schema_version: 1
verified_on: '2026-10-09'
description: Specialized, expensive or restricted services (catalog + optional profiles).
services:
- id: avs
  family: vmware
  hosting_variant: Azure VMware Solution private cloud (AV36P/AV48/AV64)
  category: specialized
  display_name: Azure VMware Solution
  lifecycle:
    status: ga
    notes: Generally available.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: unknown
      eastus2: true
      westeurope: true
    region_notes: Region/SKU availability is per host SKU; Sweden Central not verified
    quotas:
    - host quota must be requested via support (per SKU, per region); minimum 3 hosts
    registrations:
    - Microsoft.AVS
    licensing:
    - VMware licensing bundled (Broadcom/VCF); customer-managed licensing options vary
  networking:
    private_support: vnet-integration
    notes: ExpressRoute into the hub; /22 management block
  iac:
    terraform_resources:
    - azurerm_vmware_private_cloud
    - azurerm_vmware_cluster
    - azurerm_vmware_express_route_authorization
    azapi: []
    component: null
    implemented: false
  workload:
    exercised_by: []
    operations: []
  telemetry:
    azure_metric_namespace: azure.avs_privateclouds
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.avs_privateclouds)
      logs:
        supported: partial
        method: syslog forwarding via diagnostic settings (VMwareSyslog)
      traces:
        supported: n/a
        method: n/a
      dbm: &id001
        supported: n/a
        method: not applicable
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - Datadog vSphere integration needs an Agent with vCenter access
  cost:
    profile: very-high
    approx_monthly_usd_default: 25000
    assumptions: 3 x AV36P hosts PAYG
    teardown: terraform destroy (hours)
    data_retention: vSAN data deleted
  status:
    implementation: blocked
    live_validation: not-run
    blocked_reason: AVS host quota must be approved via support request and minimum 3 hosts (~USD 25k/month); no quota in lab subscription
    default_profiles: []
  references:
  - https://learn.microsoft.com/en-us/azure/azure-vmware/introduction
  - https://learn.microsoft.com/en-us/azure/azure-vmware/request-host-quota-azure-vmware-solution
- id: dedicated-host
  family: virtual-machines
  hosting_variant: Dedicated host group + host (Dsv5-Type1)
  category: specialized
  display_name: Azure Dedicated Host
  lifecycle:
    status: ga
    notes: Generally available.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas:
    - dedicated host vCPU quota per family
    registrations:
    - Microsoft.Compute
    licensing: []
  networking:
    private_support: internal-only
  iac:
    terraform_resources:
    - azurerm_dedicated_host_group
    - azurerm_dedicated_host
    azapi: []
    component: platform-specialized-compute
    implemented: true
  workload:
    exercised_by: []
    operations: []
    boundary: optional placement for vm-confidential/vm-linux
  telemetry:
    azure_metric_namespace: azure.vm
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Agent host metrics + OTel app metrics via Agent OTLP; Azure integration (azure.vm) for platform metrics
      logs:
        supported: 'yes'
        method: Fluent Bit service on the Linux host tails LOG_FILE_PATH -> Datadog HTTP intake (obs-hosts)
        notes: Agent log collection disabled
      traces: &id002
        supported: 'yes'
        method: OpenTelemetry SDK -> OTLP localhost:4317 -> Datadog Agent on the host
        notes: Agent VM extension owned by obs-hosts
      dbm: *id001
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling: &id003
        supported: partial
        method: Datadog continuous profiler (dd-trace library) optional per service; OTel profiling not used
        notes: off by default to avoid a second tracer; enable per service
  datadog_limitations:
  - Host-level metrics only via Azure Monitor
  cost:
    profile: very-high
    approx_monthly_usd_default: 3000
    assumptions: one Dsv5-Type1 host billed whether used or not
    teardown: terraform destroy (host must be empty)
    data_retention: n/a
  status:
    implementation: disabled
    live_validation: not-run
    default_profiles: []
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/dedicated-hosts
