# Azure service catalog - schema: catalog/schemas/service.schema.json
# Validate: python3 tools/catalog/validate.py   Render: python3 tools/catalog/render_coverage.py
# Facts verified 2026-10-09 via Microsoft Learn, docs.datadoghq.com and tfschema (azurerm 5.9.0 / azapi 2.13.0).
# This file is the source of truth; edit it directly.
schema_version: 1
verified_on: '2026-10-09'
description: Analytics and adjacent data services (category analytics / adjacent-data).
services:
- id: data-explorer
  family: data-explorer
  hosting_variant: Azure Data Explorer cluster (Dev/Test SKU) + database
  category: analytics
  display_name: Azure Data Explorer
  lifecycle:
    status: ga
    notes: Generally available. (Synapse Data Explorer pools retired 2025-10-07 - see synapse-data-explorer.)
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas: []
    registrations:
    - Microsoft.Kusto
    licensing: []
  networking:
    private_support: private-endpoint
    notes: public_network_access_enabled = false + private endpoint (cluster)
  iac:
    terraform_resources:
    - azurerm_kusto_cluster
    - azurerm_kusto_database
    azapi: []
    component: platform-data-analytics
    implemented: true
  workload:
    exercised_by:
    - hello-dbadapter-adx
    operations:
    - ingest inline + KQL query
    boundary: database adapter / table Records
  telemetry:
    azure_metric_namespace: azure.kusto_clusters
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.kusto_clusters)
      logs:
        supported: 'yes'
        method: diagnostic settings (SucceededIngestion, FailedIngestion, Command, Query) owned by obs-diagnostics -> Event Hubs -> Fluent Bit aggregator / Datadog log forwarding
      traces: &id001
        supported: 'yes'
        method: client spans from the calling service's OpenTelemetry SDK/instrumentation -> OTLP -> Datadog Agent or OTel gateway
        notes: database itself emits no traces; spans come from hello-* callers
      dbm: &id002
        supported: n/a
        method: not a DBM-supported engine
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - No DBM; query-level detail via Command/Query diagnostic logs
  cost:
    profile: medium
    approx_monthly_usd_default: 130
    assumptions: Dev(No SLA)_Standard_E2a_v4, 1 instance; stop when idle
    teardown: terraform destroy of the owning root
    data_retention: database soft-delete/hot cache per policy; data deleted with cluster
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - full
  references:
  - https://learn.microsoft.com/en-us/azure/data-explorer/data-explorer-overview
  - https://docs.datadoghq.com/integrations/azure_data_explorer/
