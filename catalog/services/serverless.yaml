# Azure service catalog - schema: catalog/schemas/service.schema.json
# Validate: python3 tools/catalog/validate.py   Render: python3 tools/catalog/render_coverage.py
# Facts verified 2026-10-09 via Microsoft Learn, docs.datadoghq.com and tfschema (azurerm 5.9.0 / azapi 2.13.0).
# This file is the source of truth; edit it directly.
schema_version: 1
verified_on: '2026-10-09'
description: Serverless hosting (Functions plans, Durable, Static Web Apps, Logic Apps, Container Apps Jobs).
services:
- id: functions-flex-consumption
  family: azure-functions
  hosting_variant: Functions Flex Consumption plan (FC1, Linux, .NET 10 isolated / Python 3.13)
  category: serverless
  display_name: Azure Functions Flex Consumption
  lifecycle:
    status: ga
    notes: Generally available; recommended serverless plan. No deployment slots; deployment from blob container; per-instance memory 512/2048/4096 MB; always-ready optional.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    region_notes: Sweden Central, East US 2, West Europe all listed by Get-AzFunctionAppAvailableLocation -PlanType FlexConsumption; not in Azure Government
    quotas:
    - regional Flex Consumption memory quota (default 512 GB per subscription per region)
    registrations:
    - Microsoft.Web
    - Microsoft.App (VNet integration uses Microsoft.App/environments delegation)
    licensing: []
  networking:
    private_support: vnet-integration
    notes: VNet integration into 'flex-integration' subnet (delegated Microsoft.App/environments); inbound private endpoint
  iac:
    terraform_resources:
    - azurerm_service_plan
    - azurerm_function_app_flex_consumption
    - azurerm_storage_account
    azapi: []
    component: platform-functions
    implemented: true
  workload:
    exercised_by:
    - hello-durable (OrderProcessing, BatchProcessing, Reconciliation)
    operations:
    - Service Bus-triggered orchestrations
  telemetry:
    azure_metric_namespace: azure.functions
    signals:
      metrics:
        supported: 'yes'
        method: Azure integration (azure.functions / azure.app_services) + OTel app metrics via OTel gateway
      logs:
        supported: 'yes'
        method: FunctionAppLogs diagnostic setting -> Event Hubs -> Fluent Bit aggregator -> Datadog
      traces:
        supported: 'yes'
        method: OTel SDK in worker -> OTel gateway over VNet integration
        notes: 'Datadog native option: serverless compatibility layer + dd-trace (not used by default)'
      dbm: &id001
        supported: n/a
        method: not applicable
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: partial
        method: Datadog profiler preview for Python/Node on Azure Functions only
        notes: not enabled
  datadog_limitations:
  - Azure resource detection in the OTel Collector only supports VMs; set cloud.provider/cloud.platform/cloud.resource_id resource attributes manually (Datadog serverless OTLP guide)
  - Datadog native Functions tracing requires the serverless compatibility layer + language tracer; Flex Consumption needs DD_AZURE_RESOURCE_GROUP
  cost:
    profile: low
    approx_monthly_usd_default: 10
    assumptions: on-demand only, no always-ready instances, light traffic + storage account
    teardown: terraform destroy
    data_retention: deployment package in blob container deleted
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
  references:
  - https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-plan
  - https://learn.microsoft.com/en-us/azure/azure-functions/flex-consumption-how-to
  - https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - https://docs.datadoghq.com/serverless/azure_functions/
  - https://docs.datadoghq.com/opentelemetry/setup/otlp_ingest/serverless/
  - https://docs.datadoghq.com/integrations/azure_functions/
