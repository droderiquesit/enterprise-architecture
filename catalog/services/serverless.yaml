  availability: &id003
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas: []
    registrations:
    - Microsoft.App
    licensing: []
  networking: &id004
    private_support: vnet-injection
    notes: runs in the internal ACA environment
  iac:
    terraform_resources:
    - azurerm_container_app_job
    azapi: []
    component: platform-containerapps
    implemented: true
    notes: job resources owned by deploy-jobs
  workload:
    exercised_by:
    - hello-jobs
    - hello-traffic
    operations:
    - see trigger variants
  telemetry: &id005
    azure_metric_namespace: azure.app_jobs
    signals:
      metrics:
        supported: 'yes'
        method: Azure integration (azure.app_jobs) + OTel job metrics via OTel gateway
      logs:
        supported: 'yes'
        method: Fluent Bit sidecar tails shared EmptyDir file; ContainerAppSystemLogs via diagnostic settings
        notes: sidecar must exit when the main container completes (shutdown signal / file sentinel)
      traces: *id002
      dbm: *id001
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: 'no'
        method: not configured
  datadog_limitations:
  - Azure resource detection in the OTel Collector only supports VMs; set cloud.provider/cloud.platform/cloud.resource_id resource attributes manually (Datadog serverless OTLP guide)
  - Short-lived executions must flush OTel exporters and Fluent Bit before exit
  cost:
    profile: low
    approx_monthly_usd_default: 5
    assumptions: per-execution consumption billing
    teardown: terraform destroy
    data_retention: execution history retained by the platform (last 100)
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
  references:
  - https://learn.microsoft.com/en-us/azure/container-apps/jobs
