- id: functions-on-container-apps
  family: azure-functions
  hosting_variant: Functions on Azure Container Apps V2 (native Microsoft.App/containerApps kind=functionapp)
  category: serverless
  display_name: Azure Functions on Container Apps
  lifecycle:
    status: ga
    notes: V2 native model (single container app with kind=functionapp) is recommended; V1 (Microsoft.Web proxy site + hidden container app) is legacy.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas: []
    registrations:
    - Microsoft.App
    licensing: []
  networking:
    private_support: vnet-injection
    notes: inherits the internal ACA environment
  iac:
    terraform_resources: []
    azapi:
    - type: Microsoft.App/containerApps
      api_version: '2026-07-01'
      reason: azurerm_container_app exposes 'kind' as computed only; kind=functionapp cannot be set
    component: deploy-functions
    implemented: true
  workload:
    exercised_by:
    - hello-functions http quote (container image)
    operations:
    - HTTP-triggered quote
  telemetry:
    azure_metric_namespace: azure.app_containerapps
    signals:
      metrics:
        supported: 'yes'
        method: Azure integration (azure.app_containerapps, azure.app_managedenvironments) + OTel app metrics via OTel gateway
      logs:
        supported: 'yes'
        method: Fluent Bit sidecar tails shared EmptyDir file (LOG_FILE_PATH) -> Datadog; ContainerAppSystemLogs via diagnostic settings (obs-diagnostics)
        notes: ContainerAppConsoleLogs must NOT also be exported (duplicate)
      traces: &id002
        supported: 'yes'
        method: OpenTelemetry SDK -> OTLP (gRPC/HTTP) -> observability OTel gateway (DDOT/upstream collector on ACA, internal ingress) -> Datadog
        notes: owned by obs-telemetry-transport; app roots consume the instrumentation contract
      dbm: *id001
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: partial
        method: Datadog continuous profiler (dd-trace library) optional per service; OTel profiling not used
        notes: off by default to avoid a second tracer; enable per service
  datadog_limitations:
  - Azure resource detection in the OTel Collector only supports VMs; set cloud.provider/cloud.platform/cloud.resource_id resource attributes manually (Datadog serverless OTLP guide)
  - Datadog native Functions tracing requires the serverless compatibility layer + language tracer; Flex Consumption needs DD_AZURE_RESOURCE_GROUP
  cost:
    profile: low
    approx_monthly_usd_default: 5
    assumptions: runs in the shared Consumption profile, scale to zero
    teardown: terraform destroy
    data_retention: none
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
  references:
  - https://learn.microsoft.com/en-us/azure/container-apps/functions-overview
  - https://learn.microsoft.com/en-us/azure/container-apps/migrate-functions
  - https://learn.microsoft.com/en-us/azure/templates/microsoft.app/containerapps
  - https://learn.microsoft.com/en-us/azure/azure-functions/functions-scale
  - https://docs.datadoghq.com/serverless/azure_functions/
  - https://docs.datadoghq.com/opentelemetry/setup/otlp_ingest/serverless/
  - https://docs.datadoghq.com/integrations/azure_functions/
