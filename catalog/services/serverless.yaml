- id: durable-task-scheduler
  family: durable-task
  hosting_variant: Durable Task Scheduler (Microsoft.DurableTask/schedulers + taskHubs)
  category: serverless
  display_name: Durable Task Scheduler
  variants:
  - name: Consumption SKU
    notes: pay per action, 500 actions/s, 30-day retention, 10 schedulers/region/subscription, 5 task hubs/scheduler
  - name: Dedicated SKU
    notes: 1-3 CUs (3 for HA), 2,000 actions/s per CU, 90-day retention, 25 schedulers + 25 task hubs/region/subscription
  lifecycle:
    status: ga
    notes: Stable ARM API versions 2025-11-01 and 2026-02-01 published (2026-05-01-preview newest); recommended backend for Durable Functions and Durable Task SDKs.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: unknown
      eastus2: unknown
      westeurope: unknown
    region_notes: '''Available in most Azure regions'' - verify: az provider show --namespace Microsoft.DurableTask --query "resourceTypes[?resourceType==''schedulers''].locations |
      [0]"'
    quotas:
    - see variants
    registrations:
    - Microsoft.DurableTask
    licensing: []
  networking:
    private_support: private-endpoint
    notes: private endpoints supported; ipAllowlist is required in the API (set [] / deny when private)
  iac:
    terraform_resources: []
    azapi:
    - type: Microsoft.DurableTask/schedulers
      api_version: '2026-02-01'
      reason: no azurerm resource in 5.9.0
    - type: Microsoft.DurableTask/schedulers/taskHubs
      api_version: '2026-02-01'
      reason: no azurerm resource in 5.9.0
