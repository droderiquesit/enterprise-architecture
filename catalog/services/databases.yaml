# Azure service catalog - schema: catalog/schemas/service.schema.json
# Validate: python3 tools/catalog/validate.py   Render: python3 tools/catalog/render_coverage.py
# Facts verified 2026-10-09 via Microsoft Learn, docs.datadoghq.com and tfschema (azurerm 5.9.0 / azapi 2.13.0).
# This file is the source of truth; edit it directly.
schema_version: 1
verified_on: '2026-10-09'
description: 'Databases: relational, NoSQL, cache and ledger services (category database).'
services:
- id: sql-database-provisioned
  family: azure-sql
  hosting_variant: Azure SQL Database single database, provisioned compute
  category: database
  display_name: Azure SQL Database (provisioned)
  variants:
  - name: DTU Basic/S0
    notes: lab default
  - name: vCore General Purpose Gen5
  - name: vCore Business Critical
    notes: cost
  lifecycle:
    status: ga
    notes: Generally available; no retirement announced.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas: []
    registrations:
    - Microsoft.Sql
    licensing: []
  networking:
    private_support: private-endpoint
    notes: public_network_access_enabled = false + private endpoint (sqlServer subresource); privatelink.database.windows.net
  iac:
    terraform_resources:
    - azurerm_mssql_server
    - azurerm_mssql_database
    azapi: []
    component: platform-db-sql
    implemented: true
  workload:
    exercised_by:
    - hello-orders-api
    - hello-dbadapter-sql
    operations:
    - CRUD on orders.orders
    - idempotent insert by Idempotency-Key
    - read order status
    boundary: db orders / schema orders
  telemetry:
    azure_metric_namespace: azure.sql_servers_databases
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.sql_servers_databases)
      logs:
        supported: 'yes'
        method: diagnostic settings (SQLSecurityAuditEvents, QueryStoreRuntimeStatistics, Errors, Timeouts, Blocks, Deadlocks) owned by obs-diagnostics -> Event Hubs -> Fluent Bit aggregator
          / Datadog log forwarding
      traces: &id001
        supported: 'yes'
        method: client spans from the calling service's OpenTelemetry SDK/instrumentation -> OTLP -> Datadog Agent or OTel gateway
        notes: database itself emits no traces; spans come from hello-* callers
      dbm: &id002
        supported: 'yes'
        method: 'Datadog Agent sqlserver check (dbm: true, deployment_type ''sql_database'', one instance per database) from the observability subnet via private endpoint; owned by obs-dbm'
        notes: Agent 7.41.0+; autodiscovery must not be enabled for Azure SQL DB; connect directly, not via proxy/pooler
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - DBM requires one check instance per application database (exclude master)
  - SQL Server Agent Jobs monitoring is not available for Azure SQL Database
  cost:
    profile: low
    approx_monthly_usd_default: 15
    assumptions: S0 (10 DTU, 250 GB max) single database on a logical server; vCore GP_Gen5_2 is a settings option (~USD 370/month)
    teardown: terraform destroy of the owning platform root; server/account deletion is immediate (no soft delete) - export data first if needed
    data_retention: PITR backups 7 days default (configurable 1-35); LTR off; deleted databases restorable from backup until server deletion
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
  references:
  - https://learn.microsoft.com/en-us/azure/azure-sql/database/sql-database-paas-overview
  - https://docs.datadoghq.com/database_monitoring/setup_sql_server/azure/
  - https://docs.datadoghq.com/integrations/azure_sql_database/
- id: sql-database-serverless
  family: azure-sql
  hosting_variant: Azure SQL Database single database, serverless compute tier (General Purpose)
  category: database
  display_name: Azure SQL Database (serverless)
  lifecycle:
    status: ga
    notes: Generally available; no retirement announced.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas: []
    registrations:
    - Microsoft.Sql
    licensing: []
  networking:
    private_support: private-endpoint
    notes: public_network_access_enabled = false + private endpoint (sqlServer subresource); privatelink.database.windows.net
  iac:
    terraform_resources:
    - azurerm_mssql_server
    - azurerm_mssql_database
    azapi: []
    component: platform-db-sql
    implemented: true
  workload:
    exercised_by:
    - hello-durable
    - hello-jobs
    operations:
    - orchestration status writes (fulfillment schema)
    - reconciliation summaries
    boundary: db fulfillment / schemas fulfillment
  telemetry:
    azure_metric_namespace: azure.sql_servers_databases
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.sql_servers_databases)
      logs:
        supported: 'yes'
        method: diagnostic settings (SQLSecurityAuditEvents, QueryStoreRuntimeStatistics, Errors, Timeouts, Blocks, Deadlocks) owned by obs-diagnostics -> Event Hubs -> Fluent Bit aggregator
          / Datadog log forwarding
      traces: *id001
      dbm: *id002
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - DBM requires one check instance per application database (exclude master)
  - SQL Server Agent Jobs monitoring is not available for Azure SQL Database
  - Auto-pause is prevented while the DBM Agent (or any client) keeps sessions open; enabling DBM on a serverless DB effectively disables auto-pause and raises cost
  cost:
    profile: low
    approx_monthly_usd_default: 40
    assumptions: GP_S_Gen5_1, min 0.5 vCore, auto-pause 60 min, 32 GB; cost depends on active hours
    teardown: terraform destroy of the owning platform root; server/account deletion is immediate (no soft delete) - export data first if needed
    data_retention: PITR backups 7 days default (configurable 1-35); LTR off; deleted databases restorable from backup until server deletion
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
  references:
  - https://learn.microsoft.com/en-us/azure/azure-sql/database/sql-database-paas-overview
  - https://docs.datadoghq.com/database_monitoring/setup_sql_server/azure/
  - https://docs.datadoghq.com/integrations/azure_sql_database/
  - https://learn.microsoft.com/en-us/azure/azure-sql/database/serverless-tier-overview
