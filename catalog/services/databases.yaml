- id: sql-managed-instance
  family: azure-sql
  hosting_variant: Azure SQL Managed Instance (General Purpose, VNet-injected)
  category: database
  display_name: Azure SQL Managed Instance
  variants:
  - name: General Purpose (Gen5 / premium-series)
    notes: lab default 4 vCore
  - name: Next-gen General Purpose
  - name: Business Critical
    notes: cost
  lifecycle:
    status: ga
    notes: Generally available. Provisioning into a new subnet can take hours (virtual cluster creation).
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas:
    - subnet delegated to Microsoft.Sql/managedInstances, /27 minimum (/24 recommended)
    - regional vCore quota per subscription
    registrations:
    - Microsoft.Sql
    licensing:
    - License included or Azure Hybrid Benefit (license_type)
  networking:
    private_support: vnet-injection
    notes: VNet-injected in the dedicated 'sqlmi' subnet; optional private endpoint; public data endpoint disabled
  iac:
    terraform_resources:
    - azurerm_mssql_managed_instance
    - azurerm_mssql_managed_database
    azapi:
    - type: Microsoft.Sql/managedInstances
      api_version: "2025-01-01"
      reason: azurerm 5.9.0 gap (see catalog/provider-gaps.yaml)
    component: platform-db-sqlmi
    implemented: true
  workload:
    exercised_by:
    - hello-dbadapter-sqlmi
    operations:
    - adapter CRUD
    boundary: db adapter
  telemetry:
    azure_metric_namespace: azure.sql_managedinstances
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.sql_managedinstances)
      logs:
        supported: 'yes'
        method: diagnostic settings (SQLSecurityAuditEvents, ResourceUsageStats, Errors) owned by obs-diagnostics -> Event Hubs -> Fluent Bit aggregator / Datadog log forwarding
      traces: *id001
      dbm:
        supported: 'yes'
        method: 'Datadog Agent sqlserver check (dbm: true) from the observability subnet; owned by obs-dbm'
        notes: Agent runs on a separate host (no host access); connect directly to the MI host name
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - Agent cannot run on the managed instance host; host-level metrics come only from Azure Monitor
  cost:
    profile: very-high
    approx_monthly_usd_default: 730
    assumptions: GP Gen5 4 vCore, 32 GB, license included, single instance; billed while running (start/stop schedule optional)
    teardown: terraform destroy; deletion of the last instance also removes the virtual cluster (can take hours); subnet stays locked until then
    data_retention: PITR 7 days default; LTR off
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - specialized
  references:
  - https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/sql-managed-instance-paas-overview
  - https://docs.datadoghq.com/database_monitoring/setup_sql_server/azure/
  - https://docs.datadoghq.com/integrations/azure_sql_managed_instance/
- id: sql-server-on-vm
  family: azure-sql
  hosting_variant: SQL Server 2022 on Azure Windows VM (SQL IaaS Agent extension)
  category: database
  display_name: SQL Server on Azure Virtual Machines
  variants:
  - name: SQL Server 2022 Developer (free license)
    notes: lab default marketplace image
  - name: Standard / Enterprise PAYG
  - name: Azure Hybrid Benefit
  lifecycle:
    status: ga
    notes: Generally available. SQL Server 2025 images available; Datadog supports 2025 with Agent 7.79+.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas:
    - regional vCPU quota for the chosen VM family (e.g. Dsv5)
    registrations:
    - Microsoft.SqlVirtualMachine
    - Microsoft.Compute
    licensing:
    - 'Developer edition: free, non-production only'
    - 'Standard/Enterprise: PAYG or AHB'
  networking:
    private_support: internal-only
    notes: private IP in the compute subnet; no public IP
  iac:
    terraform_resources:
    - azurerm_windows_virtual_machine
    - azurerm_mssql_virtual_machine
    - azurerm_managed_disk
    azapi: []
    component: platform-db-sqlvm
    implemented: true
  workload:
    exercised_by:
    - hello-dbadapter-sqlvm
    operations:
    - adapter CRUD
    boundary: db adapter
  telemetry:
    azure_metric_namespace: azure.vm
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.vm)
      logs:
        supported: 'yes'
        method: Fluent Bit service on the VM (SQL error log / app logs) owned by obs-hosts
        notes: SQL Server error log collection optional
      traces: *id001
      dbm:
        supported: 'yes'
        method: 'Datadog Agent installed on the VM (VM extension owned by obs-hosts/obs-dbm) running the sqlserver check (dbm: true)'
        notes: self-hosted setup guide applies
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no first-party app process
  datadog_limitations:
  - Agent and DBM check on the same VM consume VM resources; size VM accordingly
  cost:
    profile: medium
    approx_monthly_usd_default: 160
    assumptions: Standard_D2s_v5 Windows + SQL Developer (no SQL license fee) + 128 GB Premium SSD
    teardown: terraform destroy deletes VM and disks
    data_retention: no automated backup unless SQL IaaS automated backup is enabled (off by default)
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - full
  references:
  - https://learn.microsoft.com/en-us/azure/azure-sql/virtual-machines/windows/sql-server-on-azure-vm-iaas-what-is-overview
  - https://docs.datadoghq.com/database_monitoring/setup_sql_server/selfhosted/
  - https://docs.datadoghq.com/database_monitoring/setup_sql_server/azure/
- id: postgresql-flexible
  family: azure-postgresql
  hosting_variant: Azure Database for PostgreSQL flexible server (single node)
  category: database
  display_name: Azure Database for PostgreSQL flexible server
  variants:
  - name: Burstable B1ms
    notes: lab default; no HA
  - name: General Purpose D2ds_v5
    notes: HA (zone-redundant) capable
  - name: PostgreSQL 17
    notes: lab default version
  lifecycle:
    status: ga
    notes: Generally available. Single Server (predecessor) retired 2025-03-28.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    region_notes: Zone-redundant HA availability varies by region/subscription (temporary blocks have occurred, e.g. East US 2)
    quotas: []
    registrations:
    - Microsoft.DBforPostgreSQL
    licensing: []
  networking:
    private_support: private-endpoint-or-vnet-injection
    notes: VNet injection into delegated 'postgres' subnet (lab default) or private endpoint; choice is fixed at creation
  iac:
    terraform_resources:
    - azurerm_postgresql_flexible_server
    - azurerm_postgresql_flexible_server_database
    - azurerm_postgresql_flexible_server_configuration
    azapi: []
    component: platform-db-postgresql
    implemented: true
  workload:
    exercised_by:
    - hello-catalog-api
    - hello-dbadapter-postgresql
    operations:
    - catalog price lookups
    - adapter CRUD
    boundary: db catalog; db adapter
  telemetry:
    azure_metric_namespace: azure.dbforpostgresql_flexibleservers
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.dbforpostgresql_flexibleservers)
      logs:
        supported: 'yes'
        method: diagnostic settings (PostgreSQLLogs, PostgreSQLFlexSessions, PostgreSQLFlexQueryStoreRuntime) owned by obs-diagnostics -> Event Hubs -> Fluent Bit aggregator / Datadog
          log forwarding
      traces: *id001
      dbm:
        supported: 'yes'
        method: 'Datadog Agent postgres check (dbm: true) from the observability subnet over the private network; owned by obs-dbm'
        notes: Agent 7.36.1+; azure.extensions=pg_stat_statements, pg_stat_statements.track=ALL, track_activity_query_size=4096 (static, restart)
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - 'Postgres 16+: postgresql.wal_count/wal_size/wal_age not collected (pg_ls_waldir permission)'
  - DBM must connect directly to the server, not via PgBouncer
  cost:
    profile: low
    approx_monthly_usd_default: 17
    assumptions: B1ms burstable, 32 GB P4 storage, no HA, 7-day backup
    teardown: terraform destroy of the owning platform root; server/account deletion is immediate (no soft delete) - export data first if needed
    data_retention: backups 7 days default (7-35); deleted servers restorable for 5 days via support/portal
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
  references:
  - https://learn.microsoft.com/en-us/azure/postgresql/overview
  - https://docs.datadoghq.com/database_monitoring/setup_postgres/azure/
  - https://docs.datadoghq.com/integrations/azure_db_for_postgresql/
- id: postgresql-elastic-cluster
  family: azure-postgresql
  parent: postgresql-flexible
  hosting_variant: Azure Database for PostgreSQL flexible server with elastic cluster (Citus, multi-node)
  category: database
  display_name: Azure Database for PostgreSQL elastic clusters
  lifecycle:
    status: ga
    notes: Feature of flexible server (no preview label on concept page, updated 2026-07). PostgreSQL 17 and 18 only; no scale-in; no major version upgrade; one database per cluster;
      scale-out to 20 nodes self-service.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    region_notes: Same regions as flexible server
    quotas: []
    registrations:
    - Microsoft.DBforPostgreSQL
    licensing: []
  networking:
    private_support: private-endpoint-or-vnet-injection
    notes: same options as flexible server
  iac:
    terraform_resources:
    - azurerm_postgresql_flexible_server
    - azurerm_postgresql_flexible_server_configuration
    azapi: []
    component: platform-db-postgresql
    implemented: true
    notes: azurerm_postgresql_flexible_server cluster { size, default_database_name } block (azurerm 5.9.0)
  workload:
    exercised_by:
    - hello-dbadapter-postgresql-elastic
    operations:
    - create_distributed_table adapter.records
    - distributed insert/select
    boundary: distributed table adapter.records
  telemetry:
    azure_metric_namespace: azure.dbforpostgresql_flexibleservers
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, namespace azure.dbforpostgresql_flexibleservers)
      logs:
        supported: 'yes'
        method: diagnostic settings (PostgreSQLLogs) owned by obs-diagnostics -> Event Hubs -> Fluent Bit aggregator / Datadog log forwarding
      traces: *id001
      dbm:
        supported: partial
        method: Datadog Agent postgres check against the coordinator (port 5432)
        notes: Elastic clusters are not listed in Datadog's Azure Postgres DBM page; worker nodes share one IP with different ports (7000+), per-node DBM unverified
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling:
        supported: n/a
        method: no application process owned by this resource
  datadog_limitations:
  - DBM support for elastic clusters is not documented by Datadog; treat as best effort (coordinator only)
  cost:
    profile: medium
    approx_monthly_usd_default: 290
    assumptions: 2 nodes General Purpose D2ds_v5, 32 GB each, no HA
    teardown: terraform destroy of the owning platform root; server/account deletion is immediate (no soft delete) - export data first if needed
    data_retention: as flexible server
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
