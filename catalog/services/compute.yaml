# Azure service catalog - schema: catalog/schemas/service.schema.json
# Validate: python3 tools/catalog/validate.py   Render: python3 tools/catalog/render_coverage.py
# Facts verified 2026-10-09 via Microsoft Learn, docs.datadoghq.com and tfschema (azurerm 5.9.0 / azapi 2.13.0).
# This file is the source of truth; edit it directly.
schema_version: 1
verified_on: '2026-10-09'
description: Compute hosting architectures (VMs, scale sets, Kubernetes, Container Apps, ACI, App Service, Batch, Service Fabric, ARO, legacy PaaS).
services:
- id: vm-linux
  family: virtual-machines
  hosting_variant: Linux VM (Ubuntu 24.04 LTS, Trusted Launch)
  category: compute
  display_name: Azure Virtual Machines (Linux)
  variants:
  - name: Standard_B2s
    notes: lab default
  - name: Standard_D2s_v5
  - name: Trusted Launch
    notes: secure_boot_enabled + vtpm_enabled
  - name: Spot priority
  - name: Arm64 Dpsv5
  lifecycle:
    status: ga
    notes: Generally available. Default outbound access retired 2025-09-30 for new VNets - explicit egress (NAT Gateway) required.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas:
    - regional + per-family vCPU quota
    registrations:
    - Microsoft.Compute
    licensing: []
  networking:
    private_support: internal-only
    notes: private IP only; Bastion/run command for access
  iac:
    terraform_resources:
    - azurerm_linux_virtual_machine
    - azurerm_network_interface
    - azurerm_virtual_machine_run_command
    azapi: []
    component: platform-vm
    implemented: true
    notes: VM run command (app install) is owned by deploy-vm-workloads; the Datadog Agent VM Application + DSV-reader identity are attached by the obs-hosts Azure Policy (tag datadog:enabled; platform-vm ignores gallery_application)
  workload:
    exercised_by:
    - hello-worker (systemd)
    operations:
    - consume notifications subscription
    - write Table Storage
  telemetry:
    azure_metric_namespace: azure.vm
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Agent host metrics + OTel app metrics via Agent OTLP; Azure integration (azure.vm) for platform metrics
      logs:
        supported: 'yes'
        method: Datadog Agent (VM Application, obs-hosts Azure Policy) tails LOG_FILE_PATH (fleet policy logs.hosts + datadog:log_paths tag) -> Observability Pipelines Worker -> Datadog Logs
        notes: no Fluent Bit on hosts (observability 4.0.0)
      traces: &id001
        supported: 'yes'
        method: OpenTelemetry SDK -> OTLP localhost:4317 -> Datadog Agent on the host
        notes: Agent installed as an Azure VM Application by the obs-hosts policy (Linux hosts default to Datadog SSI, see telemetry-capabilities)
      dbm: &id002
        supported: n/a
        method: not applicable
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling: &id003
        supported: partial
        method: Datadog continuous profiler (dd-trace library) optional per service; OTel profiling not used
        notes: off by default to avoid a second tracer; enable per service
  datadog_limitations:
  - Agent extension and Fluent Bit are separate ARM resources owned by observability; VM root must not manage them
  cost:
    profile: low
    approx_monthly_usd_default: 35
    assumptions: Standard_B2s_v2 Linux PAYG 24x7 (~35; less with the 19:00 UTC auto-shutdown) + Standard SSD OS disk (~3)
    teardown: terraform destroy deletes VM, NIC, OS disk
    data_retention: OS disk deleted with VM
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
  references:
  - https://learn.microsoft.com/en-us/azure/virtual-machines/overview
  - https://docs.datadoghq.com/integrations/azure_vm/
  - https://docs.datadoghq.com/opentelemetry/setup/otlp_ingest_in_the_agent/
