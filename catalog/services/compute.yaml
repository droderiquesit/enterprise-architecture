- id: aks
  family: aks
  hosting_variant: AKS Standard tier, Azure CNI overlay, private API server optional, workload identity
  category: compute
  display_name: Azure Kubernetes Service
  variants:
  - name: Free tier
    notes: no SLA
  - name: Standard tier
    notes: lab default
  - name: AKS Automatic
    notes: sku_tier/node provisioning; not used
  - name: system pool Standard_D2s_v5 x1 + user pool x1
  lifecycle:
    status: ga
    notes: Generally available. Azure Linux 2.0 node images unsupported since 2025-11-30; Ubuntu 20.04 unsupported since 2025-04.
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas:
    - regional vCPU quota for node SKUs
    registrations:
    - Microsoft.ContainerService
    licensing: []
  networking:
    private_support: internal-only
    notes: nodes in aks-nodes subnet; private cluster optional; ingress via internal LB/App Gateway
  iac:
    terraform_resources:
    - azurerm_kubernetes_cluster
    - azurerm_kubernetes_cluster_node_pool
    azapi: []
    component: platform-aks
    implemented: true
  workload:
    exercised_by:
    - hello-bff
    - hello-orders-api
    - hello-catalog-api
    - hello-worker
    operations:
    - full user journey
  telemetry:
    azure_metric_namespace: azure.containerservice_managedclusters
    signals:
      metrics:
        supported: 'yes'
        method: Datadog Agent DaemonSet + Cluster Agent (kubelet, KSM) + OTel app metrics via Agent OTLP; Azure integration for control-plane metrics
      logs:
        supported: 'yes'
        method: Fluent Bit DaemonSet tails /var/log/containers -> Datadog (obs-kubernetes)
        notes: DD_LOGS_ENABLED=false on the Agent; kube-audit via diagnostic settings optional
      traces: &id005
        supported: 'yes'
        method: OpenTelemetry SDK -> OTLP -> Datadog Agent DaemonSet OTLP receiver (hostPort 4317 via node IP)
        notes: owned by obs-kubernetes
      dbm: *id002
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling: *id003
  datadog_limitations:
  - Agent container log collection must stay disabled while Fluent Bit ships /var/log/containers
  cost:
    profile: medium
    approx_monthly_usd_default: 110
    assumptions: Free tier control plane (sku_tier default; Standard ~USD 73 for the uptime SLA) + 1 x Standard_D2s_v5 system node (~70, autoscale to 2) + OS disk (~20) + Standard LB (~18)
    teardown: terraform destroy deletes cluster and node RG (MC_*)
    data_retention: PV disks with Delete reclaim policy removed
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
  references:
  - https://learn.microsoft.com/en-us/azure/aks/what-is-aks
  - https://docs.datadoghq.com/integrations/azure_container_service/
  - https://docs.datadoghq.com/containers/kubernetes/
- id: container-apps-consumption
  family: container-apps
  hosting_variant: Container Apps on the Consumption workload profile (workload-profiles environment)
  category: compute
  display_name: Azure Container Apps (Consumption profile)
  lifecycle:
    status: ga
    notes: Generally available. Workload-profiles environments are the recommended environment type (Consumption-only environments are the older type).
    verified_on: '2026-10-09'
  availability:
    regions_checked:
      swedencentral: true
      eastus2: true
      westeurope: true
    quotas:
    - cores per environment (Consumption) quota
    - 15 environments per region per subscription (default)
    registrations:
    - Microsoft.App
    licensing: []
  networking:
    private_support: vnet-injection
    notes: internal environment in aca-infra subnet (delegated Microsoft.App/environments; workload profiles env min /27, ADR uses /23)
  iac:
    terraform_resources:
    - azurerm_container_app_environment
    - azurerm_container_app
    azapi:
    - type: Microsoft.App/containerApps
      api_version: '2025-07-01'
      reason: observability telemetry transport (obs-telemetry-transport) Fluent Bit aggregator / OTel gateway apps need additional ingress port mappings (additionalPortMappings) and secret volume item paths, which azurerm_container_app 5.9.0 cannot express
    component: platform-containerapps
    implemented: true
    notes: container app resources owned by deploy-* roots (azurerm) and obs-telemetry-transport (azapi, see catalog/provider-gaps.yaml); environment by platform-containerapps
  workload:
    exercised_by:
    - hello-bff
    - hello-orders-api
    - hello-catalog-api
    - hello-dbadapter-*
    operations:
    - HTTP APIs
    - adapters
  telemetry:
    azure_metric_namespace: azure.app_containerapps
    signals:
      metrics:
        supported: 'yes'
        method: Azure integration (azure.app_containerapps, azure.app_managedenvironments) + OTel app metrics via OTel gateway
      logs:
        supported: 'yes'
        method: Fluent Bit sidecar tails shared EmptyDir file (LOG_FILE_PATH) -> Datadog; ContainerAppSystemLogs via diagnostic settings (obs-diagnostics)
        notes: ContainerAppConsoleLogs must NOT also be exported (duplicate)
      traces: &id004
        supported: 'yes'
        method: OpenTelemetry SDK -> OTLP (gRPC/HTTP) -> observability OTel gateway (DDOT/upstream collector on ACA, internal ingress) -> Datadog
        notes: owned by obs-telemetry-transport; app roots consume the instrumentation contract
      dbm: *id002
      rum:
        supported: n/a
        method: browser RUM applies to hello-frontend only (static-web-apps)
      profiling: *id003
  datadog_limitations:
  - Azure resource detection in the OTel Collector only supports VMs; set cloud.provider/cloud.platform/cloud.resource_id resource attributes manually (Datadog serverless OTLP guide)
  - 'Datadog serverless-init (in-container/sidecar) not used: Fluent Bit + OTel gateway are authoritative'
  cost:
    profile: low
    approx_monthly_usd_default: 25
    assumptions: scale-to-zero apps, ~0.5 vCPU/1 GiB active a few hours/day; free monthly grant applies
    teardown: terraform destroy
    data_retention: no persistent data
  status:
    implementation: implemented
    live_validation: not-run
    default_profiles:
    - enterprise
    - full
    - minimal
    - specialized
  references:
  - https://learn.microsoft.com/en-us/azure/container-apps/overview
  - https://learn.microsoft.com/en-us/azure/container-apps/workload-profiles-overview
  - https://docs.datadoghq.com/integrations/azure_container_apps/
  - https://docs.datadoghq.com/serverless/azure_container_apps/
