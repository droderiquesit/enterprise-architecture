# Telemetry capability matrix (authoritative collection path per signal).
# Rendered to docs/coverage/telemetry-capability-matrix.md by tools/catalog/render_coverage.py
# Validated by tools/catalog/validate.py (keys must cover architecture-matrix.yaml + database catalog entries).
schema_version: 1
verified_on: '2026-10-10'
description: 'Authoritative telemetry collection path per signal for every compute architecture (catalog/architecture-matrix.yaml) and database family - observability package 3.0.0 defaults
  (observability/config/fleet-policy.yaml): every log source (Datadog Agent where it runs, Fluent Bit edge collectors where it cannot, Azure Event Hubs) goes to the Datadog Observability
  Pipelines Worker and from there to Datadog Logs; Datadog tracing libraries (Single Step Instrumentation on AKS and Linux hosts, library in the image + the in-VNet Datadog Agent APM
  gateway for managed runtimes) with the Continuous Profiler; Datadog Azure integration for platform metrics; diagnostic settings (obs-diagnostics) for platform logs; Agent DBM checks.
  log_pipeline = fluent_bit_direct / apm.mode = otel restore the 2.x paths. Per-resource matrix and unsupported combinations: docs/guides/datadog-fleet-collection.md.'
signals:
- app_logs
- traces
- app_metrics
- runtime_metrics
- platform_metrics
- platform_logs
- dbm
- rum
- profiling
database_signals:
- platform_metrics
- platform_logs
- client_spans
- dbm
sources:
  datadog_dbm: https://docs.datadoghq.com/database_monitoring/
  datadog_dbm_sqlserver_azure: https://docs.datadoghq.com/database_monitoring/setup_sql_server/azure/
  datadog_dbm_postgres_azure: https://docs.datadoghq.com/database_monitoring/setup_postgres/azure/
  datadog_dbm_mysql_azure: https://docs.datadoghq.com/database_monitoring/setup_mysql/azure/
  datadog_otlp_serverless: https://docs.datadoghq.com/opentelemetry/setup/otlp_ingest/serverless/
  datadog_azure_functions: https://docs.datadoghq.com/serverless/azure_functions/
  datadog_azure_app_service: https://docs.datadoghq.com/serverless/azure_app_service/
  datadog_azure_container_apps: https://docs.datadoghq.com/serverless/azure_container_apps/
  datadog_azure_integration: https://docs.datadoghq.com/integrations/azure/
  datadog_observability_pipelines: https://docs.datadoghq.com/observability_pipelines/
  datadog_op_worker_install: https://docs.datadoghq.com/observability_pipelines/configuration/install_the_worker/
  datadog_ssi: https://docs.datadoghq.com/tracing/trace_collection/automatic_instrumentation/single-step-apm/
  datadog_profiler_dotnet: https://docs.datadoghq.com/profiler/enabling/dotnet/
  datadog_profiler_python: https://docs.datadoghq.com/profiler/enabling/python/
  datadog_profiler_compat: https://docs.datadoghq.com/profiler/enabling/supported_versions/
  datadog_fleet_automation: https://docs.datadoghq.com/agent/fleet_automation/
  datadog_dsm: https://docs.datadoghq.com/data_streams/
  datadog_rum_browser: https://docs.datadoghq.com/real_user_monitoring/browser/
findings:
  dbm_support:
    azure_sql_database: supported (deployment_type sql_database; one instance per database; elastic pool DBs are separate hosts; no Agent Jobs; autodiscovery unsupported); Agent 7.41.0+
    azure_sql_managed_instance: supported (Agent on a separate host)
    sql_server_on_azure_vm: supported (self-hosted guide, Agent on the VM); SQL Server 2025 needs Agent 7.79+
    postgresql_flexible_server: supported (Agent 7.36.1+; pg_stat_statements, pg_stat_statements.track=ALL, track_activity_query_size=4096); elastic clusters and Cosmos DB for PostgreSQL
      not listed
    mysql_flexible_server: partially supported - Query Activity and Wait Event collection NOT supported on Flexible Server; performance_schema=ON
    not_supported: Cosmos DB (all APIs), Azure DocumentDB (Datadog MongoDB DBM covers self-hosted + Atlas only), Managed Redis / Azure Cache for Redis, Managed Instance for Apache Cassandra,
      Table Storage, Confidential Ledger, HorizonDB, Synapse, Data Explorer
  serverless_otlp_intake: 'Datadog accepts agentless OTLP from Azure Container Apps, App Service and Functions: http/protobuf or http/json only (gRPC NOT supported); headers dd-api-key,
    dd-otlp-source=serverless, compute_stats=true; set OTEL_SERVICE_NAME; set cloud.provider=azure, cloud.platform (azure.container_apps | azure.app_service | azure.functions) and cloud.resource_id
    because the Collector''s Azure resource detector only supports VMs. Lab default remains the private OTel gateway; direct intake is the fallback for runtimes without VNet integration
    (Windows Consumption).'
  functions_native: 'Datadog native Functions APM: Dedicated/Premium/Consumption/Flex (Flex needs DD_AZURE_RESOURCE_GROUP), via Serverless Compatibility Layer + tracer (or .NET APM extension
    on Windows Dedicated/Premium); profiler preview for Python/Node only. Not used by default (OTel path is authoritative).'
  app_service_native: 'Datadog App Service instrumentation: Linux code, Linux container, Windows code (Java/Node/.NET); Windows containers not listed. Not used by default.'
  container_apps_native: Datadog serverless-init (in-container or sidecar) gives traces, enhanced metrics (azure.app_containerapps.enhanced.*), custom metrics and logs. Not used by default.
  package_3_defaults:
    log_pipeline: 'observability_pipelines: Agents (8282 datadog_agent source), Fluent Bit (24224 fluent source, forward without metadata) and Event Hubs (Kafka source, SASL PLAIN $ConnectionString)
      -> one pipeline per environment (VRL tag policy + Azure shaping, SDS redaction, dedupe, quotas) -> Datadog Logs with a disk buffer (when_full block = backpressure). fluent_bit_direct
      keeps the 2.x paths.'
    apm: 'datadog: TELEMETRY_SDK=datadog, OTEL_SDK_DISABLED=true - one tracer per process. AKS: Cluster Agent admission controller SSI (target namespaces, ddTraceVersions per language).
      Linux VM/VMSS: host SSI by the installer. ACA / ACI / App Service / Functions: library in the image (.NET dd-trace-dotnet, Python ddtrace) -> Datadog Agent APM gateway on ACA (internal
      TCP 8126, API key ENC[dsv://] via dsv-fetch). serverless-init is opt-in on ACA only: version 1.10.4 does not resolve ENC[] secrets, so DD_API_KEY must be a Container Apps secret
      (documented exception to ADR-0001 section 14).'
    profiling: 'Datadog Continuous Profiler wherever a Datadog library runs and Datadog supports the runtime: .NET (Linux/Windows x64; Function Apps NOT supported), Python (POSIX; Azure
      Functions preview -> off by package policy), Node/Java (library default). SSI sets DD_PROFILING_ENABLED=auto. Profiles upload through the same Agent as traces (node Agent / APM
      gateway / serverless-init). apm.mode = otel: no Datadog profiling, except the opt-in Python preview DD_PROFILING_PREVIEW_OTEL_CONTEXT_ENABLED (profiling.otel_mode = python_preview).'
    runtime_metrics: 'DD_RUNTIME_METRICS_ENABLED only where an Agent runs next to the process (DogStatsD UDP/UDS): node Agent, serverless-init. Behind the APM gateway runtime metrics
      are off (Container Apps ingress has no UDP).'
    rum: 'modules/rum (obs-prereqs): RUM application create or existing; browser SDK config allowedTracingUrls with propagatorTypes [datadog, tracecontext], session replay 0, globalContext
      from the tag policy.'
    fleet: Agent version pinned by the fleet policy (7.84.2), Remote Configuration on, remote upgrades off by default; optional datadog_fleet_schedule (modules/fleet-automation).
compute:
  aks:
    catalog_ref: aks
    signals:
      app_logs:
        supported: 'yes'
        method: Datadog Agent DaemonSet (containerCollectAll; per-pod ad.datadoghq.com/<container>.logs source/service) -> Observability Pipelines Worker (datadog_agent source :8282)
          -> Datadog Logs
        owner: obs-kubernetes
        duplicate_prevention: 'Fluent Bit DaemonSet not installed (log_pipeline = fluent_bit_direct: Fluent Bit DaemonSet, Agent log collection off)'
        datadog_limitation: none
      traces:
        supported: 'yes'
        method: Datadog library injected by Single Step Instrumentation (Cluster Agent admission controller, targets = settings ssi_namespaces, ddTraceVersions per language) -> node
          Agent :8126
        owner: obs-kubernetes
        duplicate_prevention: 'TELEMETRY_SDK=datadog + OTEL_SDK_DISABLED=true: the app never initialises the OpenTelemetry SDK (one tracer per process)'
        datadog_limitation: 'SSI needs Cluster Agent >= 7.64 for target-based selection; restricted PSS: init container securityContext set by the package'
      app_metrics:
        supported: partial
        method: 'custom metrics: DogStatsD to the node Agent (apm.mode = datadog) or OTel SDK metrics -> Agent OTLP (apm.mode = otel)'
        owner: obs-kubernetes
        duplicate_prevention: single exporter per app (decided by TELEMETRY_SDK)
        datadog_limitation: OTel metrics SDK is disabled in datadog mode - apps emit custom metrics through DogStatsD
      runtime_metrics:
        supported: 'yes'
        method: Datadog library runtime metrics (DD_RUNTIME_METRICS_ENABLED) -> node Agent DogStatsD
        owner: obs-kubernetes
        duplicate_prevention: OTel runtime instrumentation off in datadog mode
        datadog_limitation: none
      platform_metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, azure.containerservice_managedclusters)
        owner: obs-azure-integration
        duplicate_prevention: single Azure integration per subscription; do not also enable Azure Monitor metric export to Datadog
        datadog_limitation: Azure Monitor latency (typically several minutes); metric granularity 1 min
      platform_logs:
        supported: partial
        method: kube-audit / control-plane logs via diagnostic settings (optional)
        owner: obs-diagnostics
        duplicate_prevention: not application logs
        datadog_limitation: none
      dbm:
        supported: n/a
        method: not applicable
        owner: null
        duplicate_prevention: n/a
        datadog_limitation: n/a
      rum:
        supported: n/a
        method: browser RUM applies only to hello-frontend (static-web-apps)
        owner: null
        duplicate_prevention: n/a
        datadog_limitation: n/a
      profiling:
        supported: 'yes'
        method: Datadog Continuous Profiler through SSI (DD_PROFILING_ENABLED=auto) -> node Agent -> Datadog; .NET profile types cpu/walltime/exceptions/gc (lock/allocation/heap off;
          allocation+heap preview), Python stack/lock/memory/heap/timeline; code hotspots + endpoint profiling; UST + DD_TAGS on every profile
        owner: obs-kubernetes
        duplicate_prevention: profiler only inside the Datadog library; no OTel profiling signal
        datadog_limitation: 'apm.mode = otel: unavailable (Python preview opt-in only)'
  container-apps-consumption:
    catalog_ref: container-apps-consumption
    signals:
      app_logs:
        supported: 'yes'
        method: Fluent Bit sidecar tails the shared EmptyDir file (LOG_FILE_PATH) -> forward -> Observability Pipelines Worker (fluent source :24224, require_ack_response, filesystem
          buffer) -> Datadog Logs
        owner: applications deploy root (sidecar spec from modules/instrumentation)
        duplicate_prevention: ContainerAppConsoleLogs are NOT exported by diagnostic settings; serverless-init log collection off; no API key on the edge
        datadog_limitation: sidecar adds CPU/memory to each replica
      traces:
        supported: 'yes'
        method: Datadog library in the image (.NET dd-trace-dotnet at DD_DOTNET_TRACER_HOME / Datadog.Trace.Bundle, Python ddtrace) -> Datadog Agent APM gateway (obs-telemetry-transport,
          ACA internal TCP 8126, DD_TRACE_AGENT_URL) -> Datadog
        owner: obs-telemetry-transport (gateway) + applications deploy root (env from modules/instrumentation)
        duplicate_prevention: 'TELEMETRY_SDK=datadog + OTEL_SDK_DISABLED=true: the app never initialises the OpenTelemetry SDK (one tracer per process)'
        datadog_limitation: internal VNet path to the APM gateway required; serverless-init (opt-in, managed_runtime_path = serverless_init) needs DD_API_KEY as a Container Apps secret
          - not DSV-compliant
      app_metrics:
        supported: partial
        method: OTel SDK metrics -> OTel gateway (apm.mode = otel) / Datadog library custom metrics need DogStatsD (not available behind the APM gateway)
        owner: obs-telemetry-transport
        duplicate_prevention: single exporter per app
        datadog_limitation: no DogStatsD path for managed runtimes behind the APM gateway (Container Apps ingress is TCP); serverless-init (ACA opt-in) provides one
      runtime_metrics:
        supported: partial
        method: off behind the APM gateway (DogStatsD); on with serverless-init (ACA opt-in) or apm.mode = otel (OTel runtime instrumentation -> OTel gateway)
        owner: obs-telemetry-transport
        duplicate_prevention: one runtime-metrics source per process
        datadog_limitation: DogStatsD runtime metrics need an Agent next to the process
      platform_metrics:
        supported: 'yes'
        method: Datadog Azure integration (Azure Monitor metrics, azure.app_containerapps, azure.app_managedenvironments)
        owner: obs-azure-integration
