# Component registry — the single source of truth for change detection, state boundaries,
# dependency ordering and pipeline stage generation. Schema: catalog/schemas/component.schema.json
#
# kind:
#   terraform  - independently planned/applied Terraform root (state <env>/<id>.tfstate)
#   artifact   - application build producing an immutable image/package (built once per commit)
#   docs       - documentation only; never deploys
# depends_on:  hard ordering (upstream must be applied first when both are selected)
# consumes:    contracts read as inputs (implies depends_on on the producer)
# artifacts:   artifact components whose digests are inputs of this deployment root
# scope:       which pipeline owns it: platform (azure-pipelines.yml) or applications
#              (azure-pipelines.applications.yml). Default: bootstrap/foundation/platform/docs -> platform,
#              applications -> applications, observability -> platform unless it reads application
#              contracts (after_deployments / discovers_resources) -> applications.
# secret_env:  {ENV_VAR: <dsv secret name>[#element][?]} - values tools/secrets/fetch.py resolves from Delinea DSV with
#              the deploy agent's managed identity and passes ONLY to the Terraform step of this component (masked,
#              never echoed; `?` = optional). Typically TF_VAR_<ephemeral/sensitive variable> or provider keys.
# dsv_state_output: Terraform output holding the desired DSV state (tools/secrets/dsv_apply.py plan/apply).
# secret_outputs:   sensitive Terraform output {name: value} published to DSV after apply (tools/secrets/publish.py).
# retry:       {attempts, max_minutes} bounded auto-retry of transient failures (tools/deploy/retry.py)
# owners:      review groups (path-filtered required reviewers + .github/CODEOWNERS, tools/ado); default by layer
#              from environments/branching.yaml owners_by_layer
# drift:       {auto_remediate: bool} re-apply additive-only drift on drift runs where the environment allows it
# inputs:      extra repo globs that change this component (shared modules are discovered
#              automatically by tools/changeset from module "source" paths)
# optional:    true = in no built-in profile (environments/profiles/*.yaml); enabled only with profile custom
#              (custom_components). Example: obs-monitoring (optional monitoring content, observability extras).
schema_version: 1
components:
  # ---------------------------------------------------------------- bootstrap
  - id: bootstrap
    layer: bootstrap
    kind: terraform
    path: bootstrap
    pipeline: manual          # bootstrap is never applied by the universal pipeline
    produces: [bootstrap]

  # --------------------------------------------------------------- foundation
  - id: foundation-network
    layer: foundation
    kind: terraform
    path: foundation/network
    produces: [foundation-network]
  - id: foundation-identity
    layer: foundation
    kind: terraform
    owners: [platform-team, security-team]   # identities / secrets need a security reviewer
    path: foundation/identity
    produces: [foundation-identity]
  - id: foundation-secrets
    layer: foundation
    kind: terraform
    owners: [platform-team, security-team]   # identities / secrets need a security reviewer
    path: foundation/secrets
    consumes: [foundation-identity]
    inputs: [foundation/identity/secrets.yaml]   # secret catalogue (source/publisher metadata)
    dsv_state_output: dsv_desired_state         # converged by tools/secrets/dsv_apply.py (plan stage diff, apply stage)
    catalog_refs: [delinea-dsv]
    drift: {auto_remediate: true}   # additive drift re-applied where environments/<env> self_healing allows (dev)
  - id: foundation-governance
    layer: foundation
    kind: terraform
    path: foundation/governance
    produces: [foundation-governance]
    drift: {auto_remediate: true}   # additive drift re-applied where environments/<env> self_healing allows (dev)
  - id: foundation-deploy-agents
    layer: foundation
    kind: terraform
    path: foundation/deploy-agents
    consumes: [foundation-network, foundation-identity]
    produces: [foundation-deploy-agents]
  - id: foundation-edge
    layer: foundation
    kind: terraform
    path: foundation/edge
    consumes: [foundation-network]
    depends_on: [foundation-secrets]
    secret_env:                                 # App Gateway listener certificate (optional: Front Door managed certs need none)
      TF_VAR_tls_certificate_pfx: appgw-tls-pfx?
      TF_VAR_tls_certificate_password: appgw-tls-pfx#password?
    produces: [foundation-edge]
  - id: foundation-pr-reviewer
    layer: foundation
    kind: terraform
    path: foundation/pr-reviewer
    owners: [platform-team, security-team]   # the reviewer approves PRs: changes to it always need humans
    consumes: [foundation-identity]
    optional_consumes: [foundation-network]
    produces: [foundation-pr-reviewer]
    artifacts: [svc-pr-reviewer]               # code deployed by the apply stage on main only (never PR builds)
    inputs: [tools/review/**, .review/**]
    dsv_state_output: dsv_desired_state        # webhook secret / API key paths converged by tools/secrets/dsv_apply.py

  # ----------------------------------------------------------------- platform
  - id: platform-shared
    layer: platform
    kind: terraform
    path: platform/shared
    consumes: [foundation-network, foundation-identity]
    produces: [platform-shared]
    catalog_refs: [container-registry, log-analytics]
  - id: platform-messaging
    layer: platform
    kind: terraform
    path: platform/messaging
    consumes: [foundation-network, foundation-identity]
    produces: [platform-messaging]
    catalog_refs: [service-bus]
  - id: platform-aks
    layer: platform
    kind: terraform
    path: platform/compute/aks
    consumes: [foundation-network, foundation-identity, platform-shared]
    produces: [platform-aks]
    catalog_refs: [aks]
  - id: platform-containerapps
    layer: platform
    kind: terraform
    path: platform/compute/containerapps
    consumes: [foundation-network, foundation-identity, platform-shared]
    produces: [platform-containerapps]
    catalog_refs: [container-apps-consumption, container-apps-dedicated, container-apps-jobs]
  - id: platform-appservice
    layer: platform
    kind: terraform
    path: platform/compute/appservice
    consumes: [foundation-network, foundation-identity]
    produces: [platform-appservice]
    catalog_refs: [app-service-linux, app-service-windows, functions-dedicated, logic-apps-standard]
  - id: platform-functions
    layer: platform
    kind: terraform
    path: platform/compute/functions
    consumes: [foundation-network, foundation-identity]
    produces: [platform-functions]
    catalog_refs: [functions-flex-consumption, functions-premium, functions-consumption-windows, durable-functions, durable-task-scheduler]
  - id: platform-vm
    layer: platform
    kind: terraform
    path: platform/compute/vm
    consumes: [foundation-network, foundation-identity]
    produces: [platform-vm]
    catalog_refs: [vm-linux, vm-windows]
  - id: platform-vmss
    layer: platform
    kind: terraform
    path: platform/compute/vmss
    consumes: [foundation-network, foundation-identity]
    produces: [platform-vmss]
    catalog_refs: [vmss-flexible, vmss-uniform]
  - id: platform-batch
    layer: platform
    kind: terraform
    path: platform/compute/batch
    consumes: [foundation-network, foundation-identity, platform-shared]
    produces: [platform-batch]
    catalog_refs: [batch]
  - id: platform-servicefabric
    layer: platform
    kind: terraform
    path: platform/compute/servicefabric
    consumes: [foundation-network, foundation-identity]
    produces: [platform-servicefabric]
    catalog_refs: [service-fabric-managed]
  - id: platform-aro
    layer: platform
    kind: terraform
    path: platform/compute/aro
    consumes: [foundation-network]
    depends_on: [foundation-secrets]
    secret_env:
      TF_VAR_pull_secret: aro-pull-secret?
    produces: [platform-aro]
    retry: {attempts: 2, max_minutes: 90}   # ARO create is ~40 min; one re-plan+continue at most
    catalog_refs: [aro]
  - id: platform-specialized-compute
    layer: platform
    kind: terraform
    path: platform/compute/specialized
    consumes: [foundation-network, foundation-identity]
    produces: [platform-specialized-compute]
    catalog_refs: [vm-confidential, dedicated-host, vm-gpu, automation, ml-compute]

  - id: platform-db-sql
    layer: platform
    kind: terraform
    path: platform/data/sql
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-sql]
    catalog_refs: [sql-database-provisioned, sql-database-serverless, sql-elastic-pool, sql-hyperscale]
  - id: platform-db-sqlmi
    layer: platform
    kind: terraform
    path: platform/data/sqlmi
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-sqlmi]
    retry: {attempts: 2, max_minutes: 120}   # SQL MI create/update runs for hours; never re-plan in a tight loop
    catalog_refs: [sql-managed-instance]
  - id: platform-db-sqlvm
    layer: platform
    kind: terraform
    path: platform/data/sqlvm
    consumes: [foundation-network, foundation-identity]
    depends_on: [foundation-secrets]
    secret_env:
      TF_VAR_admin_password: sqlvm-admin-password
      TF_VAR_dbadapter_password: sqlvm-dbadapter-password
    produces: [platform-db-sqlvm]
    catalog_refs: [sql-server-on-vm]
  - id: platform-db-postgresql
    layer: platform
    kind: terraform
    path: platform/data/postgresql
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-postgresql]
    catalog_refs: [postgresql-flexible, postgresql-elastic-cluster]
  - id: platform-db-mysql
    layer: platform
    kind: terraform
    path: platform/data/mysql
    consumes: [foundation-network, foundation-identity]
    secret_env:
      TF_VAR_admin_password: mysql-admin-password?   # optional; ephemeral random when absent
    produces: [platform-db-mysql]
    catalog_refs: [mysql-flexible]
  - id: platform-db-cosmos-nosql
    layer: platform
    kind: terraform
    path: platform/data/cosmos-nosql
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-cosmos-nosql]
    catalog_refs: [cosmos-nosql]
  - id: platform-db-cosmos-mongo
    layer: platform
    kind: terraform
    path: platform/data/cosmos-mongo
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-cosmos-mongo]
    catalog_refs: [cosmos-mongodb-ru]
  - id: platform-db-cosmos-cassandra
    layer: platform
    kind: terraform
    path: platform/data/cosmos-cassandra
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-cosmos-cassandra]
    catalog_refs: [cosmos-cassandra]
  - id: platform-db-cosmos-gremlin
    layer: platform
    kind: terraform
    path: platform/data/cosmos-gremlin
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-cosmos-gremlin]
    catalog_refs: [cosmos-gremlin]
  - id: platform-db-cosmos-table
    layer: platform
    kind: terraform
    path: platform/data/cosmos-table
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-cosmos-table]
    catalog_refs: [cosmos-table]
  - id: platform-db-documentdb
    layer: platform
    kind: terraform
    path: platform/data/documentdb
    consumes: [foundation-network, foundation-identity]
    depends_on: [foundation-secrets]
    secret_env:
      TF_VAR_admin_password: documentdb-admin-password
    produces: [platform-db-documentdb]
    catalog_refs: [documentdb]
  - id: platform-db-cassandra-mi
    layer: platform
    kind: terraform
    path: platform/data/cassandra-mi
    consumes: [foundation-network, foundation-identity]
    depends_on: [foundation-secrets]
    secret_env:
      TF_VAR_admin_password: cassandra-mi-admin-password
    produces: [platform-db-cassandra-mi]
    catalog_refs: [managed-cassandra]
  - id: platform-db-redis
    layer: platform
    kind: terraform
    path: platform/data/redis
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-redis]
    catalog_refs: [managed-redis]
  - id: platform-db-table-storage
    layer: platform
    kind: terraform
    path: platform/data/table-storage
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-table-storage]
    catalog_refs: [table-storage]
  - id: platform-db-ledger
    layer: platform
    kind: terraform
    path: platform/data/ledger
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-ledger]
    catalog_refs: [confidential-ledger]
  - id: platform-db-horizondb
    layer: platform
    kind: terraform
    path: platform/data/horizondb
    consumes: [foundation-network, foundation-identity]
    produces: [platform-db-horizondb]
    catalog_refs: [horizondb]
  - id: platform-data-analytics
    layer: platform
    kind: terraform
    path: platform/data/analytics
    consumes: [foundation-network, foundation-identity]
    produces: [platform-data-analytics]
    catalog_refs: [data-explorer, synapse-sql, synapse-spark, ai-search, blob-storage, adls-gen2]

  # ------------------------------------------------------- observability (lab)
  # Lab roots under observability/lab/ are thin consumers of the portable package
  # in observability/modules; the package never reads lab state.
  - id: obs-prereqs
    layer: observability
    kind: terraform
    path: observability/lab/prereqs
    produces: [obs-prereqs]
    secret_env:                 # Datadog Terraform provider keys (DSV, fetched with the deploy agent identity)
      DD_API_KEY: datadog-api-key
      DD_APP_KEY: datadog-app-key
  - id: obs-azure-integration
    layer: observability
    kind: terraform
    path: observability/lab/azure-integration
    secret_env:                 # Datadog Terraform provider keys (DSV, fetched with the deploy agent identity)
      DD_API_KEY: datadog-api-key
      DD_APP_KEY: datadog-app-key
      TF_VAR_datadog_azure_client_secret: datadog-azure-client-secret?   # only for settings.app_auth = secret
    catalog_refs: [datadog-azure-native-integration]
    drift: {auto_remediate: true}   # additive drift re-applied where environments/<env> self_healing allows (dev)
  - id: obs-telemetry-transport
    layer: observability
    kind: terraform
    path: observability/lab/telemetry-transport
    consumes: [foundation-network, foundation-identity, platform-containerapps]
    produces: [obs-telemetry-transport]
    # dsv-fetch + host-agents scripts: Batch log setup script (templatefile, not a module source); config/**: fleet and
    # tag policy, Observability Pipelines VRL, Fluent Bit / OTel config (file()); onboarding/rendered: per-service tag sets
    inputs: [observability/images/dsv-fetch/**, observability/modules/host-agents/scripts/**, observability/config/**, observability/onboarding/rendered/**]
    secret_env:                 # Datadog Terraform provider keys (Observability Pipelines definition; DSV, deploy agent identity)
      DD_API_KEY: datadog-api-key
      DD_APP_KEY: datadog-app-key
    depends_on: [foundation-secrets]
    artifacts: [img-dsv-fetch]  # init container of the Fluent Bit aggregator / OTel gateway (resolves dsv:// refs)
    secret_outputs: generated_secrets   # eventhub-fluentbit-listen -> DSV after apply (tools/secrets/publish.py)
  - id: obs-diagnostics
    layer: observability
    kind: terraform
    path: observability/lab/diagnostics
    scope: applications         # reads application deployment contracts (resource ids)
    consumes: [obs-telemetry-transport]
    discovers_resources: true   # reads every enabled platform/deployment contract (resource ids)
    drift: {auto_remediate: true}   # additive drift re-applied where environments/<env> self_healing allows (dev)
  - id: obs-hosts
    layer: observability
    kind: terraform
    path: observability/lab/hosts
    scope: applications         # ordered after deploy-vm-workloads (optional_consumes below)
    consumes: [obs-telemetry-transport, platform-vm, platform-vmss]
    # deploy-vm-workloads: ordering only (its run commands create the app log directories the Fluent Bit installer
    # tails, and two managed run commands on one VM should not race); the root declares no variable for it.
    optional_consumes: [platform-vm, platform-vmss, platform-db-sqlvm, deploy-vm-workloads]
    inputs: [observability/images/dsv-fetch/**, observability/config/fleet-policy.yaml, observability/onboarding/rendered/**]
  - id: obs-kubernetes
    layer: observability
    kind: terraform
    path: observability/lab/kubernetes
    consumes: [obs-telemetry-transport, platform-aks, foundation-identity]
    produces: [obs-kubernetes]
    artifacts: [img-dsv-fetch]  # dsv-fetch binary: secret_backend_command of node Agent / Cluster Agent / runners (init container)
    # DBM: the platform-db contracts become cluster checks of the Cluster Agent (settings.dbm = auto)
    optional_consumes: [platform-db-postgresql, platform-db-mysql, platform-db-sql, platform-db-sqlmi, platform-db-sqlvm]
    inputs: [observability/images/dsv-fetch/**, observability/config/fleet-policy.yaml]
  - id: obs-dbm
    layer: observability
    kind: terraform
    path: observability/lab/dbm
    consumes: [obs-telemetry-transport, foundation-network, foundation-identity]
    artifacts: [img-dsv-fetch]  # ACI DBM Agent (no cluster): init container copying the dsv-fetch binary (secret backend)
    # platform-aks present = a cluster runs DBM as cluster checks (obs-kubernetes); settings.hosting = auto -> no ACI Agent
    optional_consumes: [platform-aks, platform-db-postgresql, platform-db-mysql, platform-db-sql, platform-db-sqlmi, platform-db-sqlvm]
    inputs: [observability/config/fleet-policy.yaml]
  - id: obs-monitoring
    layer: observability
    kind: terraform
    path: observability/extras/content/lab/monitoring   # optional monitoring-as-code content (observability extras)
    optional: true              # not in any built-in profile since observability 3.0.0 (profile custom to enable)
    scope: applications         # needs application endpoints/contracts
    consumes: [obs-prereqs]
    secret_env:                 # Datadog Terraform provider keys (DSV, fetched with the deploy agent identity)
      DD_API_KEY: datadog-api-key
      DD_APP_KEY: datadog-app-key
    optional_consumes: [deploy-core-aks, deploy-core-aca, deploy-frontend, deploy-durable, deploy-functions, deploy-partner-sim, deploy-dbadapters, deploy-appservice, deploy-jobs, deploy-vm-workloads, deploy-logicapps, deploy-specialized, obs-telemetry-transport]
    after_deployments: true     # runs after every selected applications deployment (needs endpoints)
    inputs: [observability/extras/content/**]

  # ------------------------------------------------------ observability images (platform scope)
  - id: img-dsv-fetch
    layer: observability
    kind: artifact
    path: observability/images/dsv-fetch
    scope: platform             # built by the platform pipeline; applications roots consume its recorded digest
    # 2.x: static Go binary. container-image = distroless image (/opt/dsv-fetch/dsv-fetch, linux/amd64+arm64);
    # zip-package = release files dsv-fetch-linux-amd64, -linux-arm64, -windows-amd64.exe + SHA256SUMS
    # (pipelines/templates/build-dsv-fetch.yml; artifacts["img-dsv-fetch"].package_url / package_sha256)
    artifact: {type: container-image, name: dsv-fetch, also: [zip-package]}

  # ------------------------------------------------------ application builds
  - id: svc-frontend
    layer: applications
    kind: artifact
    path: applications/services/frontend
    artifact: {type: static-bundle, name: hello-frontend}
  - id: svc-bff
    layer: applications
    kind: artifact
    path: applications/services/bff
    inputs: [applications/shared/dotnet/**, applications/dotnet/**]
    artifact: {type: container-image, name: hello-bff}
  - id: svc-orders-api
    layer: applications
    kind: artifact
    path: applications/services/orders-api
    inputs: [applications/shared/dotnet/**, applications/dotnet/**]
    artifact: {type: container-image, name: hello-orders-api}
  - id: svc-inventory-api
    layer: applications
    kind: artifact
    path: applications/services/inventory-api
    inputs: [applications/shared/dotnet/**, applications/dotnet/**]
    artifact: {type: zip-package, name: hello-inventory-api, also: [container-image]}
  - id: svc-catalog-api
    layer: applications
    kind: artifact
    path: applications/services/catalog-api
    inputs: [applications/shared/python/**]
    artifact: {type: container-image, name: hello-catalog-api, also: [zip-package]}
  - id: svc-dbadapter
    layer: applications
    kind: artifact
    path: applications/services/dbadapter
    inputs: [applications/shared/python/**]
    artifact: {type: container-image, name: hello-dbadapter, also: [zip-package]}
  - id: svc-worker
    layer: applications
    kind: artifact
    path: applications/services/worker
    inputs: [applications/shared/python/**]
    artifact: {type: container-image, name: hello-worker, also: [zip-package]}
  - id: svc-partner-sim
    layer: applications
    kind: artifact
    path: applications/services/partner-sim
    inputs: [applications/shared/python/**]
    artifact: {type: container-image, name: hello-partner-sim}
  - id: svc-durable
    layer: applications
    kind: artifact
    path: applications/services/durable
    inputs: [applications/shared/dotnet/**, applications/dotnet/**]
    artifact: {type: zip-package, name: hello-durable, also: [container-image]}
  - id: svc-functions
    layer: applications
    kind: artifact
    path: applications/services/functions
    inputs: [applications/shared/python/**]
    artifact: {type: zip-package, name: hello-functions, also: [container-image]}
  - id: svc-jobs
    layer: applications
    kind: artifact
    path: applications/services/jobs
    inputs: [applications/shared/python/**]
    artifact: {type: container-image, name: hello-jobs, also: [zip-package]}
  - id: svc-traffic
    layer: applications
    kind: artifact
    path: applications/services/traffic
    artifact: {type: container-image, name: hello-traffic}
  - id: svc-logicapps
    layer: applications
    kind: artifact
    path: applications/services/logicapps
    artifact: {type: zip-package, name: hello-logicapps}
  - id: svc-pr-reviewer
    layer: applications
    kind: artifact
    path: applications/services/pr-reviewer
    scope: platform             # built and deployed with its foundation root (foundation-pr-reviewer)
    owners: [platform-team, security-team]
    inputs: [tools/review/**, tools/changeset/**, applications/shared/python/**]
    artifact: {type: zip-package, name: eh-pr-reviewer}

  # --------------------------------------------------- application deployments
  - id: deploy-core-aks
    produces: [deploy-core-aks]
    layer: applications
    kind: terraform
    path: applications/deployments/core-aks
    consumes: [platform-aks, platform-shared, platform-messaging, platform-db-sql, platform-db-postgresql, obs-telemetry-transport, foundation-identity]
    optional_consumes: [platform-db-redis, obs-kubernetes]
    artifacts: [svc-bff, svc-orders-api, svc-catalog-api, svc-worker]
    inputs: [applications/charts/hello-service/**]
  - id: deploy-core-aca
    produces: [deploy-core-aca]
    layer: applications
    kind: terraform
    path: applications/deployments/core-aca
    consumes: [platform-containerapps, platform-shared, platform-messaging, platform-db-sql, platform-db-postgresql, obs-telemetry-transport, foundation-identity]
    optional_consumes: [platform-db-redis]
    artifacts: [svc-bff, svc-orders-api, svc-catalog-api, img-dsv-fetch]   # img-dsv-fetch: init container of the Fluent Bit sidecar (platform artifact, recorded digest)
  - id: deploy-frontend
    produces: [deploy-frontend]
    layer: applications
    kind: terraform
    path: applications/deployments/frontend
    consumes: [obs-prereqs, foundation-identity]
    optional_consumes: [deploy-core-aks, deploy-core-aca, foundation-edge]
    artifacts: [svc-frontend]
  - id: deploy-durable
    produces: [deploy-durable]
    layer: applications
    kind: terraform
    path: applications/deployments/durable
    consumes: [platform-functions, platform-messaging, platform-db-sql, obs-telemetry-transport, foundation-identity, foundation-network]
    optional_consumes: [deploy-partner-sim, deploy-core-aks, deploy-core-aca, deploy-appservice]
    artifacts: [svc-durable]
  - id: deploy-functions
    produces: [deploy-functions]
    layer: applications
    kind: terraform
    path: applications/deployments/functions
    consumes: [platform-functions, platform-messaging, obs-telemetry-transport, foundation-identity, platform-shared, foundation-network]
    optional_consumes: [platform-appservice, platform-containerapps, platform-db-ledger, platform-db-table-storage]
    artifacts: [svc-functions]
  - id: deploy-partner-sim
    produces: [deploy-partner-sim]
    layer: applications
    kind: terraform
    path: applications/deployments/partner-sim
    consumes: [foundation-network, platform-shared, obs-telemetry-transport, foundation-identity]
    artifacts: [svc-partner-sim, img-dsv-fetch]   # img-dsv-fetch: init container of the Fluent Bit sidecar (platform artifact, recorded digest)
  - id: deploy-dbadapters
    produces: [deploy-dbadapters]
    layer: applications
    kind: terraform
    path: applications/deployments/dbadapters
    consumes: [platform-containerapps, platform-shared, obs-telemetry-transport, foundation-identity]
