    reason: "Fabric workspace item - no ARM API."
    owner_component: null
    references: [https://learn.microsoft.com/en-us/fabric/real-time-intelligence/eventhouse]
  - service_id: fabric-warehouse
    arm_types: []
    azurerm_status: missing
    resolution: not-iac-deployable
    reason: "Fabric workspace item - no ARM API."
    owner_component: null
    references: [https://learn.microsoft.com/en-us/fabric/data-warehouse/data-warehousing]
  - service_id: fabric-spark
    arm_types: []
    azurerm_status: missing
    resolution: not-iac-deployable
    reason: "Fabric workspace item - no ARM API."
    owner_component: null
    references: [https://learn.microsoft.com/en-us/fabric/data-engineering/spark-compute]
  - service_id: mariadb
    arm_types: []
    azurerm_status: removed
    resolution: not-iac-deployable
    reason: "Service retired 2025-09-19; azurerm_mariadb_* removed from the provider."
    owner_component: null
    references: [https://learn.microsoft.com/en-us/lifecycle/products/azure-database-for-mariadb]
  - service_id: postgresql-single-server
    arm_types: []
    azurerm_status: removed
    resolution: not-iac-deployable
    reason: "Retired 2025-03-28; azurerm_postgresql_server removed."
    owner_component: null
    references: [https://learn.microsoft.com/en-us/lifecycle/end-of-support/end-of-support-2025]
