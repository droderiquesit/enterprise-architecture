    reason: "Azure Native Integration listed as retired."
    owner_component: null
    references: [https://learn.microsoft.com/en-us/azure/partner-solutions/partners]
# Not gaps (checked, azurerm 5.9.0 has them): azurerm_mongo_cluster (Azure DocumentDB), azurerm_managed_redis,
# azurerm_function_app_flex_consumption, azurerm_container_app_job, azurerm_cosmosdb_cassandra_cluster/_datacenter,
# azurerm_postgresql_flexible_server cluster{} (elastic clusters), azurerm_confidential_ledger, azurerm_managed_devops_pool,
# azurerm_vmware_private_cloud, azurerm_redhat_openshift_cluster, azurerm_service_fabric_managed_cluster,
# azurerm_oracle_* (Database@Azure), azurerm_fabric_capacity, azurerm_static_web_app, azurerm_logic_app_standard.
  - service_id: cosmos-table
    arm_types:
      - {type: Microsoft.DocumentDB/databaseAccounts/tableRoleAssignments, api_version: "2026-03-15"}
    azurerm_status: partial
    resolution: azapi
    reason: "azurerm 5.9.0 manages the Table API account and tables but has no resource for Table API data-plane RBAC role assignments (only azurerm_cosmosdb_sql_role_assignment for NoSQL)."
    owner_component: platform-db-cosmos-table
    references:
      - https://learn.microsoft.com/en-us/azure/templates/microsoft.documentdb/databaseaccounts/tableroleassignments
  - service_id: sql-managed-instance
    arm_types:
      - {type: Microsoft.Sql/managedInstances, api_version: "2025-01-01"}
    azurerm_status: partial
    resolution: azapi
    reason: "azurerm_mssql_managed_instance cannot set properties.pricingModel=Freemium (SQL MI free offer). azapi is used only when settings.free_offer = true; otherwise azurerm."
    owner_component: platform-db-sqlmi
    references:
      - https://learn.microsoft.com/en-us/azure/templates/microsoft.sql/managedinstances
      - https://learn.microsoft.com/en-us/azure/azure-sql/managed-instance/free-offer
  - service_id: logic-apps-consumption
    arm_types:
      - {type: Microsoft.Web/connections, api_version: "2016-06-01"}
    azurerm_status: partial
    resolution: azapi
    reason: "azurerm_api_connection cannot set parameterValueSet = managedIdentityAuth, required for the Service Bus managed API connection to authenticate with the Logic App's managed identity (no SAS keys). azapi schema validation disabled for this resource only."
    owner_component: deploy-logicapps
    references:
      - https://learn.microsoft.com/en-us/azure/templates/microsoft.web/connections
      - https://learn.microsoft.com/en-us/azure/logic-apps/authenticate-with-managed-identity
  - service_id: container-apps-consumption
    arm_types:
      - {type: Microsoft.App/containerApps, api_version: "2025-07-01"}
    azurerm_status: partial
    resolution: azapi
    reason: "observability/modules/telemetry-transport (Fluent Bit aggregator + OTel gateway apps, owned by obs-telemetry-transport): azurerm_container_app 5.9.0 has no ingress additionalPortMappings (OTLP gRPC 4317 + HTTP 4318 / forward 24224 + HTTP on one app) and no secret volume item paths (secrets mounted as named config files). Application container apps stay on azurerm."
    owner_component: obs-telemetry-transport
    references:
      - https://learn.microsoft.com/en-us/azure/templates/microsoft.app/2025-07-01/containerapps
      - https://learn.microsoft.com/en-us/azure/container-apps/ingress-overview#additional-tcp-ports
      - https://learn.microsoft.com/en-us/azure/container-apps/manage-secrets#mounting-secrets-in-a-volume
  - service_id: datadog-azure-native-integration
    arm_types:
      - {type: Microsoft.Datadog/monitors/monitoredSubscriptions, api_version: "2025-06-11"}
    azurerm_status: partial
    resolution: azapi
    reason: "azurerm 5.9.0 has azurerm_datadog_monitor (+ _tag_rule, _sso_configuration) but no resource for monitors/monitoredSubscriptions (additional subscriptions monitored by one Datadog native monitor). Used only by observability/modules/azure-integration in mode = native with extra subscriptions."
    owner_component: obs-azure-integration
    references:
      - https://learn.microsoft.com/en-us/azure/templates/microsoft.datadog/2025-06-11/monitors/monitoredsubscriptions
      - https://learn.microsoft.com/en-us/azure/partner-solutions/datadog/overview
