# DSV secret catalogue of the lab (ADR-0001 section 14). NAMES and metadata only - never values.
# Path of each secret: /<name_prefix>/<env>/<name>, element `value` (reference dsv://<prefix>/<env>/<name>#value).
#
# source:
#   operator   set/rotated by an operator with the dsv CLI (docs/runbooks/secret-rotation.md)
#   generated  produced by Azure during an apply and written to DSV by tools/secrets/publish.py (publisher = the
#              component that owns the Azure resource; it runs in that component's apply job on the deploy pool)
# required_by: components whose apply/runtime needs the value; tools/secrets/check.py reports a missing path as an
#              error when one of them is enabled in the environment (generated secrets: after their publisher applied).
# readers of each secret are the identities whose `secrets` list (main.tf) contains it; foundation-secrets turns
# that into one DSV permission per identity.
secrets:
  datadog-api-key:
    source: operator
    description: Datadog API key (agents, Fluent Bit, OTel gateway, Batch/VM installers, pipeline)
    origin: Datadog organization settings > API keys
    required_by: [obs-telemetry-transport, obs-kubernetes, obs-hosts, obs-dbm, obs-prereqs, obs-azure-integration, obs-monitoring]
  datadog-app-key:
    source: operator
    description: Datadog application key - pipeline only (Datadog Terraform provider)
    origin: Datadog organization settings > Application keys (scoped)
    required_by: [obs-prereqs, obs-azure-integration, obs-monitoring]
  datadog-client-token:
    source: operator
    description: Browser RUM client token (browser-safe; stored centrally, injected at deploy)
    origin: Datadog RUM application
    required_by: [deploy-frontend]
  fault-token:
    source: operator
    description: X-Fault-Token for POST /admin/faults (lab fault injection)
    origin: generate (dsv secret create ... with a random 48-byte value)
    required_by: [deploy-core-aca, deploy-core-aks, deploy-partner-sim, deploy-durable]
  fluentbit-shared-key:
    source: operator
    description: Fluent Bit forward protocol shared key (aggregator forward input; sidecar_mode = forward)
    origin: generate
    required_by: [obs-telemetry-transport]
  eventhub-fluentbit-listen:
    source: generated
    publisher: obs-telemetry-transport
    description: Event Hubs Listen-rule connection string read by the Fluent Bit aggregator (kafka input)
    origin: azurerm_eventhub_namespace_authorization_rule (sensitive output generated_secrets of obs-telemetry-transport)
    required_by: [obs-telemetry-transport]
  # ------------------------------------------------------------- DB adapter (key/password APIs without Entra)
  sqlvm-dbadapter-password:
    source: operator
    description: SQL login `dbadapter` on SQL Server on VM (platform-db-sqlvm input; adapter runtime)
    origin: generate; platform-db-sqlvm applies it (ephemeral pipeline input, lands in state - known limitation)
    required_by: [platform-db-sqlvm]
  cassandra-mi-dbadapter-password:
    source: operator
    description: Cassandra role password of the adapter on Managed Instance for Apache Cassandra
    origin: generate, then CREATE ROLE (platform/data/cassandra-mi/scripts/create-keyspace.cql)
    required_by: [platform-db-cassandra-mi]
  cosmos-cassandra-password:
    source: operator
    description: Cosmos DB for Apache Cassandra account key (no Entra data-plane auth for the Cassandra API)
    origin: az cosmosdb keys list (operator copies; rotate by regenerating the key)
    required_by: [platform-db-cosmos-cassandra]
  cosmos-gremlin-key:
    source: operator
    description: Cosmos DB for Apache Gremlin account key
    origin: az cosmosdb keys list
    required_by: [platform-db-cosmos-gremlin]
  cosmos-mongo-connection-string:
    source: operator
    description: Cosmos DB for MongoDB (RU) connection string
    origin: az cosmosdb keys list --type connection-strings
    required_by: [platform-db-cosmos-mongo]
  # ------------------------------------------------------------- DBM (engines without managed-identity auth)
  dbm-mysql-password:
    source: operator
    description: datadog user password on MySQL Flexible (DBM SQL auth)
    origin: generate, then ALTER USER
    dbm_engine: mysql
    required_by: [obs-dbm]
  dbm-sqlvm-password:
    source: operator
    description: datadog login password on SQL Server VM (DBM SQL auth)
    origin: generate, then ALTER LOGIN
    dbm_engine: sqlvm
    required_by: [obs-dbm]
  dbm-sqldb-password:
    source: operator
    description: datadog login on Azure SQL DB (only when settings.dbm_sql_auth_engines contains sqldb)
    origin: generate, then ALTER LOGIN
    dbm_engine: sqldb
    required_by: [obs-dbm]
  dbm-sqlmi-password:
    source: operator
    description: datadog login on SQL MI (only when settings.dbm_sql_auth_engines contains sqlmi)
    origin: generate, then ALTER LOGIN
    dbm_engine: sqlmi
    required_by: [obs-dbm]
  dbm-postgres-password:
    source: operator
    description: datadog role on PostgreSQL Flexible (only when settings.dbm_sql_auth_engines contains postgres)
    origin: generate, then ALTER ROLE
    dbm_engine: postgres
    required_by: [obs-dbm]
  # ------------------------------------------------------------- platform apply inputs (pipeline -> ephemeral TF_VAR_)
  sqlvm-admin-password:
    source: operator
    description: SQL Server VM local administrator + SQL connectivity password (platform-db-sqlvm input)
    origin: generate (>= 12 chars, 3 of 4 classes, no quotes)
    required_by: [platform-db-sqlvm]
  documentdb-admin-password:
    source: operator
    description: Azure DocumentDB (vCore) native administrator password (platform-db-documentdb input)
    origin: generate
    required_by: [platform-db-documentdb]
  cassandra-mi-admin-password:
    source: operator
    description: Managed Instance for Apache Cassandra default admin password (platform-db-cassandra-mi input)
    origin: generate
    required_by: [platform-db-cassandra-mi]
  mysql-admin-password:
    source: operator
    optional: true
    description: MySQL Flexible break-glass administrator password (write-only argument; optional - without it an ephemeral random value is used)
    origin: generate
    required_by: []
  appgw-tls-pfx:
    source: operator
    optional: true
    description: 'Application Gateway listener certificate: element `value` = base64 PFX, element `password` = PFX password'
    origin: your CA / ACME client
    required_by: []
  aro-pull-secret:
    source: operator
    optional: true
    description: Red Hat pull secret JSON for ARO (optional)
    origin: console.redhat.com/openshift/install/pull-secret
    required_by: []
  datadog-azure-client-secret:
    source: operator
    optional: true
    description: Client secret of the Datadog Azure integration app (only US1-FED/US2-FED/sovereign, where Secretless Auth is unavailable)
    origin: az ad app credential reset (bootstrap/README.md "Datadog Azure integration app registration")
    required_by: []
