# Lab environment "dev". Values here are inputs, not secrets.
# Schema: environments/schema/environment.schema.json
environment:
  name: dev
  location: swedencentral          # verified to offer Flex Consumption, Managed Redis, DocumentDB, AKS, ACA workload profiles
  subscription_id: "00000000-0000-0000-0000-000000000000"   # replace; never commit real secrets (IDs are not secrets)
  tenant_id: "00000000-0000-0000-0000-000000000000"
  name_prefix: eh
  owner: platform-team@example.com
  team: platform-engineering
  cost_center: lab-0001
  expires_on: "2026-12-31"
  tags: {}
profile: minimal
custom_components: []
datadog:
  site: datadoghq.com
  api_key_secret_name: datadog-api-key       # Delinea DSV secret names (values set out-of-band, ADR-0001 section 14)
  app_key_secret_name: datadog-app-key
# Delinea DevOps Secrets Vault: every key/secret lives here; workloads read it directly with their managed identity.
# Identifiers only (bootstrap/README.md "Delinea DSV prerequisites"). Replace the placeholder tenant before the first run.
secrets:
  provider: delinea-dsv
  tenant: example-lab              # <tenant>.secretsvaultcloud.<tld>
  tld: com
  auth_provider: azure-eh          # DSV Azure auth provider (type azure, tenantId = environment.tenant_id)
network:
  hub_address_space: 10.40.0.0/20
  spoke_address_space: 10.41.0.0/16
budget:
  # Rendered into foundation-governance (var.budget). No consumption budget in dev (owner decision 2026-10-10): the
  # subscription budget is not created. Cost estimates per profile: docs/guides/deployment-profiles.md.
  # test/prod keep their budgets. Set enabled: true (+ monthly_amount) to bring a dev budget back.
  enabled: false
  currency: USD
  contact_emails: [platform-team@example.com]
# Pipeline self-healing (pipelines/README.md "Self-healing"). Not a Terraform input: no fingerprint changes.
self_healing:
  enabled: true                    # heal runs (schedule "heal", every 2 h) re-run failed components; dev approvals are checks-free
  heal_interval_hours: 2
  max_consecutive_failures: 3      # circuit breaker -> quarantined
  drift_auto_remediate: true       # additive-only drift of drift.auto_remediate components is re-applied
  auto_rollback: true              # application deploy roots only; infrastructure never auto-rolls back
  notify: {work_item: false, datadog_event: true}
# Per-component overrides of each root's `settings` defaults (see <root>/variables.tf).
# Observability settings (3.0.0: obs-telemetry-transport fleet / op_* / apm_gateway_*, obs-kubernetes ssi_namespaces,
# obs-prereqs rum_applications; 4.0.0: obs-kubernetes values_overrides / dbm, obs-hosts mode / package_version,
# obs-dbm hosting): environments/profiles/README.md. The 2.x obs-azure-integration log_management is ignored.
components:
  # Automated PR reviewer (enabled by the enterprise/full profiles or custom_components; docs/guides/automated-pr-review.md).
  # Placeholders: replace with the real Azure DevOps organization, project / repository ids and, after the reviewer's
  # managed identity was added to the organization, its identity id (tools/review/ado_setup.py prints them).
  foundation-pr-reviewer:
    ado:
      organization: example-org
      project: enterprise-hello
      project_id: "00000000-0000-0000-0000-000000000000"
      repository_ids: ["00000000-0000-0000-0000-000000000000"]
      reviewer_id: ""
