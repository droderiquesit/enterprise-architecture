# Promotion chains: "build once, promote".
# The first environment of a chain builds artifacts from source (Build stage: resolve existing digest for the
# source fingerprint, else build). Every later environment NEVER builds: tools/deploy/artifacts.py promote
# copies the exact image digest / package sha256 recorded by its `promote_from` environment for the SAME
# source fingerprint (az acr import by digest, package copy with sha256 check) and fails if that environment
# has not successfully recorded the artifact yet ("promote dev first").
# Schema: environments/schema/promotion.schema.json. Checked by tools/validate/pipeline_templates.py
# against environments/<env>/environment.yaml, pipelines/variables/<env>.yml and the pipeline parameter lists.
schema_version: 1
chains:
  - name: lab
    environments:
      - name: dev
        ado_environment: lab-dev                 # approvals (optional for dev) + exclusive lock
        retire_environment: lab-dev-retire
        ci_trigger: true                         # CI on main deploys here (default of the `environment` parameter)
        allowed_modes: [auto, manual, reconcile, drift, retire]
        allow_dry_run: true
      - name: test
        promote_from: dev
        ado_environment: lab-test                # approvals required
        retire_environment: lab-test-retire
        ci_trigger: false                        # queued through pipelines/promote.yml
        allowed_modes: [auto, manual, reconcile, drift, retire]
        allow_dry_run: true
      - name: prod
        promote_from: test
        ado_environment: lab-prod                # approvals required (2 approvers, not the requester) + exclusive lock
        retire_environment: lab-prod-retire
        ci_trigger: false
        allowed_modes: [auto, manual, drift, retire]   # no blanket reconcile in prod: manual per component instead
        allow_dry_run: true
        require_apply_approval: true             # operator checklist item: the lab-prod approval check must exist
