# Lab environment "test" (SKELETON - replace subscription/tenant ids before first use; promoted from the
# previous environment in environments/promotion.yaml, never built from source). Values here are inputs, not secrets.
# Schema: environments/schema/environment.schema.json
environment:
  name: test
  location: swedencentral          # verified to offer Flex Consumption, Managed Redis, DocumentDB, AKS, ACA workload profiles
  subscription_id: "00000000-0000-0000-0000-000000000000"   # replace; never commit real secrets (IDs are not secrets)
  tenant_id: "00000000-0000-0000-0000-000000000000"
  name_prefix: eh
  owner: platform-team@example.com
  team: platform-engineering
  cost_center: lab-0001
  expires_on: "2027-03-31"
  tags: {}
profile: minimal
custom_components: []
datadog:
  site: datadoghq.com
  api_key_secret_name: datadog-api-key       # Delinea DSV secret names (values set out-of-band, ADR-0001 section 14)
  app_key_secret_name: datadog-app-key
# Delinea DevOps Secrets Vault: every key/secret lives here; workloads read it directly with their managed identity.
# Identifiers only (bootstrap/README.md "Delinea DSV prerequisites"). Replace the placeholder tenant before the first run.
secrets:
  provider: delinea-dsv
  tenant: example-lab              # <tenant>.secretsvaultcloud.<tld>
  tld: com
  auth_provider: azure-eh          # DSV Azure auth provider (type azure, tenantId = environment.tenant_id)
network:
  hub_address_space: 10.50.0.0/20
  spoke_address_space: 10.51.0.0/16
budget:
  # Rendered into foundation-governance (var.budget). 500 = the minimal-profile estimate of roughly USD 400-450/month
  # (docs/guides/deployment-profiles.md, cost table) + ~10 % headroom, so the 100 % alert means "above plan".
  # Azure budgets alert only; they never cap spend.
  monthly_amount: 500
  currency: USD
  contact_emails: [platform-team@example.com]
# Pipeline self-healing (pipelines/README.md "Self-healing"). Heal runs stop at the environment approval.
self_healing:
  enabled: true
  heal_interval_hours: 6
  max_consecutive_failures: 3
  drift_auto_remediate: false      # drift is reported, never re-applied automatically
  auto_rollback: true
  notify: {work_item: true, work_item_type: Bug, datadog_event: true}
# Per-component overrides of each root's `settings` defaults (see <root>/variables.tf).
# Observability 3.0.0 settings (obs-telemetry-transport fleet / op_* / apm_gateway_*, obs-kubernetes ssi_namespaces,
# obs-prereqs rum_applications mode/application_id/client_token): environments/profiles/README.md. log_management is ignored.
components: {}
