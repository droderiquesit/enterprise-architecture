# Promotion entry point (thin): deploys a later environment of a promotion chain with the SAME
# artifacts (digests / package sha256) its `promote_from` environment recorded - never rebuilds.
# It is a separate ADO pipeline definition only so that "who may queue a prod run" is a pipeline
# permission; the work is identical to azure-pipelines.yml because both extend
# pipelines/templates/universal.yml (which also satisfies the Required template checks).
# Why not a "promote" mode: promotion is not a different algorithm. Running the normal fingerprint
# selection in test/prod already deploys exactly what changed since that environment's last records;
# the only difference - promote instead of build - is decided by environments/promotion.yaml
# (pipelines/variables/<env>.yml promoteFrom), so one code path serves every environment.

name: promote-$(Date:yyyyMMdd)$(Rev:.r)

trigger: none
pr: none

lockBehavior: sequential

parameters:
  - name: environment
    displayName: Target environment (promoted from the previous one in environments/promotion.yaml)
    type: string
    default: test
    values:
      - test
      - prod
  - name: mode
    displayName: Mode (allowed modes per environment in environments/promotion.yaml)
    type: string
    default: auto
    values:
      - auto
      - manual
      - reconcile
      - drift
      - retire
  - name: components
    displayName: Components (manual mode, comma separated)
    type: string
    default: ' '
  - name: withConsumers
    displayName: Manual mode - also plan/apply consumers
    type: boolean
    default: false
  - name: dryRun
    displayName: Dry run (plan only)
    type: boolean
    default: false

extends:
  template: templates/universal.yml
  parameters:
    environment: ${{ parameters.environment }}
    mode: ${{ parameters.mode }}
    components: ${{ parameters.components }}
    withConsumers: ${{ parameters.withConsumers }}
    dryRun: ${{ parameters.dryRun }}
    entry: promote
