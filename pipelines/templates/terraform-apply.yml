# Apply deployment job of the apply stage C_<x> (APPLY identity) behind the approvals/checks of
# environment lab-<env>. Checks are evaluated when C_<x> starts, i.e. AFTER P_<x> published the plan
# summary, so approvers review a real plan. Not compiled when dryRun is true (C_<x> is then skipped by
# its condition). The stage runs only when the plan reported changes and the component is an apply
# candidate. Writes a succeeded record only after apply,
# code deploy, smoke and contract publication succeeded; any failure writes failed/partial/canceled.
parameters:
  - name: component
    type: string
  - name: componentPath
    type: string
  - name: artifacts
    type: object
    default: []
  - name: timeoutMinutes
    type: number
    default: 60
  - name: environment
    type: string
  - name: dryRun
    type: boolean
    default: false
  - name: recordedArtifacts       # artifacts built by the OTHER pipeline: digest from their deployment record
    type: object
    default: []
  - name: secretEnv               # registry secret_env: Terraform runs through tools/secrets/fetch.py exec (DSV)
    type: boolean
    default: false
  - name: settings
    type: object

jobs:
  - ${{ if eq(parameters.dryRun, false) }}:
    - deployment: Apply
      displayName: Apply ${{ parameters.component }}
      # gated by the stage condition (plan stage succeeded with changes, apply candidate, not a dry run)
      environment: lab-${{ parameters.environment }}
      timeoutInMinutes: ${{ parameters.timeoutMinutes }}
      cancelTimeoutInMinutes: 15
      workspace:
        clean: all
      variables:
        - name: LAB_ENV
          value: ${{ parameters.environment }}
        - name: STATE_STORAGE_ACCOUNT        # store URLs and work paths derive from it (pipeline-env.sh)
          value: ${{ parameters.settings.stateStorageAccount }}
        - name: PLAN_ARTIFACT
          value: $[ stageDependencies.P_${{ replace(parameters.component, '-', '_') }}.Plan.outputs['plan.artifact'] ]
        - ${{ each artifact in parameters.artifacts }}:
          - name: ARTIFACT_${{ replace(artifact, '-', '_') }}
            value: $[ stageDependencies.Build.B_${{ replace(artifact, '-', '_') }}.outputs['ready.artifact'] ]
        - name: RECORDED_ARTIFACTS      # tf-prepare.sh: these artifacts' metadata comes from their deployment records
          value: ${{ join(',', parameters.recordedArtifacts) }}
        - name: TF_SECRET_ENV           # tf-plan.sh / tf-apply.sh wrap terraform with tools/secrets/fetch.py exec
          value: ${{ lower(parameters.secretEnv) }}
      strategy:
        runOnce:
          deploy:
            steps:
              - download: none            # deployment jobs auto-download every artifact otherwise
              - template: steps-component-inputs.yml
                parameters:
                  artifacts: ${{ parameters.artifacts }}
                  planArtifact: $(PLAN_ARTIFACT)
              - template: steps-terraform.yml
                parameters:
                  name: apply
                  displayName: Re-render, verify plan binding, apply, deploy code, publish contract, record
                  serviceConnection: ${{ parameters.settings.applyServiceConnection }}
                  serviceConnectionId: ${{ parameters.settings.applyServiceConnectionId }}
                  script: |
                    bash pipelines/scripts/tf-prepare.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
                    bash pipelines/scripts/tf-init.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
                    bash pipelines/scripts/tf-apply.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
              - task: AzureCLI@2
                displayName: Record failed / partial / canceled deployment
                condition: not(succeeded())
                inputs:
                  azureSubscription: ${{ parameters.settings.applyServiceConnection }}
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: bash pipelines/scripts/tf-record-failure.sh "${{ parameters.component }}" "$(Agent.JobStatus)"
  - ${{ else }}:
    # dry run: the stage still needs a job to compile; its condition (DRY_RUN) keeps it skipped, so no
    # environment, approval or credential is ever requested.
    - job: ApplyDryRun
      displayName: Dry run - no apply
      pool: server
      timeoutInMinutes: 1
      steps:
        - task: Delay@1
          inputs:
            delayForMinutes: '0'
