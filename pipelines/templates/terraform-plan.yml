# Plan job of a component stage. Runs with the read-mostly PLAN identity.
# Produces: output has_changes/plan_exit (step `plan`), the plan file in the protected `plans` blob
# container (never a pipeline artifact) and pipeline artifact plan-<component> containing only the
# human-readable summary + binding manifest.
parameters:
  - name: component
    type: string
  - name: componentPath
    type: string
  - name: artifacts
    type: object
    default: []
  - name: timeoutMinutes
    type: number
    default: 60
  - name: environment
    type: string
  - name: dryRun
    type: boolean
    default: false
  - name: settings
    type: object

jobs:
  - job: Plan
    displayName: Plan ${{ parameters.component }}
    timeoutInMinutes: ${{ parameters.timeoutMinutes }}
    cancelTimeoutInMinutes: 10
    variables:
      - name: LAB_ENV
        value: ${{ parameters.environment }}
      - name: APPLY_CANDIDATE
        value: $[ stageDependencies.Select.select.outputs['detect.apply_${{ replace(parameters.component, '-', '_') }}'] ]
      - name: BINDING_FILE
        value: $(Agent.TempDirectory)/binding.json
      - name: SELECTION_FILE
        value: $(Pipeline.Workspace)/selection/selection.json
      - name: ARTIFACT_METADATA_DIR
        value: $(Pipeline.Workspace)/artifact-metadata
      - name: OUT_DIR
        value: $(Build.ArtifactStagingDirectory)/plan
      - name: STATE_STORAGE_ACCOUNT
        value: ${{ parameters.settings.stateStorageAccount }}
      - name: CONTRACTS_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/contracts
      - name: PLANS_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/plans
      - name: RECORDS_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/deployments
      - name: DRY_RUN
        value: ${{ parameters.dryRun }}
      # Datadog keys (Key Vault-linked variable group) only for the roots that need them; mapped into
      # the plan/apply step env below (never written to disk, never passed as tfvars).
      - ${{ if in(parameters.component, 'obs-prereqs', 'obs-azure-integration', 'obs-monitoring', 'obs-kubernetes') }}:
        - group: ${{ parameters.settings.datadogVariableGroup }}
    steps:
      - checkout: self
        fetchDepth: 1
      - task: DownloadPipelineArtifact@2
        displayName: Download selection
        retryCountOnTaskFailure: 2
        inputs:
          artifact: selection
          path: $(Pipeline.Workspace)/selection
      - ${{ each artifact in parameters.artifacts }}:
        - task: DownloadPipelineArtifact@2
          displayName: Download metadata of ${{ artifact }}
          retryCountOnTaskFailure: 2
          inputs:
            artifact: artifact-${{ artifact }}
            path: $(Pipeline.Workspace)/artifact-metadata/${{ artifact }}
      - template: steps-setup.yml
        parameters:
          tools: terraform
      - task: AzureCLI@2
        name: prepare
        displayName: Render config, contracts and artifact digests
        inputs:
          azureSubscription: ${{ parameters.settings.planServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          addSpnToEnvironment: true
          inlineScript: |
            set -euo pipefail
            source pipelines/scripts/tf-env.sh
            bash pipelines/scripts/tf-prepare.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
        env:
          ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: ${{ parameters.settings.planServiceConnectionId }}
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
      - task: AzureCLI@2
        name: init
        displayName: terraform init (remote state)
        retryCountOnTaskFailure: 2
        inputs:
          azureSubscription: ${{ parameters.settings.planServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          addSpnToEnvironment: true
          inlineScript: |
            set -euo pipefail
            source pipelines/scripts/tf-env.sh
            bash pipelines/scripts/tf-init.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
        env:
          ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: ${{ parameters.settings.planServiceConnectionId }}
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
      - task: AzureCLI@2
        name: plan
        displayName: terraform plan + policy + binding manifest
        inputs:
          azureSubscription: ${{ parameters.settings.planServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          addSpnToEnvironment: true
          inlineScript: |
            set -euo pipefail
            source pipelines/scripts/tf-env.sh
            bash pipelines/scripts/tf-plan.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
        env:
          ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: ${{ parameters.settings.planServiceConnectionId }}
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
          # Datadog provider credentials (obs-prereqs / obs-azure-integration / obs-monitoring)
          ${{ if in(parameters.component, 'obs-prereqs', 'obs-azure-integration', 'obs-monitoring') }}:
            DD_API_KEY: $(datadog-api-key)
            DD_APP_KEY: $(datadog-app-key)
          # obs-kubernetes: ephemeral input variable (Terraform never persists it in state or plan)
          ${{ if eq(parameters.component, 'obs-kubernetes') }}:
            TF_VAR_datadog_api_key: $(datadog-api-key)
      - task: PublishPipelineArtifact@1
        displayName: Publish plan summary + manifest (no plan file)
        condition: not(canceled())
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/plan
          artifact: plan-${{ parameters.component }}-$(System.JobAttempt)
