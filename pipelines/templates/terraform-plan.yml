# Plan job of a component stage (PLAN identity: read-mostly).
# Output (step `plan`): has_changes, plan_exit, artifact (attempt-aware name of the summary artifact).
# The plan file goes to the protected `plans` blob container, never to a pipeline artifact; only the
# human-readable summary + binding manifest are published.
parameters:
  - name: component
    type: string
  - name: componentPath
    type: string
  - name: artifacts
    type: object
    default: []
  - name: timeoutMinutes
    type: number
    default: 60
  - name: environment
    type: string
  - name: datadog
    type: string
    default: none
  - name: settings
    type: object

jobs:
  - job: Plan
    displayName: Plan ${{ parameters.component }}
    timeoutInMinutes: ${{ parameters.timeoutMinutes }}
    cancelTimeoutInMinutes: 10
    workspace:
      clean: all
    variables:
      - name: LAB_ENV
        value: ${{ parameters.environment }}
      - name: STATE_STORAGE_ACCOUNT          # store URLs and work paths derive from it (pipeline-env.sh)
        value: ${{ parameters.settings.stateStorageAccount }}
      - name: APPLY_CANDIDATE
        value: $[ stageDependencies.Select.select.outputs['detect.apply_${{ replace(parameters.component, '-', '_') }}'] ]
      - ${{ each artifact in parameters.artifacts }}:
        - name: ARTIFACT_${{ replace(artifact, '-', '_') }}
          value: $[ stageDependencies.Build.B_${{ replace(artifact, '-', '_') }}.outputs['ready.artifact'] ]
      - ${{ if ne(parameters.datadog, 'none') }}:
        - group: ${{ parameters.settings.datadogVariableGroup }}
    steps:
      - template: steps-component-inputs.yml
        parameters:
          artifacts: ${{ parameters.artifacts }}
      - template: steps-terraform.yml
        parameters:
          name: plan
          displayName: Render, contracts, init, plan, policy, binding manifest
          serviceConnection: ${{ parameters.settings.planServiceConnection }}
          serviceConnectionId: ${{ parameters.settings.planServiceConnectionId }}
          datadog: ${{ parameters.datadog }}
          script: |
            bash pipelines/scripts/tf-prepare.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
            bash pipelines/scripts/tf-init.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
            bash pipelines/scripts/tf-plan.sh "${{ parameters.component }}" "${{ parameters.componentPath }}"
      - task: PublishPipelineArtifact@1
        displayName: Publish plan summary + manifest (no plan file)
        condition: not(canceled())
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/plan
          artifact: plan-${{ parameters.component }}-$(System.JobAttempt)
