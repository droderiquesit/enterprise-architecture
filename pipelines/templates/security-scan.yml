# Security scanning (job template). Runs on Microsoft-hosted agents with NO service connection, so
# it is safe for untrusted PR code. Tools are installed in-job at pinned versions with checksum
# verification (pipelines/scripts/install-tools.sh, versions in pipelines/variables/tools.yml):
#   gitleaks  secrets in the working tree (and git history of the PR range when available)
#   trivy     filesystem scan: vulnerable dependencies (lock files) + misconfiguration (Dockerfiles)
#   checkov   Terraform static analysis (soft-fail on findings already accepted in .checkov.yaml)
# Results are published as SARIF/JSON pipeline artifacts.
parameters:
  - name: hostedImage
    type: string
    default: ubuntu-24.04
  - name: failOnFindings
    type: boolean
    default: true

jobs:
  - job: Security
    displayName: Secrets, dependency and IaC scanning
    pool:
      vmImage: ${{ parameters.hostedImage }}
    timeoutInMinutes: 45
    steps:
      - checkout: self
        fetchDepth: 0
      - template: steps-setup.yml
        parameters:
          tools: gitleaks trivy checkov
      - script: |
          set -euo pipefail
          out="$(Build.ArtifactStagingDirectory)/security"; mkdir -p "$out"
          gitleaks dir . --redact --no-banner --report-format sarif --report-path "$out/gitleaks.sarif"
        displayName: gitleaks (secrets)
      - script: |
          set -euo pipefail
          out="$(Build.ArtifactStagingDirectory)/security"
          trivy fs --scanners vuln,misconfig,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --skip-dirs '**/node_modules' --skip-dirs '**/.terraform' \
            --format sarif --output "$out/trivy.sarif" --exit-code ${{ iif(parameters.failOnFindings, 1, 0) }} .
        displayName: trivy (dependencies, Dockerfiles)
      - script: |
          set -euo pipefail
          out="$(Build.ArtifactStagingDirectory)/security"
          args=(--directory . --framework terraform --quiet --compact --output cli --output sarif --output-file-path "$out")
          [[ -f .checkov.yaml ]] && args+=(--config-file .checkov.yaml)
          ${{ iif(parameters.failOnFindings, '', 'args+=(--soft-fail)') }}
          checkov "${args[@]}"
        displayName: checkov (Terraform)
      - task: PublishPipelineArtifact@1
        displayName: Publish scan results
        condition: not(canceled())
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/security
          artifact: security-$(System.JobAttempt)
