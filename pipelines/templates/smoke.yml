# HTTP smoke tests (job template) against endpoints published in deployment contracts.
# Runs on the VNet agent pool so private endpoints / internal ingress are reachable.
parameters:
  - name: environment
    type: string
  - name: settings
    type: object

jobs:
  - job: Smoke
    displayName: Smoke tests (contracts -> /healthz /readyz /version)
    timeoutInMinutes: 30
    cancelTimeoutInMinutes: 5
    workspace:
      clean: all
    variables:
      LAB_ENV: ${{ parameters.environment }}
      CONTRACTS_URL: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/contracts
      RECORDS_URL: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/deployments
    steps:
      - checkout: self
        fetchDepth: 1
      - task: DownloadPipelineArtifact@2
        displayName: Download selection
        retryCountOnTaskFailure: 2
        inputs:
          artifact: selection
          path: $(Pipeline.Workspace)/selection
      - template: steps-setup.yml
      - script: |
          set -euo pipefail
          # names/paths only, never values (metadata-only DSV calls with the deploy agent identity)
          python3 tools/secrets/check.py --env "$LAB_ENV"
        displayName: Check required Delinea DSV secret paths exist
      - task: AzureCLI@2
        displayName: Run smoke tests (bounded polling)
        inputs:
          azureSubscription: ${{ parameters.settings.planServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            mkdir -p "$(Build.ArtifactStagingDirectory)/smoke"
            set +e
            python3 tools/smoke/smoke.py --env "$LAB_ENV" --contracts "$CONTRACTS_URL" \
              --selection "$(Pipeline.Workspace)/selection/selection.json" \
              --out "$(Build.ArtifactStagingDirectory)/smoke/smoke-results.json" --timeout 600
            rc=$?
            set -e
            # verification outcome on the records: heal runs re-run components whose verification failed
            python3 tools/deploy/record.py verify --env "$LAB_ENV" --component '*' --store "$RECORDS_URL" \
              --smoke-results "$(Build.ArtifactStagingDirectory)/smoke/smoke-results.json" \
              || echo "##vso[task.logissue type=warning]verification not recorded (plan identity lacks write on deployments?)"
            exit $rc
      - task: PublishPipelineArtifact@1
        displayName: Publish smoke results
        condition: not(canceled())
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/smoke
          artifact: smoke-$(System.JobAttempt)
