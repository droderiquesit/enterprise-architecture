# One AzureCLI@2 step that runs Terraform with workload identity federation (steps template).
# The service connection is a compile-time value (ADO: "Service connections cannot be specified by
# variable"). No secret is mapped into this step: components with registry `secret_env` get their values from
# Delinea DSV only inside the terraform process (tf-plan.sh / tf-apply.sh -> tools/secrets/fetch.py exec, deploy
# agent managed identity, TF_SECRET_ENV=true); tf-env.sh disables xtrace.
parameters:
  - name: name
    type: string
  - name: displayName
    type: string
  - name: serviceConnection
    type: string
  - name: serviceConnectionId
    type: string
  - name: script
    type: string

steps:
  - task: AzureCLI@2
    name: ${{ parameters.name }}
    displayName: ${{ parameters.displayName }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        source pipelines/scripts/tf-env.sh
        ${{ parameters.script }}
    env:
      ARM_ADO_PIPELINE_SERVICE_CONNECTION_ID: ${{ parameters.serviceConnectionId }}
      SYSTEM_ACCESSTOKEN: $(System.AccessToken)
      SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
