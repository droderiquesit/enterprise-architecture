# The universal lab pipeline (extends template). Exactly two thin entry points pass typed parameters:
#   azure-pipelines.yml                scope: platform     IaC platform: foundation, platform, observability
#                                                          infrastructure; observability package release on
#                                                          tags observability-v*; nightly drift
#   azure-pipelines.applications.yml   scope: applications artifacts, Helm charts, deploy-* roots and the
#                                                          observability roots that read app contracts;
#                                                          triggered by its own CI and by successful platform runs
# Promotion (dev -> test -> prod) is `mode: promote` of either pipeline (environments/promotion.yaml).
# Protected resources (service connections, environments, deploy agent pool, variable groups) carry a
# "Required template" check pointing at THIS file, so only pipelines that extend it can use them
# (pipelines/README.md, "One-time Azure DevOps setup").
#
#   Select ──> Validate ──┐
#          └─> Security ──┴─> Build ─> P_<x> plan ─> C_<x> apply (generated, dependency ordered)
#                                     ─> Retire ─> Verify / Drift ─> Evidence
# PR builds (Build.Reason == PullRequest) compile ONLY Select/Validate/Security on Microsoft-hosted
# agents with no service connection, variable group or self-hosted pool: untrusted PR code never runs
# with credentials.
parameters:
  - name: scope
    type: string
    values: [platform, applications]
  - name: environment
    type: string
  - name: mode
    type: string
    default: auto
    values: [auto, manual, reconcile, drift, retire, promote, heal, hotfix]
  - name: sourceEnvironment          # promote mode: 'auto' = promote_from of environments/promotion.yaml
    type: string
    default: auto
  - name: components
    type: string
    default: ' '
  - name: withConsumers
    type: boolean
    default: false
  - name: dryRun
    type: boolean
    default: false

variables:
  - template: ../variables/tools.yml
  - template: ../variables/${{ parameters.environment }}.yml
  # Branching model (environments/branching.yaml): only main and release/* may apply. Runs of any other branch are
  # compiled as dry runs - no apply job, no environment, no approval request - whatever `dryRun` says (defence in
  # depth; the Select stage also refuses them with tools/config/branching.py).
  - name: DRY_RUN                      # read by generated stage conditions (variables['DRY_RUN'])
    value: ${{ lower(or(parameters.dryRun, not(or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/'))))) }}
  - name: LAB_ENV
    value: ${{ parameters.environment }}

stages:
  # observability package release: tag builds of the platform pipeline do nothing else
  - ${{ if and(eq(parameters.scope, 'platform'), startsWith(variables['Build.SourceBranch'], 'refs/tags/observability-v')) }}:
    - template: observability-release.yml
      parameters:
        hostedImage: ${{ variables.hostedImage }}
        feed: ${{ variables.observabilityFeed }}
  - ${{ else }}:
    - template: universal-stages.yml
      parameters:
        scope: ${{ parameters.scope }}
        environment: ${{ parameters.environment }}
        mode: ${{ parameters.mode }}
        sourceEnvironment: ${{ parameters.sourceEnvironment }}
        components: ${{ parameters.components }}
        withConsumers: ${{ parameters.withConsumers }}
        dryRun: ${{ or(parameters.dryRun, not(or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')))) }}
