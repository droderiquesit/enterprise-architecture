# Evidence job (job template): renders the deployment report from the selection, plan summaries,
# smoke/telemetry results and deployment records, uploads evidence to the `evidence` container and
# sends deployment markers.
parameters:
  - name: environment
    type: string
  - name: dryRun
    type: boolean
    default: false
  - name: settings
    type: object

jobs:
  - job: Evidence
    displayName: Deployment report + evidence
    timeoutInMinutes: 20
    variables:
      - group: ${{ parameters.settings.datadogVariableGroup }}
      - name: LAB_ENV
        value: ${{ parameters.environment }}
      - name: RECORDS_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/deployments
      - name: EVIDENCE_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/evidence
    steps:
      - checkout: self
        fetchDepth: 1
      - task: DownloadPipelineArtifact@2
        displayName: Download run artifacts (selection, plan summaries, smoke, telemetry)
        retryCountOnTaskFailure: 2
        inputs:
          buildType: current
          itemPattern: |
            selection/**
            plan-*/**
            smoke-*/**
            telemetry-*/**
            artifact-*/**
          path: $(Pipeline.Workspace)/run
      - template: steps-setup.yml
      - task: AzureCLI@2
        displayName: Render report + evidence, upload
        inputs:
          azureSubscription: ${{ parameters.settings.planServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            out="$(Build.ArtifactStagingDirectory)/evidence"; mkdir -p "$out"
            python3 tools/report/report.py deployment --run-dir "$(Pipeline.Workspace)/run" \
              --records "$RECORDS_URL" --env "$LAB_ENV" --run-id "$(Build.BuildId)" --commit "$(Build.SourceVersion)" \
              --out "$out/deployment-report.md" --evidence "$out/evidence.json"
            if [[ "${{ parameters.dryRun }}" != "True" ]]; then
              python3 tools/deploy/storecp.py put --store "$EVIDENCE_URL" \
                --key "$LAB_ENV/runs/$(Build.BuildId)/evidence.json" --file "$out/evidence.json"
              python3 tools/deploy/storecp.py put --store "$EVIDENCE_URL" \
                --key "$LAB_ENV/runs/$(Build.BuildId)/deployment-report.md" --file "$out/deployment-report.md"
            fi
      - ${{ if eq(parameters.dryRun, false) }}:
        - template: deployment-marker.yml
          parameters:
            environment: ${{ parameters.environment }}
            settings: ${{ parameters.settings }}
      - task: PublishPipelineArtifact@1
        displayName: Publish report + evidence
        condition: not(canceled())
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/evidence
          artifact: evidence-$(System.JobAttempt)
