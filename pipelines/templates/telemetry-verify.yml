# Telemetry verification (job template): calls the observability package's verifier
# (observability/tools/verify/telemetry_verify.py, owned by the observability team) with the run's
# selection. Datadog keys come from Delinea DSV (datadog-api-key, datadog-app-key) through tools/secrets/fetch.py exec
# with the deploy agent's managed identity: they exist only in the verifier process' environment - never echoed.
parameters:
  - name: environment
    type: string
  - name: settings
    type: object

jobs:
  - job: TelemetryVerify
    displayName: Telemetry verification (Datadog)
    dependsOn: Smoke
    timeoutInMinutes: 45
    cancelTimeoutInMinutes: 5
    workspace:
      clean: all
    variables:
      - name: LAB_ENV
        value: ${{ parameters.environment }}
      - name: RECORDS_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/deployments
    steps:
      - checkout: self
        fetchDepth: 1
      - task: DownloadPipelineArtifact@2
        displayName: Download selection
        retryCountOnTaskFailure: 2
        inputs:
          artifact: selection
          path: $(Pipeline.Workspace)/selection
      - template: steps-setup.yml
      - task: AzureCLI@2
        displayName: Verify telemetry (logs, traces, metrics, RUM)
        inputs:
          azureSubscription: ${{ parameters.settings.planServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
              set -euo pipefail
              out="$(Build.ArtifactStagingDirectory)/telemetry"; mkdir -p "$out"
              sel="$(Pipeline.Workspace)/selection/selection.json"
              verifier=observability/tools/verify/telemetry_verify.py
              if [[ ! -f "$verifier" ]]; then
                echo "##vso[task.logissue type=warning]$verifier not present; telemetry not verified (status stays 'deployed', not 'verified')"
                echo '{"result":"not-run","status":"not-run","reason":"verifier missing","components":{}}' > "$out/telemetry-results.json"
                exit 0
              fi
              # the verifier checks one journey (environments/<env>/environment.yaml datadog.telemetry_verification);
              # tools/smoke/telemetry.py builds its argv and maps the journey result onto this run's deployments
              mapfile -t argv < <(python3 tools/smoke/telemetry.py args --env "$LAB_ENV" --selection "$sel" \
                --site "$DD_SITE" --evidence "$out/telemetry-evidence.json" | python3 -c 'import json,sys; print("\n".join(json.load(sys.stdin)))')
              if [[ ${#argv[@]} -eq 0 ]]; then
                echo "no application deployment in this run: telemetry not verified"
                echo '{"result":"not-run","status":"not-run","reason":"no deployments","components":{}}' > "$out/telemetry-results.json"
                exit 0
              fi
              set +e
              python3 tools/secrets/fetch.py exec --env "$LAB_ENV" --map DD_API_KEY=datadog-api-key --map DD_APP_KEY=datadog-app-key -- \
                python3 "${argv[@]}"
              rc=$?
              set -e
              python3 tools/smoke/telemetry.py results --env "$LAB_ENV" --selection "$sel" \
                --evidence "$out/telemetry-evidence.json" --exit-code "$rc" --out "$out/telemetry-results.json"
              # verification outcome on the records: heal runs re-run components whose telemetry verification failed
              python3 tools/deploy/record.py verify --env "$LAB_ENV" --component '*' --store "$RECORDS_URL" \
                --telemetry-results "$out/telemetry-results.json" \
                || echo "##vso[task.logissue type=warning]telemetry verification not recorded on the deployment records"
              exit $rc
        env:
          DD_SITE: ${{ parameters.settings.datadogSite }}
      - task: PublishPipelineArtifact@1
        displayName: Publish telemetry results
        condition: not(canceled())
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/telemetry
          artifact: telemetry-$(System.JobAttempt)
