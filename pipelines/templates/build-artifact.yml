# One build job per artifact component (generated into the Build stage).
# "Built once per source fingerprint": the resolve step looks for an existing image tag / package
# named after the artifact's deploy fingerprint and skips the build when it exists. Output variable
# `ready.ready` = 'true' tells dependent component stages the artifact metadata is published.
parameters:
  - name: component
    type: string
  - name: jobName
    type: string
  - name: componentPath
    type: string
  - name: artifactName
    type: string
  - name: formats
    type: object
  - name: language
    type: string
  - name: timeoutMinutes
    type: number
    default: 60
  - name: environment
    type: string
  - name: settings
    type: object

jobs:
  - job: ${{ parameters.jobName }}
    displayName: Build ${{ parameters.component }}
    timeoutInMinutes: ${{ parameters.timeoutMinutes }}
    condition: and(succeeded(), eq(stageDependencies.Select.select.outputs['detect.build_${{ replace(parameters.component, '-', '_') }}'], 'true'))
    variables:
      LAB_ENV: ${{ parameters.environment }}
      BUILD_OUT: $(Build.ArtifactStagingDirectory)/build
      META_OUT: $(Build.ArtifactStagingDirectory)/artifact
      SELECTION_FILE: $(Pipeline.Workspace)/selection/selection.json
      CONTAINER_REGISTRY: ${{ parameters.settings.containerRegistry }}
      PACKAGES_URL: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/packages
      RECORDS_URL: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/deployments
    steps:
      - checkout: self
        fetchDepth: 1
      - task: DownloadPipelineArtifact@2
        displayName: Download selection
        retryCountOnTaskFailure: 2
        inputs:
          artifact: selection
          path: $(Pipeline.Workspace)/selection
      - template: steps-setup.yml
      - task: AzureCLI@2
        name: resolve
        displayName: Resolve existing artifact for this source fingerprint
        retryCountOnTaskFailure: 2
        inputs:
          azureSubscription: ${{ parameters.settings.buildServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            python3 tools/deploy/artifacts.py resolve --component "${{ parameters.component }}" \
              --selection "$SELECTION_FILE" --registry "$CONTAINER_REGISTRY" --packages-url "$PACKAGES_URL" \
              --name "${{ parameters.artifactName }}" --formats "${{ join(',', parameters.formats) }}" --out "$META_OUT"
      - ${{ each format in parameters.formats }}:
        - ${{ if eq(format, 'container-image') }}:
          - template: container-image.yml
            parameters:
              component: ${{ parameters.component }}
              componentPath: ${{ parameters.componentPath }}
              artifactName: ${{ parameters.artifactName }}
              settings: ${{ parameters.settings }}
        - ${{ if eq(format, 'zip-package') }}:
          - ${{ if eq(parameters.language, 'dotnet') }}:
            - template: build-dotnet.yml
              parameters:
                componentPath: ${{ parameters.componentPath }}
          - ${{ if eq(parameters.language, 'python') }}:
            - template: build-python.yml
              parameters:
                componentPath: ${{ parameters.componentPath }}
          - ${{ if in(parameters.language, 'workflow', 'generic') }}:
            - script: python3 tools/deploy/artifacts.py zip --src "${{ parameters.componentPath }}" --out "$(BUILD_OUT)/package.zip"
              displayName: Package ${{ parameters.componentPath }} as zip
              condition: and(succeeded(), ne(variables['ARTIFACT_EXISTS'], 'true'))
        - ${{ if eq(format, 'static-bundle') }}:
          - template: build-frontend.yml
            parameters:
              componentPath: ${{ parameters.componentPath }}
      - task: AzureCLI@2
        name: finalize
        displayName: Upload packages, write build metadata + artifact record
        inputs:
          azureSubscription: ${{ parameters.settings.buildServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            python3 tools/deploy/artifacts.py finalize --component "${{ parameters.component }}" \
              --selection "$SELECTION_FILE" --build-dir "$BUILD_OUT" --packages-url "$PACKAGES_URL" \
              --name "${{ parameters.artifactName }}" --out "$META_OUT" --records-url "$RECORDS_URL" --env "$LAB_ENV"
      - task: PublishPipelineArtifact@1
        displayName: Publish artifact metadata (digests, SBOM, provenance)
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/artifact
          artifact: artifact-${{ parameters.component }}
      - script: echo "##vso[task.setvariable variable=ready;isOutput=true]true"
        name: ready
        displayName: Mark artifact ready
