# One job per artifact component (generated into the Build stage). "Build once, promote":
#   first environment of a promotion chain (settings.promoteFrom == ''): resolve the image/package
#     tagged with the artifact's source fingerprint; build + push by digest only when it does not exist
#   later environments: `artifacts.py promote` copies exactly the digest / package sha256 that the
#     promoteFrom environment recorded for the same source fingerprint; build steps are not even compiled
# Outputs (step `ready`): ready='true', artifact=<attempt-aware pipeline artifact name with the build
# metadata>; plan/apply jobs map it via stageDependencies, so re-running this job never collides with
# an artifact name published by an earlier attempt.
parameters:
  - name: component
    type: string
  - name: jobName
    type: string
  - name: componentPath
    type: string
  - name: artifactName
    type: string
  - name: formats
    type: object
  - name: language
    type: string
  - name: timeoutMinutes
    type: number
    default: 60
  - name: environment
    type: string
  - name: settings
    type: object

jobs:
  - job: ${{ parameters.jobName }}
    displayName: Artifact ${{ parameters.component }}
    timeoutInMinutes: ${{ parameters.timeoutMinutes }}
    cancelTimeoutInMinutes: 5
    workspace:
      clean: all
    condition: and(succeeded(), eq(stageDependencies.Select.select.outputs['detect.build_${{ replace(parameters.component, '-', '_') }}'], 'true'))
    variables:
      - name: LAB_ENV
        value: ${{ parameters.environment }}
      - name: BUILD_OUT
        value: $(Build.ArtifactStagingDirectory)/build
      - name: META_OUT
        value: $(Build.ArtifactStagingDirectory)/artifact
      - name: SELECTION_FILE
        value: $(Pipeline.Workspace)/selection/selection.json
      - name: CONTAINER_REGISTRY
        value: ${{ parameters.settings.containerRegistry }}
      - name: PACKAGES_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/packages
      - name: RECORDS_URL
        value: https://${{ parameters.settings.stateStorageAccount }}.blob.core.windows.net/deployments
    steps:
      - checkout: self
        fetchDepth: 1
        clean: true
      - task: DownloadPipelineArtifact@2
        displayName: Download selection
        retryCountOnTaskFailure: 2
        inputs:
          artifact: selection
          path: $(Pipeline.Workspace)/selection
      - template: steps-setup.yml
      - ${{ if eq(parameters.settings.promoteFrom, '') }}:
        - task: AzureCLI@2
          name: resolve
          displayName: Resolve existing artifact for this source fingerprint
          retryCountOnTaskFailure: 2
          inputs:
            azureSubscription: ${{ parameters.settings.buildServiceConnection }}
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              python3 tools/deploy/artifacts.py resolve --component "${{ parameters.component }}" \
                --selection "$SELECTION_FILE" --registry "$CONTAINER_REGISTRY" --packages-url "$PACKAGES_URL" \
                --name "${{ parameters.artifactName }}" --formats "${{ join(',', parameters.formats) }}" --out "$META_OUT"
        - ${{ each format in parameters.formats }}:
          - ${{ if eq(format, 'container-image') }}:
            - template: container-image.yml
              parameters:
                component: ${{ parameters.component }}
                componentPath: ${{ parameters.componentPath }}
                artifactName: ${{ parameters.artifactName }}
                settings: ${{ parameters.settings }}
          - ${{ if and(eq(format, 'zip-package'), eq(parameters.component, 'img-dsv-fetch')) }}:
            - template: build-dsv-fetch.yml   # release binaries + SHA256SUMS, not a source zip
              parameters:
                componentPath: ${{ parameters.componentPath }}
          - ${{ if and(eq(format, 'zip-package'), ne(parameters.component, 'img-dsv-fetch')) }}:
            - ${{ if eq(parameters.language, 'dotnet') }}:
              - template: build-dotnet.yml
                parameters:
                  componentPath: ${{ parameters.componentPath }}
            - ${{ if eq(parameters.language, 'python') }}:
              - template: build-python.yml
                parameters:
                  componentPath: ${{ parameters.componentPath }}
            - ${{ if in(parameters.language, 'workflow', 'generic') }}:
              - script: |
                  set -euo pipefail
                  python3 tools/deploy/artifacts.py zip --src "${{ parameters.componentPath }}" --out "$(BUILD_OUT)/package.zip"
                displayName: Package ${{ parameters.componentPath }} as zip
                condition: and(succeeded(), ne(variables['ARTIFACT_EXISTS'], 'true'))
          - ${{ if eq(format, 'static-bundle') }}:
            - template: build-frontend.yml
              parameters:
                componentPath: ${{ parameters.componentPath }}
      - ${{ else }}:
        - task: AzureCLI@2
          name: promote
          displayName: Promote ${{ parameters.component }} from ${{ parameters.settings.promoteFrom }} (same digest, never rebuilt)
          inputs:
            azureSubscription: ${{ parameters.settings.buildServiceConnection }}
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              set -euo pipefail
              python3 tools/deploy/artifacts.py promote --component "${{ parameters.component }}" \
                --selection "$SELECTION_FILE" --env "$LAB_ENV" --source-env "${{ parameters.settings.promoteFrom }}" \
                --source-records-url "https://${{ parameters.settings.promoteFromStateStorageAccount }}.blob.core.windows.net/deployments" \
                --source-packages-url "https://${{ parameters.settings.promoteFromStateStorageAccount }}.blob.core.windows.net/packages" \
                --registry "$CONTAINER_REGISTRY" --source-registry "${{ parameters.settings.promoteFromContainerRegistry }}" \
                --packages-url "$PACKAGES_URL" --out "$META_OUT"
      - task: AzureCLI@2
        name: finalize
        displayName: Upload packages, write build metadata + artifact record
        inputs:
          azureSubscription: ${{ parameters.settings.buildServiceConnection }}
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            python3 tools/deploy/artifacts.py finalize --component "${{ parameters.component }}" \
              --selection "$SELECTION_FILE" --build-dir "$BUILD_OUT" --packages-url "$PACKAGES_URL" \
              --name "${{ parameters.artifactName }}" --out "$META_OUT" --records-url "$RECORDS_URL" --env "$LAB_ENV"
      - task: PublishPipelineArtifact@1
        displayName: Publish artifact metadata (digests, SBOM, provenance)
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/artifact
          artifact: artifact-${{ parameters.component }}-$(System.JobAttempt)
      - script: |
          set -euo pipefail
          echo "##vso[task.setvariable variable=ready;isOutput=true]true"
          echo "##vso[task.setvariable variable=artifact;isOutput=true]artifact-${{ parameters.component }}-$(System.JobAttempt)"
        name: ready
        displayName: Mark artifact ready
