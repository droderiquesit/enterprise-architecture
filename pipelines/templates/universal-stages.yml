# Lab stages of the universal pipeline (stage template, included by universal.yml for every build that
# is not an observability package release).
#   Select ──> Validate ──┐
#          └─> Security ──┴─> [applications: Build] ─> P_<x> plan ─> C_<x> apply ─> Retire
#                                                    ─> [applications: Verify] / Drift ─> Evidence
# Generated stages: pipelines/generated/<scope>-stages.yml (tools/pipeline/generate.py).
# PR builds compile only Select/Validate/Security: Microsoft-hosted agents, no service connection,
# variable group or self-hosted pool.
parameters:
  - name: scope
    type: string
    values: [platform, applications]
  - name: environment
    type: string
  - name: mode
    type: string
    values: [auto, manual, reconcile, drift, retire, promote, heal, hotfix]
  - name: sourceEnvironment
    type: string
  - name: components
    type: string
  - name: withConsumers
    type: boolean
  - name: dryRun
    type: boolean

stages:
  # ------------------------------------------------------------------ Select
  - stage: Select
    displayName: Select ${{ parameters.scope }} changes (${{ parameters.environment }})
    jobs:
      - job: select
        displayName: Detect changes
        timeoutInMinutes: 20
        cancelTimeoutInMinutes: 5
        ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
          pool:
            vmImage: ${{ variables.hostedImage }}
        ${{ else }}:
          pool:
            name: ${{ variables.deployPool }}
          workspace:
            clean: all
        steps:
          - checkout: self
            fetchDepth: 0               # merge-base / fingerprints need history
            clean: true
          - template: steps-setup.yml
          - script: |
              set -euo pipefail
              python3 -m tools.changeset graph
              python3 tools/config/resolve.py --env "${{ parameters.environment }}"
              python3 tools/config/promotion.py check --env "${{ parameters.environment }}" --mode "${{ parameters.mode }}" --dry-run "${{ lower(parameters.dryRun) }}"
              python3 tools/config/branching.py check --ref "$BUILD_SOURCEBRANCH" --reason "$(Build.Reason)" \
                --env "${{ parameters.environment }}" --mode "${{ parameters.mode }}" --dry-run "${{ lower(parameters.dryRun) }}"
              echo "##vso[build.addbuildtag]env-${{ parameters.environment }}"
              echo "##vso[build.addbuildtag]scope-${{ parameters.scope }}"
            displayName: Validate registry, environment and promotion policy
          - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
            - script: |
                set -euo pipefail
                target="${SYSTEM_PULLREQUEST_TARGETBRANCH#refs/heads/}"
                git fetch --no-tags origin "+refs/heads/${target}:refs/remotes/origin/${target}"
                mkdir -p "$(Build.ArtifactStagingDirectory)/selection"
                python3 -m tools.changeset select --mode pr --scope "${{ parameters.scope }}" --env "${{ parameters.environment }}" \
                  --target "$target" --out "$(Build.ArtifactStagingDirectory)/selection/selection.json" --ado
              name: detect
              displayName: Select (PR, merge-base diff, no credentials)
          - ${{ else }}:
            - task: AzureCLI@2
              name: detect
              displayName: Select (fingerprints, records, upstream contracts)
              inputs:
                azureSubscription: ${{ variables.planServiceConnection }}
                scriptType: bash
                scriptLocation: inlineScript
                inlineScript: |
                  set -euo pipefail
                  blob="https://${{ variables.stateStorageAccount }}.blob.core.windows.net"
                  extra=()
                  if [[ "${{ parameters.mode }}" == "promote" || "${{ parameters.mode }}" == "hotfix" ]]; then
                    extra+=(--source-env "$SOURCE_ENVIRONMENT"
                            --source-records-url "https://${{ variables.promoteFromStateStorageAccount }}.blob.core.windows.net/deployments")
                  fi
                  mkdir -p "$(Build.ArtifactStagingDirectory)/selection"
                  python3 -m tools.changeset select --mode "${{ parameters.mode }}" --scope "${{ parameters.scope }}" \
                    --env "${{ parameters.environment }}" --components "$COMPONENTS" \
                    ${{ iif(parameters.withConsumers, '--with-consumers', '') }} \
                    --records-url "$blob/deployments" --contracts-url "$blob/contracts" --build-reason "$(Build.Reason)" \
                    "${extra[@]}" --out "$(Build.ArtifactStagingDirectory)/selection/selection.json" --ado
              # free-text run parameters reach the script as data (environment), never as script text
              env:
                COMPONENTS: ${{ parameters.components }}
                SOURCE_ENVIRONMENT: ${{ parameters.sourceEnvironment }}
          - task: Cache@2
            displayName: Test result cache + timings (restore)
            continueOnError: true
            inputs:
              key: 'ci-testcache | "$(Agent.OS)" | ${{ parameters.scope }} | select | "$(Build.BuildId)"'
              restoreKeys: |
                ci-testcache | "$(Agent.OS)" | ${{ parameters.scope }}
              path: $(Pipeline.Workspace)/.ci-cache
          - script: |
              set -euo pipefail
              full=()
              # full runs (every suite, cache hits ignored: bounds cache poisoning): nightly schedules and release/*
              if [[ "$(Build.Reason)" == "Schedule" || "$BUILD_SOURCEBRANCH" == refs/heads/release/* ]]; then full=(--full); fi
              python3 -m tools.ci plan --selection "$(Build.ArtifactStagingDirectory)/selection/selection.json" \
                --scope "${{ parameters.scope }}" --env "${{ parameters.environment }}" \
                --cache "$(Pipeline.Workspace)/.ci-cache/testcache" --timings "$(Pipeline.Workspace)/.ci-cache/timings.json" \
                --max-legs "${{ variables.ciMaxLegs }}" "${full[@]}" \
                --out "$(Build.ArtifactStagingDirectory)/selection/ci-plan.json" --ado
            name: ciplan
            displayName: Plan tests (impact selection, test result cache, duration-balanced legs)
          - task: PublishPipelineArtifact@1
            displayName: Publish selection document
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/selection
              artifact: selection
      # Scheduled runs always use the default environment (dev): the dev heal schedule queues heal runs for the
      # promoted environments (tools/deploy/heal_queue.py; their apply stages stop at the lab-<env> approval).
      - ${{ if and(ne(variables['Build.Reason'], 'PullRequest'), eq(parameters.environment, 'dev')) }}:
        - job: heal_fanout
          displayName: Heal fan-out (promoted environments)
          condition: and(eq(variables['Build.Reason'], 'Schedule'), contains(variables['Build.CronSchedule.DisplayName'], 'heal'))
          timeoutInMinutes: 10
          cancelTimeoutInMinutes: 2
          pool:
            vmImage: ${{ variables.hostedImage }}
          steps:
            - checkout: self
              fetchDepth: 1
            - template: steps-setup.yml
            - script: python3 tools/deploy/heal_queue.py
              displayName: Queue heal runs (test/prod, same commit they last ran)
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)

  # ---------------------------------------------------------------- Validate
  - stage: Validate
    displayName: Validate (no credentials)
    dependsOn: Select
    condition: and(not(canceled()), in(dependencies.Select.result, 'Succeeded', 'SucceededWithIssues'))
    jobs:
      - template: validate.yml
        parameters:
          environment: ${{ parameters.environment }}
          hostedImage: ${{ variables.hostedImage }}
          maxParallel: ${{ variables.validateMaxParallel }}
          scope: ${{ parameters.scope }}
      - ${{ if eq(parameters.scope, 'applications') }}:
        - template: helm-charts.yml
          parameters:
            publish: false
            hostedImage: ${{ variables.hostedImage }}

  # ---------------------------------------------------------------- Security
  - stage: Security
    displayName: Security scans (no credentials)
    dependsOn: Select
    condition: and(not(canceled()), in(dependencies.Select.result, 'Succeeded', 'SucceededWithIssues'))
    jobs:
      - template: security-scan.yml
        parameters:
          hostedImage: ${{ variables.hostedImage }}

  # ---------------------------------------------------------- PR time budget
  - ${{ if eq(variables['Build.Reason'], 'PullRequest') }}:
    - stage: Budget
      displayName: PR time budget report
      dependsOn: [Select, Validate, Security]
      condition: and(not(canceled()), ne(dependencies.Select.result, 'Skipped'))   # also after failed validation
      jobs:
        - job: budget
          displayName: Time budget (evidence)
          timeoutInMinutes: 5
          cancelTimeoutInMinutes: 2
          pool:
            vmImage: ${{ variables.hostedImage }}
          steps:
            - checkout: self
              fetchDepth: 1
            - script: |
                set -euo pipefail
                out="$(Build.ArtifactStagingDirectory)/budget"; mkdir -p "$out"
                python3 tools/report/pr_budget.py --budget-minutes "${{ variables.prTimeBudgetMinutes }}" \
                  --out "$out/pr-budget.json" --markdown "$out/pr-budget.md"
                if [[ -f "$out/pr-budget.md" ]]; then echo "##vso[task.uploadsummary]$out/pr-budget.md"; fi
              displayName: PR time budget
              env:
                SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            - task: PublishPipelineArtifact@1
              displayName: Publish PR budget evidence
              condition: not(canceled())
              continueOnError: true
              inputs:
                targetPath: $(Build.ArtifactStagingDirectory)/budget
                artifact: pr-budget-$(System.JobAttempt)

  # --------------- [Build], plan, apply, retire, [verify], drift, evidence (generated per scope)
  - ${{ if ne(variables['Build.Reason'], 'PullRequest') }}:
    - template: ../generated/${{ parameters.scope }}-stages.yml
      parameters:
        environment: ${{ parameters.environment }}
        dryRun: ${{ parameters.dryRun }}
        settings:
          deployPool: ${{ variables.deployPool }}
          hostedImage: ${{ variables.hostedImage }}
          planServiceConnection: ${{ variables.planServiceConnection }}
          planServiceConnectionId: ${{ variables.planServiceConnectionId }}
          applyServiceConnection: ${{ variables.applyServiceConnection }}
          applyServiceConnectionId: ${{ variables.applyServiceConnectionId }}
          buildServiceConnection: ${{ variables.buildServiceConnection }}
          stateStorageAccount: ${{ variables.stateStorageAccount }}
          containerRegistry: ${{ variables.containerRegistry }}
          datadogSite: ${{ variables.datadogSite }}
          promoteFrom: ${{ variables.promoteFrom }}
          promoteFromStateStorageAccount: ${{ variables.promoteFromStateStorageAccount }}
          promoteFromContainerRegistry: ${{ variables.promoteFromContainerRegistry }}
          useAcrBuild: 'false'
          scope: ${{ parameters.scope }}
          stageLockBehavior: ${{ variables.stageLockBehavior }}
