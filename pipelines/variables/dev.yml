# Compile-time settings of environment "dev" (template variables file).
# Service connection names must be known at compile time, so they live here. Nothing here is secret
# (identifiers only). Replace every placeholder before the first run (pipelines/README.md "ADO setup").
variables:
  # Workload identity federation service connections; roles: bootstrap/README.md "Pipeline identities and least privilege"
  planServiceConnection: sc-lab-dev-plan
  planServiceConnectionId: "00000000-0000-0000-0000-000000000001"
  applyServiceConnection: sc-lab-dev-apply
  applyServiceConnectionId: "00000000-0000-0000-0000-000000000002"
  buildServiceConnection: sc-lab-dev-build
  # bootstrap outputs (state storage account with containers tfstate, contracts, plans, deployments, evidence, packages)
  stateStorageAccount: ehstdevtfstate00000
  containerRegistry: ehacrdev00000
  # agent pool on the deploy-agents subnet (foundation-deploy-agents) reaching private endpoints
  deployPool: foundation-deploy-agents
  # Delinea DSV identifiers; must equal the `secrets` section of environments/dev/environment.yaml (ENV004)
  dsvTenant: example-lab
  dsvTld: com
  dsvAuthProvider: azure-eh
  datadogSite: datadoghq.com
  # Promotion: '' = this environment builds; otherwise the Build stage promotes the digests `promoteFrom` recorded
  # (this environment's build identity needs AcrPull / Blob Data Reader on the source registry / deployments, packages)
  promoteFrom: ''
  promoteFromStateStorageAccount: ''
  promoteFromContainerRegistry: ''
  # Bounded parallelism of the Validate matrix (component stages are bounded by the deployPool agent count).
  validateMaxParallel: 8
  ciMaxLegs: 24                 # upper bound of test legs one run plans (tools/ci; jobs per stage stay far below 256)
  stageLockBehavior: runLatest   # per-component P_/C_ stage locks; dev: newer main runs supersede queued older ones (fingerprints make the latest a superset)
