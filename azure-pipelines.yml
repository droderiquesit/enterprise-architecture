# PLATFORM pipeline (IaC) of azure-enterprise-observability-lab - thin entry point.
#   scope platform: foundation-*, platform-*, observability infrastructure (obs-prereqs, obs-azure-integration,
#   obs-telemetry-transport, obs-kubernetes, obs-dbm); bootstrap is manual and never deployed here.
#   Tag builds `observability-v<semver>` only release the portable observability package.
# The APPLICATIONS pipeline (azure-pipelines.applications.yml) is triggered when a platform run on main succeeds.
# Everything runs in pipelines/templates/universal.yml (Required template of every protected resource).
# Operator guide: pipelines/README.md.

name: platform-$(Date:yyyyMMdd)$(Rev:.r)

# CI on main deploys the first environment of the promotion chain (dev). Paths are NOT used to decide what
# deploys: tools/changeset compares fingerprints with deployment records (a docs-only push selects nothing).
trigger:
  batch: true
  branches:
    include:
      - main
  tags:
    include:
      - observability-v*

# Azure Repos ignores YAML `pr:` triggers: PR validation = branch policy "Build validation" on main (both pipelines).

schedules:
  - cron: "17 2 * * *"          # 02:17 UTC nightly: drift detection of the platform scope (auto -> drift)
    displayName: Nightly platform drift detection (dev)
    branches:
      include:
        - main
    always: true                # drift is about the cloud, not the code
  - cron: "37 */2 * * *"         # self-healing: auto -> heal (displayName contains 'heal'; Build.CronSchedule.DisplayName)
    displayName: Platform heal (every 2 h, dev)
    branches:
      include:
        - main
    always: true                # failures are in records, not in code changes; heal selects only failed components

lockBehavior: sequential        # queue (do not cancel) runs waiting for exclusive locks

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:              # every environment of environments/promotion.yaml (lint: pipeline_templates.py)
      - dev
      - test
      - prod
  - name: mode
    displayName: Mode
    type: string
    default: auto
    values:
      - auto          # PR -> pr, 'heal' schedule -> heal, other schedule -> drift, otherwise deploy
      - manual        # only `components` (+ upstream planned without apply)
      - reconcile     # plan every enabled component, apply where the plan has changes
      - drift         # plan every enabled component, apply nothing, report drift
      - retire        # only scheduled retirements (environments/<env>/retirements.yaml)
      - promote       # test/prod: deploy what the source environment already runs (same code, same digests)
      - heal          # re-run only failed / partial / canceled components and failed verifications (never held ones)
      - hotfix        # release/<yyyy.mm> only: promote cherry-picked fixes to test/prod (changed components proven upstream)
  - name: sourceEnvironment
    displayName: Promote from (auto = environments/promotion.yaml)
    type: string
    default: auto
  - name: components
    displayName: Components (manual mode, comma separated)
    type: string
    default: ' '
  - name: withConsumers
    displayName: Manual mode - also plan/apply consumers
    type: boolean
    default: false
  - name: dryRun
    displayName: Dry run (plan only, no apply / destroy / records)
    type: boolean
    default: false

extends:
  template: pipelines/templates/universal.yml
  parameters:
    scope: platform
    environment: ${{ parameters.environment }}
    mode: ${{ parameters.mode }}
    sourceEnvironment: ${{ parameters.sourceEnvironment }}
    components: ${{ parameters.components }}
    withConsumers: ${{ parameters.withConsumers }}
    dryRun: ${{ parameters.dryRun }}
