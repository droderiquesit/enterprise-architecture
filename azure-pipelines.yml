# Universal pipeline of azure-enterprise-observability-lab (Azure DevOps, YAML) - thin entry point.
# Everything runs in pipelines/templates/universal.yml (required template of every protected resource).
# Operator guide: pipelines/README.md.

name: $(Date:yyyyMMdd)$(Rev:.r)

# CI on main deploys the first environment of the promotion chain (dev). Paths are deliberately NOT used
# to decide what deploys: tools/changeset compares fingerprints with deployment records, so a docs-only
# push (or an observability package release tag) selects nothing.
trigger:
  batch: true
  branches:
    include:
      - main

# Azure Repos ignores YAML `pr:` triggers: PR validation = branch policy "Build validation" on main.

schedules:
  - cron: "17 2 * * *"          # 02:17 UTC nightly: drift detection (auto mode -> drift on Schedule)
    displayName: Nightly drift detection (dev)
    branches:
      include:
        - main
    always: true                # drift is about the cloud, not the code

# Runs queue behind each other on resources with an exclusive lock check (environment lab-<env>);
# every generated plan/apply stage additionally takes a stage-level lock.
lockBehavior: sequential

parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:              # every environment of environments/promotion.yaml (lint: pipeline_templates.py)
      - dev
      - test
      - prod
  - name: mode
    displayName: Mode
    type: string
    default: auto
    values:
      - auto          # PR -> pr, schedule -> drift, otherwise deploy (fingerprints vs records)
      - manual        # only `components` (+ upstream planned without apply)
      - reconcile     # plan every enabled component, apply where the plan has changes
      - drift         # plan every enabled component, apply nothing, report drift
      - retire        # only scheduled retirements (environments/<env>/retirements.yaml)
  - name: components
    displayName: Components (manual mode, comma separated)
    type: string
    default: ' '
  - name: withConsumers
    displayName: Manual mode - also plan/apply consumers
    type: boolean
    default: false
  - name: dryRun
    displayName: Dry run (plan only, no apply / destroy / records)
    type: boolean
    default: false

extends:
  template: pipelines/templates/universal.yml
  parameters:
    environment: ${{ parameters.environment }}
    mode: ${{ parameters.mode }}
    components: ${{ parameters.components }}
    withConsumers: ${{ parameters.withConsumers }}
    dryRun: ${{ parameters.dryRun }}
    entry: universal
