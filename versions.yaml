# Machine-readable toolchain/runtime pins (see docs/architecture/ADR-0001-design-contract.md §2).
verified_on: "2026-10-09"
terraform:
  cli: "1.16.5"
  required_version: ">= 1.14.0, < 2.0.0"
  providers:
    hashicorp/azurerm: {version: "5.9.0", constraint: "~> 5.9"}
    Azure/azapi: {version: "2.13.0", constraint: "~> 2.13"}
    DataDog/datadog: {version: "4.25.0", constraint: "~> 4.25"}
    hashicorp/helm: {version: "3.3.0", constraint: "~> 3.3"}
    hashicorp/kubernetes: {version: "3.3.0", constraint: "~> 3.3"}
    hashicorp/random: {version: "3.9.1", constraint: "~> 3.9"}
    hashicorp/time: {version: "0.14.2", constraint: "~> 0.14"}
runtimes:
  dotnet: {version: "10.0", sdk: "10.0.401", support: "LTS", end_of_support: "2028-11-14"}
  python: {version: "3.13", end_of_support_functions: "2029-10"}
  node_build: {version: "24", minimum: "22"}
cli:
  helm: "4.3.0"            # chart lint/package/OCI push (pipelines/variables/tools.yml HELM_VERSION)
  helm3_compat: "3.22.0"   # chart tests also render with Helm 3
  kubeconform: "0.8.0"
  kind: "0.33.0"           # optional local smoke (tests/charts, HELLO_KIND_SMOKE=1)
  kubectl: "1.36.5"
kubernetes:
  aks_default_version: "1.36"   # platform/compute/aks settings default; kubeconform schemas 1.36.0
images:
  fluent_bit: "fluent/fluent-bit:5.1.3"
  datadog_agent: "gcr.io/datadoghq/agent:7.84.2"           # = observability/config/fleet-policy.yaml agent.image:agent.version
  datadog_serverless_init: "datadog/serverless-init:1.10.4"  # = fleet-policy agent.serverless_init.image:version (tools/validate/versions.py)
  ddot_collector: "datadog/ddot-collector:7.84.2"
  otel_collector_contrib: "otel/opentelemetry-collector-contrib:0.162.0"
  # img-dsv-fetch (observability/images/dsv-fetch, static Go binary; deployed by recorded digest, never by tag).
  # Kept equal to its VERSION / Dockerfile / build.sh by observability/images/dsv-fetch/tests/test_pins.py.
  dsv_fetch: "dsv-fetch:2.0.0"
  dsv_fetch_builder: "golang:1.24.13-bookworm@sha256:1a6d4452c65dea36aac2e2d606b01b4a029ec90cc1ae53890540ce6173ea77ac"
  dsv_fetch_base: "gcr.io/distroless/static-debian13:nonroot@sha256:e2e927ec666bae08560abb3c55d0659eceabb657f56b6782ab500a9fc7f555e3"
