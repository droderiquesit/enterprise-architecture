# hello-catalog-api on AKS - values exactly as rendered by applications/deployments/core-aks (terraform test fixture,
# run "defaults": internal-lb exposure, secretsMode dsv). Regenerate: REGEN_EXAMPLES=1 pytest tests/charts -k terraform
# Release: helm upgrade --install hello-catalog-api applications/charts/hello-service -n hello -f <this file>
autoscaling:
  enabled: true
  maxReplicas: 3
  minReplicas: 1
  targetCPUUtilizationPercentage: 70
dsv:
  auth: azure
  baseUrl: https://contoso.secretsvaultcloud.com/v1
  tenant: contoso
  tld: com
env:
  AZURE_CREDENTIAL_MODE: workload_identity
  CACHE_TTL_SECONDS: '60'
  DD_SITE: datadoghq.com
  DD_TAGS: application:enterprise-hello,domain:catalog,managed_by:terraform,owner:catalog_example.com,region:swedencentral,team:catalog,tier:high
  GIT_COMMIT: 0123abc
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://$(DD_AGENT_HOST):4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_TIMEOUT: '10000'
  OTEL_LOGS_EXPORTER: none
  OTEL_METRICS_EXPORTER: otlp
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_PYTHON_EXCLUDED_URLS: healthz,readyz,version
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: 'false'
  OTEL_PYTHON_LOG_CORRELATION: 'true'
  OTEL_RESOURCE_ATTRIBUTES: application=enterprise-hello,cloud.platform=azure_aks,cloud.provider=azure,deployment.environment=dev,deployment.environment.name=dev,domain=catalog,managed_by=terraform,owner=catalog_example.com,region=swedencentral,service.name=hello-catalog-api,service.namespace=enterprise-hello,service.version=src-555555555555555555555555,team=catalog,tier=high
  OTEL_SERVICE_NAME: hello-catalog-api
  OTEL_TRACES_EXPORTER: otlp
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: '1'
  PG_AUTH: entra
  PG_DATABASE: catalog
  PG_HOST: eh-psql-data-dev-sec.postgres.database.azure.com
  PG_PORT: '5432'
  PG_USER: hello-catalog-api
  REDIS_AUTH: none
  TELEMETRY_SDK: otel
faults:
  enabled: false
identity:
  clientId: 33333333-3333-3333-3333-000000000002
  tenantId: 00000000-0000-0000-0000-000000000000
  workloadIdentity: true
image:
  digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
  pullPolicy: IfNotPresent
  repository: ehcrshareddevabcde.azurecr.io/hello-catalog-api
ingress:
  className: webapprouting.kubernetes.azure.com
  enabled: false
  host: ''
  tls:
    enabled: true
    secretName: hello-bff-tls
k8sService:
  internalLoadBalancer: false
  port: 80
  type: ClusterIP
kind: deployment
logFile:
  enabled: false
networkPolicy:
  allowFromCIDRs: []
  allowFromNamespaces: []
  enabled: false
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
port: 8080
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 192Mi
secretEnv:
  FAULT_TOKEN: dsv://eh/dev/fault-token#value
secretsMode: dsv
secretsSync:
  secretName: ''
service:
  domain: catalog
  env: dev
  logsSource: python
  name: hello-catalog-api
  partOf: enterprise-hello
  tags:
    application: enterprise-hello
    domain: catalog
    managed_by: terraform
    owner: catalog_example.com
    region: swedencentral
    team: catalog
    tier: high
  team: catalog
  tier: high
  version: src-555555555555555555555555
serviceAccount:
  create: true
  name: hello-catalog-api
telemetry:
  agentHostFromHostIP: true
  agentLogSource: ''
  disableAgentLogCollection: true
  singleStepInstrumentation: false
topologySpread:
  enabled: true
  hostnameSkew: 1
  zoneSpread: false
