# hello-catalog-api on Azure Red Hat OpenShift - the shape applications/deployments/specialized renders into its
# contract (aro.helm.values) and scripts/deploy-aro.sh installs with `helm upgrade --install --rollback-on-failure`.
# OpenShift: no fixed runAsUser (restricted-v2 SCC assigns the UID), Route instead of an Ingress. Secrets as on AKS
# (secretsMode dsv, ADR-0001 section 14): the app reads Delinea DSV itself with Entra workload identity - platform-aro
# federates the hello-catalog-api identity with the managed-identity cluster's OIDC issuer for this service account,
# and the OpenShift pod-identity webhook injects AZURE_* env + the projected token (SA annotation + pod label below).
# No Key Vault, no Kubernetes Secret. PG_PASSWORD (settings.aro_catalog_secret_env) is a dsv:// reference, not a value.
kind: deployment
service:
  name: hello-catalog-api
  version: src-555555555555555555555555
  env: dev
  team: catalog
  domain: catalog
  tier: high
  logsSource: python
image:
  repository: ehcrshareddevabcde.azurecr.io/hello-catalog-api
  digest: sha256:5555555555555555555555555555555555555555555555555555555555555555
identity:
  clientId: 22222222-2222-2222-2222-000000000003
  tenantId: 00000000-0000-0000-0000-000000000000
  workloadIdentity: true
serviceAccount:
  create: true
  name: hello-catalog-api
port: 8080
env:
  AZURE_CREDENTIAL_MODE: workload_identity
  PG_HOST: eh-psql-data-dev-sec.postgres.database.azure.com
  PG_DATABASE: catalog
  PG_AUTH: password
  PG_USER: catalog_app
  REDIS_AUTH: none
  LOG_LEVEL: info
  OTEL_EXPORTER_OTLP_ENDPOINT: http://$(DD_AGENT_HOST):4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SERVICE_NAME: hello-catalog-api
secretEnv:
  PG_PASSWORD: dsv://eh/dev/catalog-pg-password#value
dsv:
  tenant: contoso
  tld: com
  baseUrl: https://contoso.secretsvaultcloud.com/v1
  auth: azure
secretsMode: dsv
resources:
  requests: {cpu: 100m, memory: 192Mi}
  limits: {cpu: 500m, memory: 512Mi}
autoscaling:
  enabled: false
replicas: 2
# observability 4.1.0: the Datadog node Agent on ARO (obs-kubernetes-aro) collects this container's stdout (Agent log
# source, no "[]" opt-out) and ships it to the Observability Pipelines Worker; DD_AGENT_HOST = node IP (host ports)
telemetry:
  agentHostFromHostIP: true
  disableAgentLogCollection: false
  agentLogSource: python
openshift:
  enabled: true
  route:
    enabled: true
