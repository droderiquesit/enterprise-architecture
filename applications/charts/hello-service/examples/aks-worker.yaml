# hello-worker on AKS - values exactly as rendered by applications/deployments/core-aks (terraform test fixture,
# run "defaults": internal-lb exposure, secretsMode dsv). Regenerate: REGEN_EXAMPLES=1 pytest tests/charts -k terraform
# Release: helm upgrade --install hello-worker applications/charts/hello-service -n hello -f <this file>
autoscaling:
  enabled: true
  maxReplicas: 3
  minReplicas: 1
  targetCPUUtilizationPercentage: 70
dsv:
  auth: azure
  baseUrl: https://contoso.secretsvaultcloud.com/v1
  tenant: contoso
  tld: com
env:
  AZURE_CREDENTIAL_MODE: workload_identity
  DD_SITE: datadoghq.com
  GIT_COMMIT: 0123abc
  HEALTH_PORT: '8081'
  LOG_LEVEL: info
  MESSAGING_MODE: servicebus
  OTEL_EXPORTER_OTLP_ENDPOINT: http://$(DD_AGENT_HOST):4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_TIMEOUT: '10000'
  OTEL_LOGS_EXPORTER: none
  OTEL_METRICS_EXPORTER: otlp
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_PYTHON_EXCLUDED_URLS: healthz,readyz,version
  OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: 'false'
  OTEL_PYTHON_LOG_CORRELATION: 'true'
  OTEL_RESOURCE_ATTRIBUTES: application=enterprise-hello,cloud.platform=azure_aks,cloud.provider=azure,deployment.environment=dev,deployment.environment.name=dev,domain=notifications,owner=fulfillment@example.com,region=swedencentral,service.namespace=enterprise-hello,service.version=src-777777777777777777777777,team=fulfillment,tier=medium
  OTEL_SERVICE_NAME: hello-worker
  OTEL_TRACES_EXPORTER: otlp
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: '1'
  SB_SUBSCRIPTION: notifications
  SB_TOPIC: order-events
  SERVICEBUS_FQDN: eh-sbns-msg-dev-sec.servicebus.windows.net
  TABLE_MODE: memory
faults:
  enabled: false
identity:
  clientId: 33333333-3333-3333-3333-000000000003
  tenantId: 00000000-0000-0000-0000-000000000000
  workloadIdentity: true
image:
  digest: sha256:7777777777777777777777777777777777777777777777777777777777777777
  pullPolicy: IfNotPresent
  repository: ehcrshareddevabcde.azurecr.io/hello-worker
ingress:
  className: webapprouting.kubernetes.azure.com
  enabled: false
  host: ''
  tls:
    enabled: true
    secretName: hello-bff-tls
k8sService:
  internalLoadBalancer: false
  port: 80
  type: ClusterIP
kind: worker
logFile:
  enabled: false
networkPolicy:
  allowFromCIDRs: []
  allowFromNamespaces: []
  enabled: false
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
port: 8081
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 192Mi
secretEnv: {}
secretsMode: dsv
secretsSync:
  secretName: ''
service:
  domain: notifications
  env: dev
  logsSource: python
  name: hello-worker
  partOf: enterprise-hello
  team: fulfillment
  tier: medium
  version: src-777777777777777777777777
serviceAccount:
  create: true
  name: hello-worker
telemetry:
  agentHostFromHostIP: true
  disableAgentLogCollection: true
topologySpread:
  enabled: true
  hostnameSkew: 1
  zoneSpread: false
