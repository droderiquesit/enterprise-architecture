# hello-bff on AKS - values exactly as rendered by applications/deployments/core-aks (terraform test fixture,
# run "defaults": internal-lb exposure, Key Vault CSI enabled). Regenerate: REGEN_EXAMPLES=1 pytest tests/charts -k terraform
# Release: helm upgrade --install hello-bff applications/charts/hello-service -n hello -f <this file>
autoscaling:
  enabled: true
  maxReplicas: 3
  minReplicas: 1
  targetCPUUtilizationPercentage: 70
env:
  ADAPTERS_JSON: '[]'
  AUTH_MODE: none
  CATALOG_API_URL: http://hello-catalog-api.hello.svc.cluster.local
  CORS_ALLOWED_ORIGINS: ''
  DD_SITE: datadoghq.com
  GIT_COMMIT: 0123abc
  LOG_LEVEL: info
  ORDERS_API_URL: http://hello-orders-api.hello.svc.cluster.local
  OTEL_DOTNET_AUTO_LOGS_ENABLED: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://$(DD_AGENT_HOST):4317
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_EXPORTER_OTLP_TIMEOUT: '10000'
  OTEL_LOGS_EXPORTER: none
  OTEL_METRICS_EXPORTER: otlp
  OTEL_PROPAGATORS: tracecontext,baggage
  OTEL_RESOURCE_ATTRIBUTES: application=enterprise-hello,cloud.platform=azure_aks,cloud.provider=azure,deployment.environment=dev,deployment.environment.name=dev,domain=storefront,owner=web@example.com,region=swedencentral,service.namespace=enterprise-hello,service.version=src-222222222222222222222222,team=web,tier=critical
  OTEL_SERVICE_NAME: hello-bff
  OTEL_TRACES_EXPORTER: otlp
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: '1'
faults:
  enabled: false
identity:
  clientId: 33333333-3333-3333-3333-000000000000
  tenantId: 00000000-0000-0000-0000-000000000000
  workloadIdentity: true
image:
  digest: sha256:2222222222222222222222222222222222222222222222222222222222222222
  pullPolicy: IfNotPresent
  repository: ehcrshareddevabcde.azurecr.io/hello-bff
ingress:
  className: webapprouting.kubernetes.azure.com
  enabled: false
  host: ''
  tls:
    enabled: true
    keyVaultCertificateUri: ''
    secretName: keyvault-hello-bff-tls
k8sService:
  internalLoadBalancer: true
  port: 80
  type: LoadBalancer
keyVault:
  enabled: true
  name: eh-kv-ident-dev-abcde
  tenantId: 00000000-0000-0000-0000-000000000000
kind: deployment
logFile:
  enabled: false
networkPolicy:
  allowFromCIDRs: []
  allowFromNamespaces:
  - app-routing-system
  enabled: false
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
port: 8080
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 192Mi
secretEnv:
  FAULT_TOKEN: https://eh-kv-ident-dev-abcde.vault.azure.net/secrets/fault-token
service:
  domain: storefront
  env: dev
  logsSource: csharp
  name: hello-bff
  partOf: enterprise-hello
  team: web
  tier: critical
  version: src-222222222222222222222222
serviceAccount:
  create: true
  name: hello-bff
telemetry:
  agentHostFromHostIP: true
  disableAgentLogCollection: true
topologySpread:
  enabled: true
  hostnameSkew: 1
  zoneSpread: false
