apiVersion: v2
name: hello-service
description: >-
  Generic application chart for every Enterprise Hello workload on Kubernetes (AKS, ARO, kind):
  HTTP services (Deployment + Service), background workers (Deployment with a health port) and
  scheduled jobs (CronJob). Digest-pinned images, workload identity, secret settings as Delinea DSV
  references resolved by the application (or a dsv-k8s syncer Secret), Datadog unified service tagging and the OTel instrumentation contract.
type: application
# Chart version: semver of the CHART (templates/schema), independent from the application version.
# Bump MINOR for backwards-compatible template/values additions, MAJOR for breaking values changes.
version: 2.1.1
# appVersion is informational only: one chart serves many applications. The deployed application version is
# `service.version` (DD_VERSION, app.kubernetes.io/version, tags.datadoghq.com/version), set per release by the
# deployer (Terraform / deploy script); `helm package --app-version` may override this field.
appVersion: "0.0.0"
kubeVersion: ">=1.30.0-0"
keywords: [enterprise-hello, datadog, opentelemetry, workload-identity]
home: https://learn.microsoft.com/azure/aks/workload-identity-overview
maintainers:
  - name: applications-layer
    email: platform-team@example.com
annotations:
  enterprise-hello/owner: applications-layer
