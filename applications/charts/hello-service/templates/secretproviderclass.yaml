{{- if include "hello-service.kvEnabled" . }}
{{- $name := include "hello-service.fullname" . }}
# Azure Key Vault provider for the Secrets Store CSI driver (AKS add-on azure-keyvault-secrets-provider),
# authenticated with the workload identity (clientID). Only versionless secret ids are referenced here.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $name }}-kv
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-service.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.identity.clientId | quote }}
    keyvaultName: {{ .Values.keyVault.name | quote }}
    tenantId: {{ .Values.keyVault.tenantId | quote }}
    objects: |
      array:
      {{- range $k := keys .Values.secretEnv | sortAlpha }}
        - |
          objectName: {{ index $.Values.secretEnv $k | splitList "/" | last }}
          objectType: secret
          objectAlias: {{ $k }}
      {{- end }}
  secretObjects:
    - secretName: {{ $name }}-kv
      type: Opaque
      data:
        {{- range $k := keys .Values.secretEnv | sortAlpha }}
        - objectName: {{ $k }}
          key: {{ $k }}
        {{- end }}
{{- end }}
