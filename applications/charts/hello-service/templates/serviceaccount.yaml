{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hello-service.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hello-service.labels" . | nindent 4 }}
  {{- if or .Values.identity.workloadIdentity .Values.serviceAccount.annotations }}
  annotations:
    {{- if .Values.identity.workloadIdentity }}
    azure.workload.identity/client-id: {{ .Values.identity.clientId | quote }}
    {{- with .Values.identity.tenantId }}
    azure.workload.identity/tenant-id: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
# Pods opt in explicitly (podTemplate automountServiceAccountToken) only for the workload identity token.
automountServiceAccountToken: false
{{- end }}
