[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-jobs"
version = "1.0.0"
description = "Enterprise Hello jobs: seed, reconcile-trigger, process-batch-items, daily-aggregate"
requires-python = ">=3.13,<3.14"
dependencies = ["hello-common", "azure-servicebus>=7.15", "azure-data-tables>=12.7", "azure-storage-blob>=12.31", "aiohttp>=3.14"]

[project.scripts]
hello-jobs = "hello_jobs.__main__:main"

[tool.uv.sources]
hello-common = { path = "../../shared/python/hello_common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: runs against real local docker containers (Service Bus emulator, Azurite)"]
addopts = "-m 'not integration'"
