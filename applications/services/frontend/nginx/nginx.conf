worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    # temp paths writable by the unprivileged user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # one JSON line per request (collected by the platform's log pipeline)
    log_format json escape=json '{"timestamp":"$time_iso8601","level":"INFO","message":"$request_method $uri $status",'
        '"logger":"nginx.access","service":"hello-frontend","http.method":"$request_method","http.url_details.path":"$uri",'
        '"http.status_code":$status,"duration_ms":$request_time,"network.bytes_written":$body_bytes_sent,'
        '"http.useragent":"$http_user_agent","traceparent":"$http_traceparent"}';
    access_log /dev/stdout json;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    include /etc/nginx/conf.d/*.conf;
}
