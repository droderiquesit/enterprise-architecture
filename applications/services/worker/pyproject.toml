[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-worker"
version = "1.0.0"
description = "Enterprise Hello notification worker (Service Bus order-events/notifications -> Table Storage)"
requires-python = ">=3.13,<3.14"
dependencies = ["hello-common", "azure-servicebus>=7.15", "azure-data-tables>=12.7", "aiohttp>=3.14"]

[project.scripts]
hello-worker = "hello_worker.__main__:main"

[tool.uv.sources]
hello-common = { path = "../../shared/python/hello_common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: runs against real local docker containers (Service Bus emulator, Azurite)"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
