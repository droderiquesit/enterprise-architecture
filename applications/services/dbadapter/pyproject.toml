[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hello-dbadapter"
version = "1.0.0"
description = "Enterprise Hello database adapter: one API, one deployment per database family (DB_FAMILY)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "hello-common",
  "mssql-python>=1.15",
  "psycopg[binary]>=3.3", "psycopg-pool>=3.3",
  "PyMySQL>=1.2",
  "azure-cosmos>=4.17",
  "pymongo>=4.18",
  "cassandra-driver>=3.30",
  "gremlinpython>=3.8",
  "azure-data-tables>=12.7",
  "redis>=8.1", "redis-entraid>=1.2",
  "azure-confidentialledger>=1.1",
  "azure-storage-blob>=12.26", "azure-storage-file-datalake>=12.21",
  "azure-search-documents>=12.0",
  "azure-kusto-data>=6.0", "azure-kusto-ingest>=6.0",
]

[project.scripts]
hello-dbadapter = "hello_dbadapter.__main__:main"

[tool.uv.sources]
hello-common = { path = "../../shared/python/hello_common", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: runs against real local docker containers"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
