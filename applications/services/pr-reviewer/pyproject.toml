[project]
name = "eh-pr-reviewer"
version = "1.0.0"
description = "Trusted Azure Function (Python v2 model, Flex Consumption) that reviews Azure DevOps pull requests with tools/review"
requires-python = ">=3.13,<3.14"
dependencies = ["hello-common", "azure-functions>=2.3", "azure-storage-queue>=12.18", "azure-storage-blob>=12.31", "anthropic>=1.13", "PyYAML>=6", "jsonschema>=4.26"]

[tool.uv.sources]
hello-common = { path = "../../shared/python/hello_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
