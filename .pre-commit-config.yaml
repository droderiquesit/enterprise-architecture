# Local hooks mirror the cheap CI gates (python3 -m tools.ci gates) so most failures never reach a PR.
#   pip install pre-commit && pre-commit install          (pre-commit run --all-files for everything)
# Generated files are REGENERATED by hooks (never hand-merged): pipelines/generated/*, .github/CODEOWNERS.
# Versions: ruff / gitleaks match pipelines/requirements-ci-tools.in and pipelines/variables/tools.yml.
default_stages: [pre-commit]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        name: ruff (syntax errors, undefined names)
        args: [--isolated, --select, "E9,F63,F7,F82"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: terraform-fmt
        name: terraform fmt
        entry: terraform fmt
        language: system
        files: \.(tf|tftest\.hcl)$
      - id: generated-stages
        name: regenerate pipelines/generated (registry -> stages)
        entry: python3 tools/pipeline/generate.py
        language: system
        pass_filenames: false
        files: ^(catalog/components\.yaml|tools/pipeline/|environments/)
      - id: codeowners
        name: regenerate .github/CODEOWNERS (registry owners)
        entry: python3 tools/ado/codeowners.py
        language: system
        pass_filenames: false
        files: ^(catalog/components\.yaml|environments/branching\.yaml|tools/ado/)
      - id: pipeline-lint
        name: pipeline lint + template limits
        entry: bash -c 'python3 tools/validate/pipeline_lint.py && python3 tools/validate/pipeline_templates.py'
        language: system
        pass_filenames: false
        files: ^(azure-pipelines.*\.yml|pipelines/|tools/validate/|catalog/components\.yaml)
      - id: registry
        name: registry graph + catalog + ci suites
        entry: bash -c 'python3 -m tools.changeset graph >/dev/null && python3 tools/catalog/validate.py && python3 -m tools.ci check'
        language: system
        pass_filenames: false
        files: ^(catalog/|tools/ci/|tools/changeset/)
      - id: ownership
        name: ownership rules (ADR-0001)
        entry: python3 tools/validate/ownership.py
        language: system
        pass_filenames: false
        files: \.tf$
      - id: shellcheck
        name: shellcheck (errors)
        entry: shellcheck -S error
        language: system
        types: [shell]
